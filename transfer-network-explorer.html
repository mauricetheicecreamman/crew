<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summer Transfer Network 2026</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f8;
      --text: #182233;
      --muted: #617087;
      --border: #d8e0ea;
      --primary: #1260d6;
      --primary-strong: #0a419d;
      --primary-soft: #dceaff;
      --incoming: #138a61;
      --outgoing: #dc6b22;
      --balanced: #3976c5;
      --loan: #7759c4;
      --free: #16856d;
      --fee: #2468c9;
      --unknown: #8c98a8;
      --special: #b26600;
      --selected: #d89300;
      --edge: #8b98aa;
      --shadow: 0 10px 30px rgba(24, 34, 51, 0.08);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --surface: #172131;
        --surface-2: #202d3f;
        --text: #edf3fb;
        --muted: #aab7c8;
        --border: #344256;
        --primary: #72a9ff;
        --primary-strong: #9fc4ff;
        --primary-soft: #263f65;
        --incoming: #4dc99c;
        --outgoing: #ff9a5c;
        --balanced: #78aaf1;
        --loan: #ac91f1;
        --free: #58cbb1;
        --fee: #7eaff4;
        --unknown: #8997aa;
        --special: #edb35d;
        --selected: #ffd166;
        --edge: #65758b;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; color: inherit; }
    button, select, input[type="search"] {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 9px;
    }
    button { cursor: pointer; padding: 8px 11px; }
    button:hover { border-color: var(--primary); }
    button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
      outline-offset: 2px;
    }
    .primary-button { background: var(--primary); border-color: var(--primary); color: #fff; }
    @media (prefers-color-scheme: dark) { .primary-button { color: #101722; } }
    .app { max-width: 1600px; margin: 0 auto; padding: 20px; }
    .app-header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 16px; }
    h1 { margin: 0 0 5px; font-size: clamp(25px, 3vw, 40px); line-height: 1.08; font-weight: 600; letter-spacing: -0.035em; }
    h2, h3 { margin: 0; font-weight: 600; }
    h2 { font-size: 17px; }
    h3 { font-size: 14px; }
    p { margin: 0; }
    .subtitle { color: var(--muted); max-width: 760px; }
    .header-note { color: var(--muted); text-align: right; white-space: nowrap; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); }
    .metric-label { display: block; color: var(--muted); font-size: 12px; }
    .metric-value { display: block; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .workspace { display: grid; grid-template-columns: 260px minmax(460px, 1fr) 320px; gap: 14px; align-items: start; }
    .panel, .graph-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel { padding: 15px; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .filter-group { border-top: 1px solid var(--border); padding-top: 13px; margin-top: 13px; }
    .filter-group:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .filter-label { display: block; font-weight: 600; margin-bottom: 7px; }
    .small { color: var(--muted); font-size: 12px; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    input[type="search"] { min-width: 0; width: 100%; padding: 8px 10px; }
    select { width: 100%; padding: 8px 9px; }
    .check-list { display: grid; gap: 7px; }
    .check-row { display: grid; grid-template-columns: 17px 1fr auto; gap: 7px; align-items: start; cursor: pointer; }
    .check-row input { margin: 2px 0 0; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .range-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    .range-pair { display: grid; gap: 3px; }
    details { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
    summary { cursor: pointer; font-weight: 600; }
    details ul { padding-left: 18px; margin: 8px 0 0; color: var(--muted); }
    .full-button { width: 100%; margin-top: 8px; }
    .graph-panel { min-width: 0; overflow: hidden; }
    .graph-toolbar { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .graph-status { color: var(--muted); }
    .canvas-wrap { position: relative; height: 610px; min-height: 420px; background: color-mix(in srgb, var(--surface) 95%, var(--primary-soft)); }
    #networkCanvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #networkCanvas.dragging { cursor: grabbing; }
    .tooltip {
      position: absolute; z-index: 3; max-width: 280px; pointer-events: none; opacity: 0;
      background: var(--text); color: var(--surface); border-radius: 8px; padding: 8px 10px;
      box-shadow: var(--shadow); transition: opacity 80ms linear;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip strong { display: block; margin-bottom: 2px; }
    .network-legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 9px; padding: 6px 8px; background: color-mix(in srgb, var(--surface) 90%, transparent); border-radius: 8px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .legend-item { display: inline-flex; gap: 4px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .timeline-area { border-top: 1px solid var(--border); padding: 10px 12px 12px; }
    .timeline-heading { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin-bottom: 5px; }
    #timelineCanvas { display: block; width: 100%; height: 64px; }
    .detail-panel { min-height: 704px; }
    .detail-empty { color: var(--muted); padding: 12px 0; }
    .detail-title { font-size: 21px; line-height: 1.2; margin-bottom: 4px; }
    .detail-subtitle { color: var(--muted); margin-bottom: 14px; }
    .detail-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .detail-stat { background: var(--surface-2); border-radius: 9px; padding: 8px 9px; }
    .detail-stat span { display: block; }
    .detail-stat .value { font-size: 17px; font-variant-numeric: tabular-nums; }
    .transfer-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 425px; overflow: auto; border-top: 1px solid var(--border); }
    .transfer-item { padding: 9px 1px; border-bottom: 1px solid var(--border); }
    .transfer-item button { padding: 0; border: 0; background: transparent; text-align: left; width: 100%; }
    .transfer-route { color: var(--muted); margin-top: 2px; }
    .deal-line { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
    .deal-type { font-weight: 600; }
    .flag-note { color: var(--special); margin-top: 4px; }
    .ranking { list-style: none; margin: 8px 0 0; padding: 0; }
    .ranking li { border-bottom: 1px solid var(--border); }
    .ranking button { display: grid; width: 100%; grid-template-columns: 1fr auto; border: 0; border-radius: 0; padding: 9px 2px; text-align: left; }
    .ranking button:hover { color: var(--primary); }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .route-pill { display: inline-block; padding: 3px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 230px minmax(430px, 1fr); }
      .detail-panel { grid-column: 1 / -1; min-height: 0; }
      .transfer-list { max-height: 360px; }
    }
    @media (max-width: 760px) {
      .app { padding: 12px; }
      .app-header { display: block; }
      .header-note { text-align: left; margin-top: 7px; white-space: normal; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .workspace { grid-template-columns: 1fr; }
      .filters-panel, .detail-panel { grid-column: auto; }
      .canvas-wrap { height: 500px; }
      .graph-toolbar { align-items: flex-start; }
    }

    /* Network-first full-screen layout */
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { overscroll-behavior: none; }
    .network-stage { position: fixed; inset: 0; background: var(--bg); }
    .network-stage .canvas-wrap { position: absolute; inset: 0; height: auto; min-height: 0; background: var(--bg); }
    .network-stage #networkCanvas { width: 100%; height: 100%; }
    .filter-toggle {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      min-height: 44px; padding: 9px 14px; background: var(--surface);
      border: 1px solid var(--border); box-shadow: var(--shadow); font-weight: 600;
    }
    .filter-toggle[aria-expanded="true"] { opacity: 0; pointer-events: none; }
    .filter-drawer {
      position: fixed; z-index: 12; top: 12px; bottom: 12px; left: 12px;
      width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      overflow-y: auto; overscroll-behavior: contain;
      transform: translateX(calc(-100% - 28px)); transition: transform 180ms ease;
      box-shadow: 0 16px 46px rgba(24, 34, 51, 0.18);
    }
    .filter-drawer.open { transform: translateX(0); }
    .drawer-header { position: sticky; top: -15px; z-index: 2; margin: -15px -15px 14px; padding: 14px 15px 10px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .drawer-status { color: var(--muted); margin: -4px 0 14px; }
    .compatibility-hooks { display: none !important; }
    .network-stage .tooltip { position: fixed; z-index: 9; }
    @media (max-width: 760px) {
      .filter-toggle { top: 10px; left: 10px; }
      .filter-drawer { top: 8px; left: 8px; bottom: 8px; width: min(320px, calc(100vw - 16px)); max-height: calc(100vh - 16px); }
    }
  </style>
</head>
<body>
  <main class="network-stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="networkCanvas" tabindex="0" role="img" aria-label="Interactive directed network of football club transfers"></canvas>
      <div class="tooltip" id="tooltip" role="tooltip"></div>
    </div>

    <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterDrawer">Filters</button>

    <aside class="panel filter-drawer" id="filterDrawer" aria-label="Network filters" aria-hidden="true">
      <div class="drawer-header"><h2>Filters</h2><button type="button" id="closeFilters">Close</button></div>
      <p class="drawer-status" id="graphStatus" aria-live="polite"></p>

      <div class="filter-group">
        <label class="filter-label" for="clubSearch">Find a club</label>
        <div class="search-row">
          <input type="search" id="clubSearch" list="clubSuggestions" placeholder="e.g. Liverpool">
          <button type="button" class="primary-button" id="findClub">Find</button>
        </div>
        <datalist id="clubSuggestions"></datalist>
      </div>

      <div class="filter-group">
        <div class="range-head"><span class="filter-label">Transfer dates</span><span class="small" id="dateRangeText"></span></div>
        <div class="range-pair">
          <label class="sr-only" for="dateStart">Start date</label><input type="range" id="dateStart" min="0" value="0">
          <label class="sr-only" for="dateEnd">End date</label><input type="range" id="dateEnd" min="0" value="0">
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label">Source section</span>
        <div class="check-list" id="sectionFilters"></div>
      </div>

      <div class="filter-group">
        <span class="filter-label">Deal type</span>
        <div class="check-list" id="dealFilters"></div>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="footballFilter">Football</label>
        <select id="footballFilter">
          <option value="All">All records</option>
          <option value="Men / not specified">Men / not specified</option>
          <option value="Women">Women</option>
        </select>
      </div>

      <div class="filter-group">
        <div class="range-head"><label class="filter-label" for="minActivity">Minimum club activity</label><span id="minActivityValue">1</span></div>
        <input type="range" id="minActivity" min="1" max="10" value="1">
        <p class="small">Hide clubs involved in fewer transfers.</p>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="edgeMode">Transfer lines</label>
        <select id="edgeMode">
          <option value="aggregate">Aggregate matching routes</option>
          <option value="individual">Show every transfer</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="nodeSize">Size clubs by</label>
        <select id="nodeSize">
          <option value="activity">Total transfer activity</option>
          <option value="incoming">Incoming transfers</option>
          <option value="outgoing">Outgoing transfers</option>
          <option value="fees">Stated fees</option>
          <option value="connections">Connected clubs</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="feeBasis">Fee basis</label>
        <select id="feeBasis">
          <option value="all">All stated amounts</option>
          <option value="exact">Exact and base amounts only</option>
        </select>
      </div>

      <button type="button" class="full-button" id="resetFilters">Reset filters</button>
    </aside>

    <div class="compatibility-hooks" aria-hidden="true">
      <span id="windowLabel"></span>
      <span id="metricTransfers"></span><span id="metricClubs"></span><span id="metricRoutes"></span>
      <span id="metricFeeLabel"></span><span id="metricFees"></span>
      <ul id="dataNotes"></ul>
      <canvas id="timelineCanvas"></canvas>
      <button id="clearSelection"></button><button id="fitView"></button><button id="resetLayout"></button><button id="downloadCsv"></button>
      <div id="detailContent"></div>
    </div>
  </main>

      const p = bezierPoint(g, 0.72), tangent = bezierTangent(g, 0.72), angle = Math.atan2(tangent.y,tangent.x);
      const arrow = selected ? 7 : 5;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-arrow*Math.cos(angle-0.55),p.y-arrow*Math.sin(angle-0.55)); ctx.lineTo(p.x-arrow*Math.cos(angle+0.55),p.y-arrow*Math.sin(angle+0.55)); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    function draw() {
      if (!state.graph) return;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
      const edges = state.edgeMode === 'aggregate' ? state.graph.routes : state.graph.individualEdges;
      edges.forEach(drawEdge);

      const labelSet = new Set();
      if (state.selected?.type === 'node') labelSet.add(state.selected.id);

      for (const node of state.graph.nodes) {
        const p = worldToScreen(positions.get(node.name));
        const r = nodeRadius(node);
        const selected = state.selected?.type === 'node' && state.selected.id === node.name;
        const hovered = state.hover?.type === 'node' && state.hover.id === node.name;
        ctx.save();
        ctx.globalAlpha = isConnectedToSelection(node.name) ? 1 : 0.16;
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle = selected ? css.selected : nodeColor(node); ctx.fill();
        ctx.lineWidth = selected || hovered ? 3 : 1;
        ctx.strokeStyle = selected || hovered ? css.text : css.bg; ctx.stroke();
        ctx.restore();
      }

      ctx.font = '500 12px "Avenir Next", Avenir, sans-serif';
      ctx.textBaseline = 'middle';
      for (const node of state.graph.nodes) {
        if (!labelSet.has(node.name)) continue;
        const p = worldToScreen(positions.get(node.name));
        const r = nodeRadius(node);
        const x = p.x + r + 5, y = p.y;
        ctx.save();
        ctx.globalAlpha = isConnectedToSelection(node.name) ? 1 : 0.2;
        ctx.lineWidth = 4; ctx.strokeStyle = css.bg; ctx.strokeText(node.name,x,y);
        ctx.fillStyle = css.text; ctx.fillText(node.name,x,y); ctx.restore();
      }
    }

    function drawTimeline() {
      if (!state.graph) return;
      tctx.setTransform(dpr,0,0,dpr,0,0);
      const w = timeline.clientWidth, h = timeline.clientHeight;
      tctx.clearRect(0,0,w,h);
      const counts = Array(maxDay+1).fill(0);
      for (const transfer of DATA.transfers) {
        if (state.sections.has(transfer.section) && state.deals.has(transfer.dealType) && (state.football === 'All' || transfer.gender === state.football)) counts[transfer.day]++;
      }
      const maxCount = Math.max(1,...counts);
      const gap = 1, barW = Math.max(1,(w-gap*(counts.length-1))/counts.length);
      counts.forEach((count,i) => {
        const bh = (h-15)*(count/maxCount);
        tctx.fillStyle = i >= state.startDay && i <= state.endDay ? css.primary : css.border;
        tctx.fillRect(i*(barW+gap),h-bh,barW,bh);
      });
      tctx.fillStyle = css.muted; tctx.font = '11px "Avenir Next", Avenir, sans-serif';
      tctx.fillText(formatDateISO(DATA.meta.firstDate),0,11);
      const last = formatDateISO(DATA.meta.lastDate), width = tctx.measureText(last).width;
      tctx.fillText(last,w-width,11);
    }

    function fitView(names = null) {
      const nodes = state.graph.nodes.filter(node => !names || names.has(node.name));
      if (!nodes.length) { view.scale=0.75; view.x=0; view.y=0; draw(); return; }
      const ps = nodes.map(node => positions.get(node.name));
      const minX=Math.min(...ps.map(p=>p.x)), maxX=Math.max(...ps.map(p=>p.x));
      const minY=Math.min(...ps.map(p=>p.y)), maxY=Math.max(...ps.map(p=>p.y));
      const availableW=Math.max(200,canvas.clientWidth-100), availableH=Math.max(200,canvas.clientHeight-100);
      const spacingZoom = names ? 1.3 : 1.5;
      view.scale=Math.max(0.18,Math.min(4.2,Math.min(availableW/Math.max(120,maxX-minX),availableH/Math.max(120,maxY-minY))*spacingZoom));
      view.x=-((minX+maxX)/2)*view.scale;
      view.y=-((minY+maxY)/2)*view.scale;
      draw();
    }

    function updateSummary() {
      const g = state.graph;
      $('#metricTransfers').textContent = g.transfers.length.toLocaleString('en-GB');
      $('#metricClubs').textContent = g.nodes.length.toLocaleString('en-GB');
      $('#metricRoutes').textContent = g.routes.length.toLocaleString('en-GB');
      const totalFee = g.transfers.reduce((sum,t) => sum + (feeIncluded(t) ? t.fee : 0),0);
      $('#metricFees').textContent = formatMoney(totalFee);
      $('#metricFeeLabel').textContent = state.feeBasis === 'all' ? 'All stated fees' : 'Exact/base fees';
      $('#graphStatus').textContent = `${g.transfers.length.toLocaleString('en-GB')} transfers connecting ${g.nodes.length.toLocaleString('en-GB')} clubs`;
      $('#dateRangeText').textContent = formatDateISO(dateFromDay(state.startDay)) + '–' + formatDateISO(dateFromDay(state.endDay));
    }

    function transferItem(transfer) {
      const flags = transfer.flags.length ? `<div class="flag-note small">${escapeHtml(transfer.flags.join(' · '))}</div>` : '';
      const terms = transfer.loanTerms ? ` · ${escapeHtml(transfer.loanTerms)}` : '';
      return `<li class="transfer-item"><button type="button" data-transfer="${transfer.id}">
        <strong>${escapeHtml(transfer.player)}</strong>
        <div class="transfer-route">${escapeHtml(transfer.from)} → ${escapeHtml(transfer.to)}</div>
        <div class="deal-line"><span class="deal-type">${escapeHtml(transfer.dealType)}${terms}</span><span>${escapeHtml(transfer.dealRaw)}</span></div>
        <div class="small">${formatDateISO(transfer.date, true)}${transfer.time ? ' · '+escapeHtml(transfer.time) : ''} · ${escapeHtml(transfer.section)}</div>${flags}
      </button></li>`;
    }
    function renderDetail() {
      const root = $('#detailContent');
      const clear = $('#clearSelection');
      clear.hidden = !state.selected;
      if (!state.selected) {
        const top = [...state.graph.nodes].sort((a,b)=>b.activity-a.activity || a.name.localeCompare(b.name)).slice(0,10);
        root.innerHTML = `<p class="detail-empty">Select a club or route in the network. The most active clubs in the current view are shown below.</p>
          <h3>Most active clubs</h3><ol class="ranking">${top.map(node => `<li><button type="button" data-club="${escapeHtml(node.name)}"><span>${escapeHtml(node.name)}</span><strong>${node.activity}</strong></button></li>`).join('')}</ol>`;
      } else if (state.selected.type === 'node') {
        const stat = state.graph.stats.get(state.selected.id);
        if (!stat) { state.selected=null; renderDetail(); return; }
        const related = [...stat.transfers].sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
        const neighbours = [...stat.connections].sort();
        root.innerHTML = `<h3 class="detail-title">${escapeHtml(stat.name)}</h3>
          <p class="detail-subtitle">${stat.activity} transfers with ${stat.connectionsCount} connected clubs</p>
          <div class="detail-stats">
            <div class="detail-stat"><span class="small">Arrivals</span><span class="value">${stat.incoming}</span></div>
            <div class="detail-stat"><span class="small">Departures</span><span class="value">${stat.outgoing}</span></div>
            <div class="detail-stat"><span class="small">Connections</span><span class="value">${stat.connectionsCount}</span></div>
            <div class="detail-stat"><span class="small">Stated fees</span><span class="value">${formatMoney(stat.fees)}</span></div>
          </div>
          <div class="detail-actions"><button type="button" id="fitClub">Fit club network</button></div>
          <h3>Connected clubs</h3><p style="margin:6px 0 10px">${neighbours.map(name=>`<button class="route-pill" type="button" data-club="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join('')}</p>
          <h3>Transfers</h3><ul class="transfer-list">${related.map(transferItem).join('')}</ul>`;
        $('#fitClub')?.addEventListener('click', () => fitView(new Set([stat.name,...stat.connections])));
      } else {
        const edges = state.edgeMode === 'aggregate' ? state.graph.routes : state.graph.individualEdges;
        const edge = edges.find(e=>e.id===state.selected.id) || state.graph.routes.find(e=>e.id===state.selected.id);
        if (!edge) { state.selected=null; renderDetail(); return; }
        const types = [...new Set(edge.transfers.map(t=>t.dealType))].join(', ');
        root.innerHTML = `<h3 class="detail-title">${escapeHtml(edge.source)} → ${escapeHtml(edge.target)}</h3>
          <p class="detail-subtitle">${edge.count} ${edge.count===1?'transfer':'transfers'} · ${escapeHtml(types)}</p>
          <div class="detail-stats">
            <div class="detail-stat"><span class="small">Transfers</span><span class="value">${edge.count}</span></div>
            <div class="detail-stat"><span class="small">Stated fees</span><span class="value">${formatMoney(edge.fee)}</span></div>
          </div>
          <div class="detail-actions"><button type="button" data-club="${escapeHtml(edge.source)}">Open ${escapeHtml(edge.source)}</button><button type="button" data-club="${escapeHtml(edge.target)}">Open ${escapeHtml(edge.target)}</button></div>
          <h3>Transfers on this route</h3><ul class="transfer-list">${edge.transfers.sort((a,b)=>b.date.localeCompare(a.date)).map(transferItem).join('')}</ul>`;
      }
      root.querySelectorAll('[data-club]').forEach(button => button.addEventListener('click',()=>selectNode(button.dataset.club,true)));
      root.querySelectorAll('[data-transfer]').forEach(button => button.addEventListener('click',()=>selectTransfer(button.dataset.transfer)));
    }

    function selectNode(name, fit = false) {
      if (!state.graph.stats.has(name)) return;
      state.selected = {type:'node',id:name};
      state.query = name;
      $('#clubSearch').value = name;
      if (fit) {
        const stat=state.graph.stats.get(name);
        fitView(new Set([name,...stat.connections]));
      }
      renderDetail(); draw();
    }
    function selectTransfer(id) {
      const transfer = state.graph.transfers.find(t=>t.id===id);
      if (!transfer) return;
      state.edgeMode='individual'; $('#edgeMode').value='individual';
      state.selected={type:'edge',id}; renderDetail(); draw();
    }

    function updateAll({fit=false}={}) {
      computeGraph();
      if (state.selected?.type==='node' && !state.graph.stats.has(state.selected.id)) state.selected=null;
      if (state.selected?.type==='edge') {
        const currentEdges = state.edgeMode==='aggregate'?state.graph.routes:state.graph.individualEdges;
        if (!currentEdges.some(e=>e.id===state.selected.id)) state.selected=null;
      }
      updateSummary(); renderDetail(); draw(); drawTimeline();
      if (fit) fitView();
    }

    function pointerPoint(event) {
      const rect=canvas.getBoundingClientRect(); return {x:event.clientX-rect.left,y:event.clientY-rect.top};
    }
    function hitTest(point) {
      let bestNode=null,bestDistance=Infinity;
      for (const node of state.graph.nodes) {
        const p=worldToScreen(positions.get(node.name)), distance=Math.hypot(point.x-p.x,point.y-p.y);
        if (distance<=nodeRadius(node)+6 && distance<bestDistance) { bestNode=node; bestDistance=distance; }
      }
      if (bestNode) return {type:'node',id:bestNode.name,data:bestNode};
      const edges=state.edgeMode==='aggregate'?state.graph.routes:state.graph.individualEdges;
      let bestEdge=null,bestEdgeDistance=7;
      for (const edge of edges) {
        const g=edgeGeometry(edge);
        for(let i=0;i<=14;i++){
          const p=bezierPoint(g,i/14),distance=Math.hypot(point.x-p.x,point.y-p.y);
          if(distance<bestEdgeDistance){bestEdgeDistance=distance;bestEdge=edge;}
        }
      }
      return bestEdge?{type:'edge',id:bestEdge.id,data:bestEdge}:null;
    }
    function showTooltip(hit, point) {
      const tip=$('#tooltip');
      if(!hit){tip.classList.remove('visible');return;}
      if(hit.type==='node'){
        const d=hit.data; tip.innerHTML=`<strong>${escapeHtml(d.name)}</strong>${d.incoming} arrivals · ${d.outgoing} departures<br>${d.connectionsCount} connected clubs`;
      } else {
        const d=hit.data; tip.innerHTML=`<strong>${escapeHtml(d.source)} → ${escapeHtml(d.target)}</strong>${d.count} ${d.count===1?'transfer':'transfers'} · ${escapeHtml(edgeType(d))}`;
      }
      tip.style.left=Math.min(wrap.clientWidth-290,Math.max(8,point.x+12))+'px'; tip.style.top=Math.max(8,point.y+12)+'px'; tip.classList.add('visible');
    }
    canvas.addEventListener('pointerdown',event=>{
      const point=pointerPoint(event),hit=hitTest(point); canvas.setPointerCapture(event.pointerId); canvas.classList.add('dragging');
      drag={start:point,last:point,moved:false,node:hit?.type==='node'?hit.id:null,viewX:view.x,viewY:view.y};
    });
    canvas.addEventListener('pointermove',event=>{
      const point=pointerPoint(event);
      if(drag){
        if(Math.hypot(point.x-drag.start.x,point.y-drag.start.y)>3)drag.moved=true;
        if(drag.node){const world=screenToWorld(point);positions.set(drag.node,world);}else{view.x=drag.viewX+point.x-drag.start.x;view.y=drag.viewY+point.y-drag.start.y;}
        drag.last=point;draw();return;
      }
      state.hover=hitTest(point); showTooltip(state.hover,point); canvas.style.cursor=state.hover?'pointer':'grab'; draw();
    });
    canvas.addEventListener('pointerup',event=>{
      const point=pointerPoint(event); const current=drag; drag=null; canvas.classList.remove('dragging');
      if(current&&!current.moved){
        const hit=hitTest(point);
        if(hit){state.selected={type:hit.type,id:hit.id};state.hover=hit;showTooltip(hit,point);}
        else{state.selected=null;state.hover=null;$('#tooltip').classList.remove('visible');}
        renderDetail();draw();
      }
    });
    canvas.addEventListener('pointerleave',()=>{if(!drag){state.hover=null;$('#tooltip').classList.remove('visible');draw();}});
    canvas.addEventListener('wheel',event=>{
      event.preventDefault(); const point=pointerPoint(event),before=screenToWorld(point); const factor=Math.exp(-event.deltaY*0.0012);
      view.scale=Math.max(0.15,Math.min(5,view.scale*factor)); const after=worldToScreen(before); view.x+=point.x-after.x;view.y+=point.y-after.y;draw();
    },{passive:false});
    canvas.addEventListener('dblclick',()=>fitView());

    function setFilterDrawer(open) {
      const drawer = $('#filterDrawer');
      drawer.classList.toggle('open', open);
      drawer.setAttribute('aria-hidden', String(!open));
      $('#filterToggle').setAttribute('aria-expanded', String(open));
      if (open) $('#clubSearch').focus();
    }
    $('#filterToggle').addEventListener('click',()=>setFilterDrawer(true));
    $('#closeFilters').addEventListener('click',()=>setFilterDrawer(false));
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){
        if($('#filterDrawer').classList.contains('open')) setFilterDrawer(false);
        else if(state.selected){state.selected=null;renderDetail();draw();}
      }
    });

    $('#sectionFilters').addEventListener('change',event=>{const name=event.target.dataset.section;if(!name)return;event.target.checked?state.sections.add(name):state.sections.delete(name);updateAll({fit:true});});
    $('#dealFilters').addEventListener('change',event=>{const name=event.target.dataset.deal;if(!name)return;event.target.checked?state.deals.add(name):state.deals.delete(name);updateAll({fit:true});});
    $('#footballFilter').addEventListener('change',event=>{state.football=event.target.value;updateAll({fit:true});});
    $('#dateStart').addEventListener('input',event=>{state.startDay=Math.min(Number(event.target.value),state.endDay);event.target.value=state.startDay;updateAll();});
    $('#dateEnd').addEventListener('input',event=>{state.endDay=Math.max(Number(event.target.value),state.startDay);event.target.value=state.endDay;updateAll();});
    $('#minActivity').addEventListener('input',event=>{state.minActivity=Number(event.target.value);$('#minActivityValue').textContent=state.minActivity;updateAll();});
    $('#edgeMode').addEventListener('change',event=>{state.edgeMode=event.target.value;state.selected=null;updateAll();});
    $('#nodeSize').addEventListener('change',event=>{state.nodeSize=event.target.value;draw();});
    $('#feeBasis').addEventListener('change',event=>{state.feeBasis=event.target.value;updateAll();});
    $('#clubSearch').addEventListener('input',event=>{state.query=event.target.value;draw();});
    $('#clubSearch').addEventListener('keydown',event=>{if(event.key==='Enter')$('#findClub').click();});
    $('#findClub').addEventListener('click',()=>{
      const query=$('#clubSearch').value.trim().toLowerCase(); if(!query)return;
      const match=state.graph.nodes.find(n=>n.name.toLowerCase()===query)||state.graph.nodes.find(n=>n.name.toLowerCase().includes(query));
      if(match)selectNode(match.name,true);else{$('#graphStatus').textContent='No visible club matches “'+$('#clubSearch').value.trim()+'”. Try resetting filters.';}
    });
    $('#clearSelection').addEventListener('click',()=>{state.selected=null;state.query='';$('#clubSearch').value='';renderDetail();draw();});
    $('#fitView').addEventListener('click',()=>fitView());
    $('#resetLayout').addEventListener('click',()=>{positions.clear();for(const [name,p] of initialPositions)positions.set(name,{...p});fitView();});
    $('#resetFilters').addEventListener('click',()=>{
      state.sections=new Set(sectionNames);state.deals=new Set(dealNames);state.football='All';state.startDay=0;state.endDay=maxDay;state.minActivity=1;state.edgeMode='aggregate';state.nodeSize='activity';state.feeBasis='all';state.query='';state.selected=null;
      document.querySelectorAll('[data-section],[data-deal]').forEach(input=>input.checked=true);
      $('#footballFilter').value='All';$('#dateStart').value=0;$('#dateEnd').value=maxDay;$('#minActivity').value=1;$('#minActivityValue').textContent='1';$('#edgeMode').value='aggregate';$('#nodeSize').value='activity';$('#feeBasis').value='all';$('#clubSearch').value='';updateAll({fit:true});
    });
    $('#downloadCsv').addEventListener('click',()=>{
      const headers=['Date','Time','Section','Player','From','To','Deal type','Deal description','Fee','Fee qualifier'];
      const quote=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
      const rows=state.graph.transfers.map(t=>[t.date,t.time,t.section,t.player,t.from,t.to,t.dealType,t.dealRaw,t.fee??'',t.feeQualifier]);
      const csv=[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='filtered-transfers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    });

    const observer=new ResizeObserver(resizeCanvases);observer.observe(wrap);observer.observe(timeline);
    if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',resizeCanvases);}
    buildFilterControls();
    computeGraph();
    updateSummary();
    renderDetail();
    requestAnimationFrame(()=>{resizeCanvases();fitView();});
  </script>
</body>
</html>
