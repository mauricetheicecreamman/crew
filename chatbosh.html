<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatbosh</title>
  <style>
    :root{--ink:#272b2d;--muted:#70767a;--card:#fff;--line:#e3e4e5;--accent:#436f86;--accent-dark:#31596d;--their:#f0f1f2;--yours:#dcebf2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#dce6e9,#b8cbd2);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .app{width:min(100%,680px);height:min(860px,calc(100vh - 48px));min-height:580px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(39,43,45,.12);border-radius:26px;background:var(--card);box-shadow:0 24px 70px rgba(31,53,62,.22)}
    header{padding:22px 24px 18px;text-align:center;background:linear-gradient(#fbfcfc,#f3f6f7);border-bottom:1px solid var(--line)}
    .portrait{width:120px;height:120px;object-fit:cover;border:5px solid #fff;border-radius:50%;box-shadow:0 8px 24px rgba(39,43,45,.2)}
    h1{max-width:480px;margin:12px auto 3px;font:600 24px/1.18 Georgia,serif}.status{margin:0;color:var(--muted);font-size:13px}.status:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#5ca679}
    #chat{flex:1;overflow-y:auto;padding:26px 24px 18px;scroll-behavior:smooth}.row{display:flex;margin-bottom:15px;animation:arrive .28s ease-out}.row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;overflow-wrap:anywhere;border-radius:18px 18px 18px 5px;background:var(--their);line-height:1.45}.user .bubble{border-radius:18px 18px 5px 18px;background:var(--yours)}
    .typing{display:flex;align-items:center;gap:5px;width:max-content;padding:15px 18px}.typing i{width:7px;height:7px;border-radius:50%;background:#858c90;animation:bounce 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
    form{display:flex;gap:10px;padding:16px 18px 18px;border-top:1px solid var(--line);background:#fff}input{min-width:0;flex:1;padding:13px 18px;border:1px solid #c8ccce;border-radius:999px;outline:none;color:var(--ink);font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,111,134,.16)}button{padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 15px inherit;cursor:pointer;transition:.18s}button:hover{background:var(--accent-dark);transform:translateY(-1px)}button:disabled,input:disabled{opacity:.55;cursor:not-allowed;transform:none}
    @keyframes arrive{from{opacity:0;transform:translateY(7px)}}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
    @media(max-width:560px){body{padding:0}.app{height:100vh;min-height:0;border:0;border-radius:0}.portrait{width:96px;height:96px}h1{font-size:21px}#chat{padding:20px 16px}.bubble{max-width:87%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="Chatbosh chat">
    <header>
      <img class="portrait" src="chatbosh.png" alt="Portrait of Chatbosh">
      <h1>Chatbosh</h1>
      <p class="status" id="status">Online</p>
    </header>
    <section id="chat" role="log" aria-live="polite" aria-label="Conversation"></section>
    <form id="form">
      <input id="message" autocomplete="off" maxlength="1000" placeholder="Type a message…" aria-label="Your message" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const replies=["bosh","BOSH","Booooooshhhh","LE BOSH","YEEEEEEEEEEEEEEEEEEEEEEBOOOOOOOOOOOOSH"];
    const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),send=document.querySelector('#send'),status=document.querySelector('#status');let waiting=false;
    function scroll(){chat.scrollTop=chat.scrollHeight}
    function addMessage(text,who){const row=document.createElement('div'),bubble=document.createElement('div');row.className=`row ${who}`;bubble.className='bubble';bubble.textContent=text;row.append(bubble);chat.append(row);scroll()}
    function showTyping(){const row=document.createElement('div');row.className='row';row.id='typing';row.innerHTML='<div class="bubble typing" aria-label="Typing"><i></i><i></i><i></i></div>';chat.append(row);scroll()}
    form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text||waiting)return;addMessage(text,'user');input.value='';waiting=true;input.disabled=true;send.disabled=true;status.textContent='Typing…';showTyping();window.setTimeout(()=>{document.querySelector('#typing')?.remove();const reply=replies[Math.floor(Math.random()*replies.length)];addMessage(reply,'person');waiting=false;input.disabled=false;send.disabled=false;status.textContent='Online';input.focus()},2000)});
    addMessage('BOSH','person');input.focus();
  </script>
</body>
</html>
