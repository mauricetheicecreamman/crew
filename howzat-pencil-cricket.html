<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f31">
  <meta name="description" content="A complete four-innings pencil cricket Test match and series game.">
  <title>Howzat Pencil Cricket</title>
  <style>:root {
  --ink: #1d2a23;
  --green: #173f31;
  --green-2: #245543;
  --cream: #eee5d0;
  --paper: #fbf6e9;
  --red: #b64638;
  --blue-rule: rgba(63, 99, 124, .18);
  --rule: rgba(37, 61, 49, .24);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 5%, rgba(255,255,255,.55), transparent 31%),
    repeating-linear-gradient(0deg, rgba(45,57,40,.025) 0, rgba(45,57,40,.025) 1px, transparent 1px, transparent 4px),
    var(--cream);
  color: var(--ink);
  font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
}

button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.loading-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
}

.masthead {
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px clamp(20px, 5vw, 72px);
  border-bottom: 1px solid rgba(29,42,35,.24);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: var(--green);
  text-decoration: none;
}

.brand-mark {
  width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border: 2px solid var(--green);
  border-radius: 50%;
  color: var(--green);
  font: italic 800 22px Georgia, serif;
  transform: rotate(-5deg);
}

.brand strong, .brand small { display: block; }
.brand strong { font: 800 21px/1 Georgia, serif; letter-spacing: .03em; }
.brand small { margin-top: 4px; font-size: 8px; font-weight: 800; letter-spacing: .25em; }

.format-tag {
  margin: 0;
  padding: 8px 13px;
  border: 1px solid rgba(29,42,35,.42);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .18em;
}

.setup-shell { min-height: 100vh; }

.setup-stage {
  min-height: calc(100vh - 138px);
  display: grid;
  place-items: center;
  padding: 54px clamp(18px, 5vw, 70px) 64px;
}

.matchbook {
  position: relative;
  background: var(--paper);
  border: 1px solid rgba(36,54,43,.2);
  box-shadow: 0 24px 64px rgba(49,45,32,.17), 7px 7px 0 rgba(255,255,255,.38);
}

.setup-book {
  width: min(1050px, 100%);
  padding: 34px clamp(26px, 5vw, 60px) 28px;
}

.paper-clip {
  position: absolute;
  width: 19px;
  height: 68px;
  right: 28px;
  top: -22px;
  border: 3px solid #8e8b7f;
  border-radius: 12px;
  opacity: .72;
  transform: rotate(5deg);
}

.book-heading {
  position: relative;
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 18px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--green);
}

.book-heading p {
  margin: 0 0 3px;
  color: var(--red);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .18em;
}

.book-heading h1 {
  margin: 0;
  color: var(--green);
  font: 700 30px/1 Georgia, serif;
}

.book-number {
  padding: 7px;
  border: 1px solid var(--green);
  text-align: center;
  font: 700 9px/1.35 Georgia, serif;
  letter-spacing: .08em;
}

.book-format {
  color: #777970;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .14em;
}

.mode-selector {
  display: grid;
  grid-template-columns: auto repeat(3, minmax(105px, auto)) 1fr;
  align-items: center;
  gap: 7px;
  margin: 17px 0 -4px;
}

.mode-selector > span {
  margin-right: 4px;
  color: #77776f;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .16em;
}

.mode-selector button {
  border: 1px solid var(--rule);
  padding: 7px 10px;
  background: rgba(255,255,255,.3);
  color: #777970;
  cursor: pointer;
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.mode-selector button.selected {
  border-color: var(--green);
  background: var(--green);
  color: var(--paper);
}

.mode-selector small {
  margin-left: 5px;
  color: #85877f;
  font: italic 9px Georgia, serif;
}

.team-name-row {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 34px 1fr;
  align-items: end;
  gap: 16px;
  margin: 22px 0 18px;
}

label span {
  display: block;
  margin-bottom: 5px;
  color: #77776f;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .16em;
}

input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid rgba(36,54,43,.45);
  border-radius: 0;
  outline: 0;
  padding: 3px 1px 5px;
  color: var(--green);
  background: rgba(255,255,255,.15);
  font: italic 15px/1.2 Georgia, serif;
}

input:focus { border-color: var(--red); background: rgba(255,255,255,.5); }
.versus { align-self: center; padding-top: 12px; text-align: center; color: var(--red); font: italic 18px Georgia, serif; }

.squad-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(35px, 7vw, 86px);
}

.squad h2 {
  height: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
  overflow: hidden;
  color: var(--green);
  font: 700 14px Georgia, serif;
}

.saved-team-tools { 
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  margin-bottom: 7px;
}
.file-button { display: inline-grid; place-items: center; min-height: 27px; border: 1px solid var(--rule); padding: 0 8px; color: var(--green); cursor: pointer; font-size: 7px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.mode-selector .file-button { align-self: center; }
.lineup-library { margin: 15px 0; border: 1px solid var(--rule); padding: 10px 12px; }
.lineup-library summary { color: var(--green); cursor: pointer; font: 700 13px Georgia, serif; }
.lineup-library > div { display: grid; grid-template-columns: minmax(140px, 1fr) repeat(7, auto); align-items: center; gap: 5px; border-top: 1px solid var(--rule); padding: 7px 0; }
.lineup-library > div:first-of-type { margin-top: 8px; }
.lineup-library strong { color: var(--green); font: italic 10px Georgia, serif; }
.lineup-library button { border: 1px solid var(--rule); padding: 5px 7px; background: transparent; color: var(--green); cursor: pointer; font-size: 7px; font-weight: 800; text-transform: uppercase; }

.saved-team-tools select,
.saved-team-tools button {
  min-width: 0;
  height: 27px;
  border: 1px solid var(--rule);
  border-radius: 0;
  background: rgba(255,255,255,.35);
  color: var(--green);
  font-size: 8px;
}

.saved-team-tools select { padding: 0 6px; }
.saved-team-tools button {
  padding: 0 9px;
  cursor: pointer;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.saved-team-tools button:hover { border-color: var(--green); }

.match-options {
  display: grid;
  grid-template-columns: minmax(190px, 1fr) minmax(190px, 1fr) repeat(3, auto);
  align-items: end;
  gap: 10px;
  margin: 16px 0 20px;
  padding: 13px;
  border: 1px solid var(--rule);
  background: rgba(255,255,255,.24);
}
.match-options label { display: grid; gap: 5px; }
.match-options label > span { color: #7f8179; font-size: 7px; font-weight: 800; letter-spacing: .12em; }
.match-options input[type="text"], .match-options label:not(.option-check) input { min-width: 0; border: 0; border-bottom: 1px solid var(--green); padding: 5px 0; background: transparent; color: var(--green); font: italic 12px Georgia, serif; }
.match-options .option-check { grid-template-columns: auto 1fr; align-items: center; gap: 6px; min-height: 32px; cursor: pointer; }
.match-options .option-check input { accent-color: var(--red); }
.preset-strip { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: -8px 0 15px; }
.preset-strip span { color: #8a8c84; font-size: 7px; font-weight: 800; letter-spacing: .12em; }
.preset-strip button { border: 1px solid var(--rule); padding: 6px 9px; background: transparent; color: var(--green); cursor: pointer; font-size: 7px; font-weight: 800; text-transform: uppercase; }

.team-disc {
  flex: 0 0 25px;
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--green);
  color: var(--paper);
  font: 700 9px Georgia, serif;
}

.team-disc.red { background: var(--red); }
.squad-labels, .squad li {
  display: grid;
  grid-template-columns: 23px 1fr 92px;
  align-items: center;
}

.squad-labels {
  min-height: 22px;
  color: #98978e;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .13em;
}

.squad ol { list-style: none; margin: 0; padding: 0; }
.squad li { min-height: 28px; }
.squad li > span { color: #99978d; font: 8px Georgia, serif; }
.squad li input { padding: 2px 0 3px; font-size: 12px; }

.keeper-toggle, .role-toggles button {
  justify-self: end;
  width: 29px;
  height: 20px;
  border: 1px solid transparent;
  border-radius: 2px;
  background: transparent;
  color: #aaa79b;
  cursor: pointer;
  font-size: 7px;
  font-weight: 800;
}

.keeper-toggle:hover, .role-toggles button:hover { border-color: var(--rule); color: var(--green); }
.keeper-toggle.selected, .role-toggles button.selected { border-color: var(--red); background: var(--red); color: white; }
.role-toggles { display: flex; justify-content: flex-end; gap: 2px; }
.role-toggles button { width: 28px; height: 20px; border: 1px solid transparent; border-radius: 2px; background: transparent; color: #aaa79b; cursor: pointer; font-size: 7px; font-weight: 800; }

.keeper-selection {
  margin: 10px 0 0;
  padding-top: 9px;
  border-top: 1px solid var(--rule);
  color: #777970;
  font: italic 10px Georgia, serif;
}

.keeper-selection strong { color: var(--green); }

.start-button {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
  border: 0;
  padding: 15px 20px;
  background: var(--green);
  color: var(--paper);
  box-shadow: 3px 3px 0 var(--red);
  cursor: pointer;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.start-button:hover { background: var(--green-2); transform: translate(-1px,-1px); }
.start-button span:last-child { font-size: 18px; }
.setup-note { position: relative; margin: 12px 0 0; color: #88877f; text-align: center; font-size: 8px; }
.setup-notice { margin: 12px 0 -4px; color: var(--green); text-align: center; font: italic 10px Georgia, serif; }

footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 17px clamp(20px, 5vw, 72px);
  border-top: 1px solid var(--rule);
  color: #787971;
  font: italic 10px Georgia, serif;
}

footer p { margin: 0; }

/* Match scorebook */

.game-shell {
  min-height: 100vh;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(66,91,111,.065) 31px, rgba(66,91,111,.065) 32px);
}

.game-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(238,229,208,.94);
  backdrop-filter: blur(12px);
}

.match-title { display: grid; gap: 3px; text-align: center; }
.match-title span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .2em; }
.match-title strong { color: var(--green); font: 700 14px Georgia, serif; }
.match-title i { padding: 0 8px; color: var(--red); font-weight: 400; }

.text-button {
  border: 0;
  border-bottom: 1px solid var(--green);
  padding: 4px 0;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .13em;
}

.innings-ribbon {
  display: flex;
  justify-content: center;
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  background: rgba(251,246,233,.55);
  scrollbar-width: thin;
}

.innings-chip {
  min-width: 175px;
  display: flex;
  justify-content: space-between;
  gap: 17px;
  padding: 11px 15px;
  border-left: 1px solid var(--rule);
  color: #696b65;
}

.innings-chip:last-child { border-right: 1px solid var(--rule); background: rgba(255,255,255,.32); }
.innings-chip span { font-size: 8px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.innings-chip strong { color: var(--green); font: 700 13px Georgia, serif; white-space: nowrap; }

.scorebook-wrap {
  max-width: 1450px;
  margin: auto;
  padding: 50px clamp(16px, 4vw, 58px) 28px;
}

.scorebook {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 610px;
  background: var(--paper);
  border: 1px solid rgba(36,54,43,.2);
  box-shadow: 0 24px 64px rgba(49,45,32,.16), 7px 7px 0 rgba(255,255,255,.36);
}

.book-spine {
  position: absolute;
  z-index: 2;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 22px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, rgba(70,62,45,.05), rgba(70,62,45,.15), rgba(255,255,255,.35), rgba(70,62,45,.08));
  pointer-events: none;
}

.score-page {
  min-width: 0;
  padding: 28px clamp(18px, 3vw, 42px) 30px;
  background: var(--paper);
}

.batting-page { border-right: 1px solid rgba(182,70,56,.14); }

.page-heading {
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--green);
}

.page-heading p {
  margin: 0 0 4px;
  color: var(--red);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .18em;
}

.page-heading h2 { margin: 0; color: var(--green); font: 700 clamp(22px, 2.7vw, 31px)/1 Georgia, serif; }
.page-heading > div:first-child > span { color: #777970; font: italic 10px Georgia, serif; }
.big-score { display: grid; justify-items: end; }
.big-score strong { color: var(--green); font: 700 35px/.9 Georgia, serif; }
.big-score span { margin-top: 7px; color: #787b74; font-size: 7px; font-weight: 800; letter-spacing: .15em; }

.batting-table, .bowling-table { position: relative; }

.batting-row {
  min-height: 31px;
  display: grid;
  grid-template-columns: minmax(125px, 1.35fr) minmax(140px, 1.35fr) 32px 32px 28px 28px 42px;
  align-items: center;
  gap: 6px;
  padding: 0 3px;
  color: #555b54;
  font: italic 10px Georgia, serif;
}

.table-labels {
  color: #8b8b82 !important;
  font: 800 7px Avenir, sans-serif !important;
  letter-spacing: .12em;
}

.batting-row > span:first-child, .bowling-row > span:first-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batting-row > span:first-child i {
  width: 19px;
  display: inline-block;
  color: #aaa79b;
  font-size: 7px;
}

.batting-row > span:first-child b {
  margin-right: 5px;
  color: var(--red);
  font-size: 7px;
  font-style: normal;
}

.batting-row > span:nth-child(2) {
  overflow: hidden;
  color: #757870;
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batting-row > span:nth-child(n+3), .batting-row > strong { text-align: right; }
.batting-row > strong { color: var(--green); font-size: 12px; }
.batting-row.did-not-bat { opacity: .42; }
.batting-row.on-strike { background: rgba(23,63,49,.07); color: var(--green); }

.innings-summary {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 7px;
  padding: 9px 4px;
  border-top: 2px solid var(--green);
  color: #71746d;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.innings-summary b { color: var(--green); }
.innings-summary strong { color: var(--green); font: 700 21px Georgia, serif; letter-spacing: 0; }

.ledger-title {
  min-height: 31px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--green);
  color: var(--green);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .14em;
}

.ledger-title strong { color: #81847c; font-size: 7px; letter-spacing: .09em; }

.over-grid {
  max-height: 94px;
  overflow: hidden;
  padding-right: 3px;
  scrollbar-width: thin;
}

.over-line {
  min-height: 47px;
  display: grid;
  grid-template-columns: 145px 1fr;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(37,61,49,.12);
}

.over-line.current-over { background: rgba(182,70,56,.045); }

.over-meta {
  min-width: 0;
  display: grid;
  grid-template-columns: 25px 1fr;
  align-items: center;
  column-gap: 5px;
}

.over-meta b {
  grid-row: 1 / 3;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid var(--green);
  border-radius: 50%;
  color: var(--green);
  font: 700 10px Georgia, serif;
}

.over-meta span {
  overflow: hidden;
  color: var(--green);
  font: italic 9px Georgia, serif;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.over-meta small { color: #85877f; font-size: 7px; }
.balls { display: flex; flex-wrap: wrap; gap: 5px; }

.ball-box {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(23,63,49,.32);
  border-radius: 50%;
  background: rgba(255,255,255,.3);
  color: var(--green);
  font: 700 8px Avenir, sans-serif;
}

.ball-box.wicket { border-color: var(--red); background: var(--red); color: white; }
.ball-box.extra { border-style: dashed; color: var(--red); }
.ball-box.empty { border-style: dotted; opacity: .35; }

.bowling-ledger { margin-top: 22px; }
.bowling-row {
  min-height: 29px;
  display: grid;
  grid-template-columns: minmax(130px, 1fr) 35px 28px 32px 28px 28px 42px;
  align-items: center;
  gap: 6px;
  padding: 0 3px;
  color: #686b65;
  font: italic 10px Georgia, serif;
}

.bowling-row > span:not(:first-child), .bowling-row > strong { text-align: right; }
.bowling-row > strong { color: var(--green); }
.bowling-row.current-bowler { background: rgba(23,63,49,.07); color: var(--green); }
.bowling-row > span:first-child b { margin-right: 5px; color: var(--red); font-size: 7px; font-style: normal; }

.keeper-note {
  margin: 12px 0 0;
  padding-top: 9px;
  border-top: 1px solid var(--rule);
  color: #797b74;
  font: italic 9px Georgia, serif;
}

.match-controls {
  max-width: 1335px;
  margin: 0 auto 55px;
  padding: 0 clamp(16px, 4vw, 58px);
}

.bowler-choice, .dice-console {
  border: 1px solid rgba(36,54,43,.2);
  background: rgba(251,246,233,.68);
  box-shadow: 5px 5px 0 rgba(255,255,255,.28);
}

.bowler-choice { display: grid; grid-template-columns: 270px 1fr; gap: 28px; padding: 24px; }
.choice-heading { padding-right: 24px; border-right: 1px solid var(--rule); }
.choice-heading p, .turn-card p { margin: 0 0 5px; color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .18em; }
.choice-heading h2, .turn-card h2 { margin: 0; color: var(--green); font: 700 25px/1.05 Georgia, serif; }
.choice-heading > span, .turn-card > span { display: block; margin-top: 9px; color: #777a72; font: italic 9px/1.45 Georgia, serif; }

.bowler-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.bowler-grid button {
  min-height: 54px;
  display: grid;
  justify-items: start;
  align-content: center;
  gap: 4px;
  border: 1px solid var(--rule);
  padding: 8px 11px;
  background: rgba(255,255,255,.28);
  color: var(--green);
  cursor: pointer;
  text-align: left;
}

.bowler-grid button:hover { border-color: var(--green); background: rgba(23,63,49,.07); }
.bowler-grid button span { font: italic 11px Georgia, serif; }
.bowler-grid button small { color: #888981; font-size: 7px; }

.dice-console {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto 145px 34px 145px;
  align-items: center;
  gap: 18px;
  padding: 19px 24px;
}

.turn-card { min-width: 0; }
.turn-card h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.needed {
  display: grid;
  justify-items: center;
  min-width: 62px;
  padding: 8px;
  border: 1px solid var(--green);
  color: var(--green);
  font: 700 21px/1 Georgia, serif;
}

.needed small { margin-top: 5px; font: 800 7px Avenir, sans-serif; text-transform: uppercase; letter-spacing: .12em; }
.die-wrap { display: grid; justify-items: center; gap: 7px; opacity: .36; transition: opacity .2s, transform .2s; }
.die-wrap.active { opacity: 1; transform: translateY(-2px); }
.die-label { color: var(--green); font-size: 7px; font-weight: 800; letter-spacing: .15em; }

.die {
  width: 105px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 18px;
  cursor: pointer;
  box-shadow: inset 7px 7px 11px rgba(255,255,255,.17), inset -9px -9px 14px rgba(0,0,0,.19), 0 11px 19px rgba(33,39,31,.16);
}

.die:disabled { cursor: default; }
.die:not(:disabled):hover { transform: translateY(-3px) rotate(-1deg); }
.batting-die { background: #e4dece; color: var(--green); }
.bowling-die { background: var(--green); color: var(--paper); }
.die span { max-width: 88px; color: inherit; font: 800 30px/.92 Georgia, serif; text-align: center; overflow-wrap: anywhere; }
.bowling-die span { font-size: 17px; }
.die.rolling { animation: tumble .5s cubic-bezier(.4,0,.2,1); }

@keyframes tumble {
  0% { transform: rotate(0) scale(1); }
  35% { transform: rotate(15deg) scale(.9); }
  70% { transform: rotate(-11deg) scale(1.05); }
  100% { transform: rotate(0) scale(1); }
}

.dice-divider { min-height: 96px; display: grid; place-items: center; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
.dice-divider span { color: #91938b; font: italic 9px Georgia, serif; transform: rotate(-90deg); }

.recent { margin-top: 20px; }
.recent ol { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin: 8px 0 0; padding: 0; }
.recent li { min-height: 28px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid rgba(37,61,49,.1); color: #61645e; font: italic 10px Georgia, serif; }
.recent li > span { flex: 0 0 17px; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 50%; background: rgba(23,63,49,.12); color: var(--green); font: 700 7px Avenir, sans-serif; }
.recent li.out { color: var(--red); }
.recent li.out > span, .recent li.appeal > span { background: var(--red); color: white; }
.empty-log { color: #898980; font: italic 10px Georgia, serif; }

.decision-card, .result-card {
  max-width: 780px;
  margin: 70px auto;
  padding: clamp(36px, 6vw, 68px);
  border: 1px solid var(--rule);
  background: var(--paper);
  box-shadow: 0 22px 58px rgba(49,45,32,.15), 7px 7px 0 rgba(255,255,255,.35);
  text-align: center;
}

.eyebrow { margin: 0 0 19px; color: var(--red); font-size: 9px; font-weight: 800; letter-spacing: .18em; }
.decision-card h1, .result-card h1 { margin: 0; color: var(--green); font: 700 clamp(40px, 6vw, 65px)/.98 Georgia, serif; letter-spacing: -.04em; }
.decision-card > p:not(.eyebrow) { max-width: 560px; margin: 24px auto; color: #5d625c; font: italic 16px/1.55 Georgia, serif; }
.decision-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
.primary-action, .secondary-action { border: 1px solid var(--green); padding: 14px 21px; cursor: pointer; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; }
.primary-action { background: var(--green); color: var(--paper); box-shadow: 3px 3px 0 var(--red); }
.primary-action:disabled { opacity: .55; cursor: wait; }
.secondary-action { background: transparent; color: var(--green); }
.decision-card > small { display: block; margin-top: 23px; color: #8d8b82; font-size: 8px; }

.session-break-card {
  position: relative;
  overflow: hidden;
  margin-block: 45px;
}

.session-break-card::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(23,63,49,.12);
  pointer-events: none;
}

.session-break-card.lunch { background: linear-gradient(145deg, #fbf6e9, #f3ead2); }
.session-break-card.tea { background: linear-gradient(145deg, #fbf6e9, #eee4d2); }
.session-break-card.stumps { background: linear-gradient(145deg, #f8f1df, #e9dfc9); }

.lunch-menu {
  max-width: 560px;
  display: grid;
  gap: 8px;
  margin: 29px auto 31px;
  border-top: 3px double var(--green);
  border-bottom: 3px double var(--green);
  padding: 21px 16px;
}

.lunch-menu span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
.lunch-menu strong { color: var(--green); font: italic 23px/1.25 Georgia, serif; }
.lunch-menu small { color: #85877f; font: italic 9px Georgia, serif; }
.day-review {
  max-width: 620px;
  display: grid;
  gap: 8px;
  margin: 24px auto 28px;
  border-top: 3px double var(--green);
  border-bottom: 3px double var(--green);
  padding: 20px;
  text-align: left;
}
.day-review > span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
.day-review h2 { margin: 0; color: var(--green); font: 700 25px/1.08 Georgia, serif; }
.day-review p { margin: 0; color: #646861; font: 13px/1.45 Georgia, serif; }
.day-review > strong { color: var(--green); font: italic 14px/1.4 Georgia, serif; }
.day-review > div { display: grid; gap: 4px; border-left: 2px solid var(--red); padding-left: 11px; }
.day-review small { color: #70746d; font: 10px/1.4 Georgia, serif; }
.day-review em { color: #8a8c84; font: italic 9px Georgia, serif; }
.draw-note { max-width: 600px; margin: 18px auto 0; color: #73776f; font: italic 12px Georgia, serif; }

.result-card { position: relative; max-width: 900px; }
.result-stamp { position: absolute; right: 34px; top: 27px; width: 72px; height: 72px; display: grid; place-items: center; border: 3px double var(--red); border-radius: 50%; color: var(--red); font: 800 8px/1.3 Avenir, sans-serif; letter-spacing: .1em; transform: rotate(9deg); }
.result-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; max-width: 650px; margin: 35px auto 29px; border: 1px solid var(--rule); background: var(--rule); }
.result-totals > div { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px; padding: 17px; background: var(--paper); text-align: left; }
.result-totals span:not(.team-disc) { overflow: hidden; color: #6a6c66; font: italic 11px Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
.result-totals strong { color: var(--green); font: 700 16px Georgia, serif; }

.player-award {
  max-width: 650px;
  display: grid;
  gap: 4px;
  margin: -12px auto 29px;
  border: 2px solid var(--green);
  padding: 17px 20px;
  background: rgba(23,63,49,.055);
}

.player-award span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .18em; }
.player-award strong { color: var(--green); font: 700 25px Georgia, serif; }
.player-award small { color: #72756e; font: italic 10px Georgia, serif; }
.player-award em { margin-top: 4px; color: #898b84; font: italic 8px Georgia, serif; }
.match-report {
  width: min(700px, 100%);
  display: grid;
  gap: 9px;
  margin: 0 auto 28px;
  border: 1px solid var(--rule);
  border-top: 4px solid var(--green);
  padding: 22px 24px;
  background: rgba(255,255,255,.24);
  text-align: left;
}
.match-report > span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
.match-report h2 { margin: 0; color: var(--green); font: 700 27px/1.08 Georgia, serif; letter-spacing: -.02em; }
.match-report > strong { color: #555b54; font: italic 13px/1.45 Georgia, serif; }
.match-report-copy { columns: 2; column-gap: 24px; border-top: 1px solid var(--rule); padding-top: 10px; }
.match-report-copy p { break-inside: avoid; margin: 0 0 10px; color: #62665f; font: 11px/1.52 Georgia, serif; }
.match-report-performers { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--rule); padding-top: 9px; }
.match-report-performers small { padding: 5px 8px; background: rgba(23,63,49,.07); color: var(--green); font: 800 7px Avenir, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.match-report.compact { margin-block: 20px; background: rgba(251,246,233,.62); }
.result-series-actions { display: flex; justify-content: center; gap: 12px; }

.live-win-predictor {
  min-height: 38px;
  display: grid;
  grid-template-columns: auto minmax(105px, auto) minmax(180px, 1fr) minmax(105px, auto) auto;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--rule);
  padding: 6px 12px;
  background: rgba(251,246,233,.78);
}
.predictor-label { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .14em; white-space: nowrap; }
.live-win-predictor > strong { overflow: hidden; color: var(--green); font: italic 9px Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
.live-win-predictor > strong:nth-of-type(2) { color: var(--red); text-align: right; }
.live-win-predictor > strong b { margin-inline: 4px; font: 800 11px Avenir, sans-serif; }
.live-win-predictor > small { color: #92948c; font: italic 7px Georgia, serif; white-space: nowrap; }
.probability-bar { height: 10px; display: flex; overflow: hidden; border-radius: 8px; background: var(--rule); }
.probability-bar i:first-child { background: var(--green); transition: width .35s ease; }
.probability-bar i:last-child { background: var(--red); transition: width .35s ease; }

.win-probability-chart {
  width: min(700px, 100%);
  margin: 0 auto 28px;
  border: 1px solid var(--rule);
  padding: 13px 15px 10px;
  background: rgba(251,246,233,.72);
  text-align: left;
}
.chart-heading { display: flex; align-items: end; justify-content: space-between; gap: 15px; }
.chart-heading > div:first-child { display: grid; gap: 2px; }
.chart-heading span { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .15em; }
.chart-heading strong { color: var(--green); font: 700 17px Georgia, serif; }
.chart-legend { display: flex; align-items: center; gap: 5px; color: #71746c; font: italic 8px Georgia, serif; }
.chart-legend i { width: 15px; height: 3px; margin-left: 7px; background: var(--green); }
.chart-legend i:nth-of-type(2) { background: var(--red); }
.win-probability-chart svg { width: 100%; height: auto; display: block; }
.win-probability-chart svg text { fill: #8b8d85; font: 7px Avenir, sans-serif; }
.chart-grid { stroke: rgba(37,61,49,.15); stroke-width: 1; }
.chart-grid.mid { stroke-dasharray: 4 4; stroke: rgba(37,61,49,.28); }
.probability-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.probability-line.team-zero { stroke: var(--green); }
.probability-line.team-one { stroke: var(--red); }
.win-probability-chart > small { display: block; color: #888b83; font: italic 8px/1.35 Georgia, serif; text-align: center; }
.series-archive .win-probability-chart { width: auto; margin: 0 14px 24px; }

.archive { max-width: 1450px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 58px) 55px; }
.archive-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--rule); padding: 13px 16px; background: rgba(251,246,233,.5); color: var(--green); cursor: pointer; font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; }
.archive-toggle b { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: var(--paper); font-size: 8px; }
.archive-grid { display: grid; gap: 35px; margin-top: 28px; }
.archive-grid .scorebook { min-height: 560px; }

/* Compact play view */

.view-switcher {
  min-height: 46px;
  display: flex;
  justify-content: center;
  gap: 0;
  border-bottom: 1px solid var(--rule);
  background: rgba(251,246,233,.72);
}

.view-switcher button {
  min-width: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-left: 1px solid var(--rule);
  padding: 8px 18px 7px;
  background: transparent;
  color: #74776f;
  cursor: pointer;
}

.view-switcher button:last-child { border-right: 1px solid var(--rule); }
.view-switcher button.active { background: var(--green); color: var(--paper); }
.view-switcher button span { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .13em; }
.view-switcher button small { font: italic 9px Georgia, serif; opacity: .74; }

.play-view {
  width: min(1360px, calc(100% - 32px));
  min-height: calc(100vh - 234px);
  display: grid;
  grid-template-rows: none;
  grid-auto-rows: max-content;
  align-content: start;
  gap: 13px;
  margin: 0 auto;
  padding: 22px 0 28px;
}

.play-score {
  display: grid;
  grid-template-columns: minmax(280px, .72fr) minmax(420px, 1.15fr) minmax(250px, .62fr);
  border: 1px solid var(--rule);
  background: var(--paper);
  box-shadow: 5px 5px 0 rgba(255,255,255,.32);
}

.live-total {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 12px 20px;
  border-right: 1px solid var(--rule);
}

.live-total p {
  grid-column: 1 / -1;
  margin: 0 0 3px;
  color: var(--red);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.live-total > div { display: flex; align-items: baseline; gap: 13px; }
.live-total strong { color: var(--green); font: 700 42px/.9 Georgia, serif; }
.live-total span { color: #777970; font: italic 10px Georgia, serif; }
.live-total small { max-width: 225px; overflow: hidden; color: #6e726a; font-size: 7px; font-weight: 800; letter-spacing: .06em; text-align: right; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }

.live-total > .lead-trail {
  justify-self: end;
  border: 1px solid var(--green);
  padding: 5px 8px;
  background: var(--green);
  color: var(--paper);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.victory-equations {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 8px;
  margin-top: -4px;
}

.victory-equations strong {
  flex: 1;
  min-height: 27px;
  display: grid;
  place-items: center;
  border: 1px solid var(--red);
  padding: 4px 10px;
  background: rgba(182,70,56,.07);
  color: var(--red);
  font-size: clamp(7px, .8vw, 9px);
  line-height: 1;
  letter-spacing: .04em;
  text-align: center;
  text-transform: uppercase;
  white-space: nowrap;
}

.play-over {
  display: grid;
  grid-template-columns: 130px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
}

.play-section-label { display: grid; gap: 3px; }
.play-section-label span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .15em; }
.play-section-label strong { color: var(--green); font: 700 18px Georgia, serif; }
.play-balls { display: flex; flex-wrap: wrap; gap: 7px; }
.play-balls .ball-box { width: 30px; height: 30px; }
.play-over > small { color: #787b74; font: italic 9px Georgia, serif; white-space: nowrap; }
.play-over > small b { color: var(--green); font-style: normal; }

.live-press-box {
  min-width: 0;
  display: grid;
  align-content: center;
  gap: 5px;
  overflow: hidden;
  border-left: 1px solid var(--rule);
  padding: 10px 13px;
  background: linear-gradient(135deg, rgba(23,63,49,.055), rgba(182,70,56,.035));
}

.live-press-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.live-press-heading span {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--red);
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .12em;
  white-space: nowrap;
}

.live-press-heading span i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 3px rgba(182,70,56,.12);
  animation: pressBeacon 1.8s ease-in-out infinite;
}

.live-press-heading button {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: 6px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}

.live-press-latest {
  display: -webkit-box;
  overflow: hidden;
  color: var(--green);
  font: italic 11px/1.25 Georgia, serif;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  animation: pressUpdate .55s ease;
}

.live-press-box > small {
  overflow: hidden;
  color: #85877f;
  font-size: 6px;
  font-weight: 800;
  letter-spacing: .06em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

@keyframes pressBeacon {
  0%, 100% { opacity: .55; transform: scale(.88); }
  50% { opacity: 1; transform: scale(1); }
}

@keyframes pressUpdate {
  from { opacity: .25; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

.play-actors {
  display: grid;
  grid-template-columns: 1fr 1fr 1.12fr;
  gap: 13px;
}

.actor-card {
  min-width: 0;
  padding: 14px 17px;
  border: 1px solid var(--rule);
  background: rgba(251,246,233,.7);
}

.actor-card p {
  margin: 0 0 4px;
  color: #85877f;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .15em;
}

.actor-card.striker-card { border-top: 3px solid var(--red); padding-top: 12px; }
.actor-card.striker-card p { color: var(--red); }
.actor-card.bowler-card { border-top: 3px solid var(--green); padding-top: 12px; }
.actor-card h2 {
  margin: 0 0 9px;
  overflow: hidden;
  color: var(--green);
  font: 700 20px/1 Georgia, serif;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.actor-figures {
  display: flex;
  align-items: baseline;
  gap: 13px;
  overflow: hidden;
  color: #777a72;
  font-size: 8px;
  font-weight: 700;
  white-space: nowrap;
}

.actor-figures strong { color: var(--green); font: 700 27px Georgia, serif; }
.actor-figures .awaiting { font: italic 10px Georgia, serif; }

.match-utility-bar {
  height: 31px;
  min-height: 31px;
  max-height: 31px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(170px, auto) minmax(80px, 1fr) auto;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  border: 1px solid var(--rule);
  padding: 3px 8px;
  background: rgba(23,63,49,.05);
}
.match-utility-bar > strong { overflow: hidden; color: var(--red); font-size: 8px; letter-spacing: .08em; text-overflow: ellipsis; white-space: nowrap; }
.match-utility-bar > span { overflow: hidden; color: #74776f; font: italic 9px Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
.utility-press-line { min-width: 0; display: flex; align-items: center; gap: 7px; }
.utility-press-line b { flex: 0 0 auto; color: var(--red); font: 800 6px Avenir, sans-serif; letter-spacing: .1em; }
.utility-press-line i { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: pressUpdate .55s ease; }
.match-utility-bar > div { display: flex; gap: 5px; }
.match-utility-bar button, .series-export-bar button { border: 1px solid var(--rule); padding: 4px 7px; background: rgba(255,255,255,.38); color: var(--green); cursor: pointer; font-size: 7px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.series-export-bar button { padding: 6px 8px; }
.match-utility-bar button:disabled { opacity: .35; cursor: not-allowed; }

.game-header-actions { display: flex; align-items: center; gap: 16px; }
.press-box-launch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--green);
  padding: 6px 9px;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.press-box-launch span { color: var(--red); font-size: 9px; }
.result-media-button { margin: 12px auto 20px; }

.media-overlay {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: flex;
  justify-content: flex-end;
  background: rgba(16,42,34,.38);
  backdrop-filter: blur(2px);
}

.media-centre {
  width: min(560px, 94vw);
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr);
  border-left: 4px solid var(--green);
  background: #f7f0dc;
  box-shadow: -20px 0 60px rgba(15,42,33,.24);
  color: var(--green);
}

.media-header {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--green);
}
.media-header div { display: grid; gap: 5px; }
.media-header span { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .15em; }
.media-header strong { font: 700 27px/.9 Georgia, serif; letter-spacing: -.02em; }
.media-header button { width: 32px; height: 32px; border: 1px solid var(--green); background: transparent; color: var(--green); cursor: pointer; font: 22px/1 Georgia, serif; }

.broadcast-ticker {
  min-height: 34px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  border-bottom: 1px solid var(--rule);
  background: var(--green);
  color: var(--paper);
  overflow: hidden;
}
.broadcast-ticker b { align-self: stretch; display: grid; place-items: center; padding: 0 11px; background: var(--red); font-size: 7px; letter-spacing: .12em; }
.broadcast-ticker span { overflow: hidden; padding: 0 12px; font-size: 8px; font-weight: 800; letter-spacing: .04em; text-overflow: ellipsis; white-space: nowrap; }

.media-tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--green); }
.media-tabs button { min-height: 43px; border: 0; border-right: 1px solid var(--rule); background: transparent; color: #6f756c; cursor: pointer; font-size: 7px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.media-tabs button:last-child { border-right: 0; }
.media-tabs button.active { background: var(--green); color: var(--paper); }

.media-body { min-height: 0; overflow-y: auto; padding: 18px 20px 34px; }
.media-body > section + section, .media-body > article + section, .media-body > section + aside { margin-top: 18px; }
.commentary-lead, .analysis-lead { display: grid; gap: 8px; border-left: 4px solid var(--red); padding: 13px 15px; background: rgba(255,255,255,.5); }
.commentary-lead > span, .analysis-lead > span, .analysis-card > span, .turning-points > span, .pundit-panel > span, .innings-reports > span, .press-conference > span, .silly-dispatch > span { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .15em; }
.commentary-lead > strong, .analysis-lead > strong { font: 700 16px/1.35 Georgia, serif; }
.commentary-lead button { justify-self: start; border: 1px solid var(--rule); padding: 5px 8px; background: transparent; color: var(--green); cursor: pointer; font-size: 7px; font-weight: 800; text-transform: uppercase; }

.broadcast-settings { display: grid; grid-template-columns: 1.4fr .8fr; gap: 8px; margin-top: 10px; }
.broadcast-settings label, .broadcast-settings > div { display: grid; gap: 5px; border: 1px solid var(--rule); padding: 9px 10px; background: rgba(255,255,255,.34); }
.broadcast-settings span { color: #777c73; font-size: 6px; font-weight: 800; letter-spacing: .12em; }
.broadcast-settings select { width: 100%; border: 0; background: transparent; color: var(--green); font: 700 11px Georgia, serif; }
.broadcast-settings strong { font: 700 13px Georgia, serif; }
.session-live { display: grid; gap: 5px; margin: 10px 0 0; border: 1px solid var(--rule); padding: 10px 12px; color: #60675f; font: italic 10px/1.4 Georgia, serif; }
.session-live b { color: var(--red); font: 800 6px Avenir, sans-serif; letter-spacing: .13em; }

.commentary-feed { display: grid; gap: 0; margin: 16px 0 0; padding: 0; list-style: none; }
.commentary-feed li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; border-top: 1px solid var(--rule); padding: 10px 0; }
.commentary-feed li > span { color: #8a8c84; font-size: 7px; font-weight: 800; text-transform: uppercase; }
.commentary-feed p { margin: 0; color: #4f574f; font: 11px/1.4 Georgia, serif; }
.commentary-feed li.over p, .commentary-feed li.session p { color: var(--green); font-weight: 700; }
.commentary-feed li.analysis p { border-left: 2px solid var(--red); padding-left: 9px; color: var(--green); font-style: italic; }
.commentary-feed li.analysis > span { color: var(--red); }
.commentary-feed li.silly p { color: var(--red); font-style: italic; }

.pressure-card, .analysis-card, .turning-points, .pundit-panel, .innings-reports, .press-conference { border: 1px solid var(--rule); padding: 13px 14px; background: rgba(255,255,255,.34); }
.pressure-card > div:first-child { display: flex; align-items: baseline; justify-content: space-between; }
.pressure-card span { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .13em; }
.pressure-card strong { font: 700 15px Georgia, serif; }
.pressure-bar { height: 8px; margin: 9px 0 6px; overflow: hidden; background: rgba(23,63,49,.12); }
.pressure-bar i { height: 100%; display: block; background: linear-gradient(90deg, var(--green), #c9a33a 65%, var(--red)); }
.pressure-card small { color: #797d75; font: italic 8px Georgia, serif; }
.analysis-card h3 { margin: 7px 0 6px; font: 700 20px/1.08 Georgia, serif; }
.analysis-card p { margin: 0; color: #5f675f; font: 11px/1.45 Georgia, serif; }
.turning-points { display: grid; gap: 9px; }
.turning-points article { display: grid; grid-template-columns: 24px 1fr; gap: 8px; border-top: 1px solid var(--rule); padding-top: 8px; }
.turning-points article > b { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: var(--paper); font-size: 7px; }
.turning-points article p { display: grid; gap: 3px; margin: 0; }
.turning-points article strong { font: 700 11px Georgia, serif; }
.turning-points article small { color: #777c73; font-size: 7px; }
.analysis-media .win-probability-chart { margin: 18px 0 0; padding: 12px 8px; }

.newspaper-front { border: 1px solid var(--green); padding: 14px 16px 17px; background: #fffaf0; }
.newspaper-name { display: flex; align-items: baseline; gap: 6px; border-top: 3px double var(--green); border-bottom: 3px double var(--green); padding: 7px 0; font: 700 23px/.9 Georgia, serif; }
.newspaper-name > span { font-size: 8px; }
.newspaper-name small { margin-left: auto; color: var(--red); font: 800 6px Avenir, sans-serif; letter-spacing: .1em; }
.newspaper-front > p { margin: 7px 0 13px; color: #7b7d76; font-size: 6px; font-weight: 800; letter-spacing: .1em; text-align: center; }
.newspaper-front h2 { margin: 0; font: 700 30px/.96 Georgia, serif; letter-spacing: -.03em; }
.newspaper-front > strong { display: block; margin-top: 12px; color: #555c55; font: 11px/1.48 Georgia, serif; }
.pundit-panel, .innings-reports, .press-conference { display: grid; gap: 9px; }
.pundit-panel blockquote { display: grid; gap: 4px; margin: 0; border-top: 1px solid var(--rule); padding-top: 8px; color: #555d55; font: italic 10px/1.4 Georgia, serif; }
.pundit-panel blockquote b { color: var(--green); font: 800 6px Avenir, sans-serif; letter-spacing: .1em; }
.innings-reports p { display: grid; gap: 4px; margin: 0; border-top: 1px solid var(--rule); padding-top: 8px; color: #5c635b; font: 10px/1.45 Georgia, serif; }
.innings-reports p b { color: var(--green); font-size: 8px; text-transform: uppercase; }
.press-conference details { border-top: 1px solid var(--rule); padding-top: 8px; }
.press-conference summary { color: var(--green); cursor: pointer; font: 700 11px Georgia, serif; }
.press-conference p { margin: 7px 0 0; color: #626961; font: 10px/1.45 Georgia, serif; }
.silly-dispatch { display: grid; gap: 7px; border: 2px dashed var(--red); padding: 12px 14px; transform: rotate(-.35deg); background: rgba(182,70,56,.04); }
.silly-dispatch strong { color: var(--red); font: italic 14px/1.3 Georgia, serif; }

.fielding-summary { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 9px; color: #74776f; font: italic 9px Georgia, serif; }
.fielding-summary > strong { color: var(--red); font: 800 7px Avenir, sans-serif; letter-spacing: .12em; }

.play-dice, .play-bowler-picker {
  min-height: 185px;
  border: 1px solid var(--rule);
  background: rgba(251,246,233,.78);
  box-shadow: 5px 5px 0 rgba(255,255,255,.3);
}

.play-dice {
  display: grid;
  grid-template-columns: minmax(290px, 1fr) 150px 35px 150px;
  align-items: center;
  gap: 16px;
  padding: 16px 28px;
}

.play-prompt { min-width: 0; padding-right: 25px; border-right: 1px solid var(--rule); }
.play-prompt p, .picker-heading p { margin: 0 0 6px; color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
.play-prompt h2 { margin: 0; overflow: hidden; color: var(--green); font: 700 clamp(23px, 2.5vw, 34px)/1.02 Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
.play-prompt small { display: block; margin-top: 10px; color: #74776f; font: italic 10px Georgia, serif; }
.play-dice .die { width: 112px; }
.play-dice-arrow { color: var(--red); font: 700 19px Georgia, serif; text-align: center; }

.play-bowler-picker {
  display: grid;
  grid-template-columns: 250px 1fr;
  gap: 20px;
  padding: 18px 22px;
}

.picker-heading {
  align-self: stretch;
  display: grid;
  align-content: center;
  padding-right: 20px;
  border-right: 1px solid var(--rule);
}

.picker-heading strong { color: var(--green); font: italic 11px/1.45 Georgia, serif; }
.picker-options {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  align-content: center;
}

.picker-options button {
  min-width: 0;
  min-height: 58px;
  display: grid;
  justify-items: start;
  align-content: center;
  gap: 4px;
  border: 1px solid var(--rule);
  padding: 8px 10px;
  background: rgba(255,255,255,.3);
  color: var(--green);
  cursor: pointer;
  text-align: left;
}

.picker-options button:hover { border-color: var(--green); background: rgba(23,63,49,.07); }
.picker-options button span { width: 100%; overflow: hidden; font: italic 10px Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
.picker-options button small { color: #86887f; font-size: 7px; }

.celebration {
  position: fixed;
  z-index: 50;
  top: 112px;
  left: 50%;
  width: min(430px, calc(100% - 28px));
  display: grid;
  gap: 5px;
  transform: translateX(-50%) rotate(-1deg);
  border: 3px double var(--green);
  padding: 18px 48px 18px 22px;
  background: var(--paper);
  box-shadow: 0 18px 45px rgba(29,42,35,.25);
  animation: milestone-in .32s ease-out;
}

.celebration.bowling { border-color: var(--red); }
.celebration.partnership { border-color: var(--green); }
.celebration > button { position: absolute; top: 5px; right: 9px; border: 0; background: transparent; color: #777970; cursor: pointer; font-size: 22px; }
.celebration > span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .18em; }
.celebration > strong { color: var(--green); font: 700 24px/1.05 Georgia, serif; }
.celebration > small { color: #777970; font: italic 10px Georgia, serif; }

@keyframes milestone-in {
  from { opacity: 0; transform: translate(-50%, -18px) rotate(-1deg); }
  to { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }
}

.full-scorebook-view {
  max-width: 1450px;
  margin: 0 auto;
  padding: 30px clamp(16px, 4vw, 58px) 55px;
}
.quick-help { max-width: 1450px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 58px) 0; color: #75786f; font: italic 9px/1.45 Georgia, serif; }
.quick-help summary { cursor: pointer; color: var(--green); font: 800 7px Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.quick-help p { max-width: 850px; margin: 8px 0; }

/* Series */

.series-dashboard {
  max-width: 1450px;
  margin: 0 auto;
  padding: 30px clamp(16px, 4vw, 58px) 60px;
}

.series-hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto;
  align-items: center;
  gap: 30px;
  border: 1px solid var(--rule);
  padding: 25px clamp(20px, 4vw, 45px);
  background: var(--paper);
  box-shadow: 6px 6px 0 rgba(255,255,255,.34);
}

.series-hero p { margin: 0 0 6px; color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .18em; }
.series-hero h1 { margin: 0; color: var(--green); font: 700 clamp(27px, 4vw, 46px)/1 Georgia, serif; }
.series-hero h1 i { padding: 0 8px; color: var(--red); font-weight: 400; }
.series-hero > div:first-child > span { display: block; margin-top: 10px; color: #72756e; font: italic 12px Georgia, serif; }
.series-hero > button {
  position: absolute;
  right: 22px;
  bottom: -38px;
  border: 0;
  border-bottom: 1px solid var(--green);
  padding: 5px 0;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .1em;
}

.series-score { display: flex; align-items: center; gap: 16px; }
.series-score article { width: 115px; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 3px 8px; }
.series-score article > strong { color: var(--green); font: 700 35px/.8 Georgia, serif; text-align: right; }
.series-score article > span:not(.team-disc) { grid-column: 1 / -1; overflow: hidden; color: #73766f; font: italic 9px Georgia, serif; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.series-score > b { color: var(--red); font: 400 24px Georgia, serif; }
.series-name { display: block; margin-bottom: 5px; color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

.series-records { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 22px; }
.series-records article { display: grid; gap: 3px; border: 1px solid var(--rule); border-top: 3px solid var(--green); padding: 12px; background: var(--paper); }
.series-records span { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .12em; }
.series-records strong { color: var(--green); font: 700 25px Georgia, serif; }
.series-records small { color: #787a73; font: italic 9px Georgia, serif; }
.series-mvp { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; border: 2px double var(--red); padding: 13px 16px; background: rgba(182,70,56,.05); }
.series-mvp > span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .15em; }
.series-mvp > strong { color: var(--green); font: 700 22px Georgia, serif; }
.series-mvp > small { color: #73766f; font: italic 10px Georgia, serif; }
.series-export-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.series-export-bar > strong { margin-right: 7px; color: var(--red); font-size: 8px; letter-spacing: .12em; }
.match-comparison { margin-bottom: 24px; border: 1px solid var(--rule); padding: 15px; background: var(--paper); }
.match-comparison h2 { margin: 0 0 10px; color: var(--green); font: 700 19px Georgia, serif; }
.comparison-row { display: grid; grid-template-columns: 42px 1.2fr 1.6fr .7fr; gap: 9px; border-bottom: 1px solid rgba(37,61,49,.11); padding: 7px 2px; color: #74766f; font: italic 9px/1.3 Georgia, serif; }
.comparison-row > strong { color: var(--red); }
.comparison-row.labels { color: #96978f; font: 800 7px Avenir, sans-serif; letter-spacing: .08em; }

.series-fixtures {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 18px 0 26px;
}

.series-fixtures article {
  min-height: 65px;
  display: grid;
  align-content: center;
  gap: 5px;
  border: 1px solid var(--rule);
  padding: 10px 12px;
  background: rgba(251,246,233,.58);
}

.series-fixtures span { color: #92938c; font-size: 7px; font-weight: 800; letter-spacing: .14em; }
.series-fixtures strong { color: #74766f; font: italic 10px/1.25 Georgia, serif; }
.series-fixtures article.active { border-top: 3px solid var(--red); background: var(--paper); }
.series-fixtures article.complete { border-top: 3px solid var(--green); }
.series-fixtures article.complete strong { color: var(--green); }

.series-stat-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.series-team-stats { min-width: 0; border: 1px solid var(--rule); padding: 20px; background: var(--paper); }
.series-team-heading { display: flex; align-items: center; gap: 10px; padding-bottom: 13px; border-bottom: 2px solid var(--green); }
.series-team-heading span:not(.team-disc) { color: var(--red); font-size: 7px; font-weight: 800; letter-spacing: .15em; }
.series-team-heading h2 { margin: 2px 0 0; color: var(--green); font: 700 22px Georgia, serif; }
.series-team-stats h3 { margin: 19px 0 6px; color: var(--green); font: 700 14px Georgia, serif; }
.stat-sort { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
.stat-sort select { border: 0; border-bottom: 1px solid var(--rule); padding: 3px; background: transparent; color: var(--green); font-size: 8px; }

.series-table { overflow-x: auto; scrollbar-width: thin; }
.series-row {
  min-width: 590px;
  min-height: 29px;
  display: grid;
  align-items: center;
  gap: 5px;
  border-bottom: 1px solid rgba(37,61,49,.11);
  color: #6d7069;
  font: italic 9px Georgia, serif;
}

.batting-series-table .series-row { grid-template-columns: minmax(115px, 1fr) repeat(8, 35px); }
.bowling-series-table .series-row { grid-template-columns: minmax(105px, 1fr) 27px 34px 27px 34px 29px 43px 42px 42px 28px; }
.series-row > span, .series-row > b { text-align: right; }
.series-row > strong { overflow: hidden; color: var(--green); text-overflow: ellipsis; white-space: nowrap; }
.series-row > b { color: var(--green); font-style: normal; }
.series-row.labels { min-height: 23px; color: #96978f; font: 800 7px Avenir, sans-serif; letter-spacing: .08em; }
.series-row.labels > span:first-child { text-align: left; }
.series-empty { margin: 14px 0; color: #85877f; font: italic 10px Georgia, serif; }
.series-fielding { margin: 14px 0 0; border-top: 1px solid var(--rule); padding-top: 9px; color: #777970; font: italic 9px/1.45 Georgia, serif; }
.series-fielding b { color: var(--green); }

.series-archive { margin-top: 28px; }
.archive-heading { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 10px; border-bottom: 2px solid var(--green); }
.archive-heading span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
.archive-heading strong { color: var(--green); font: 700 17px Georgia, serif; }
.series-archive details { border-bottom: 1px solid var(--rule); background: rgba(251,246,233,.44); }
.series-archive summary {
  min-height: 56px;
  display: grid;
  grid-template-columns: 70px 1fr auto;
  align-items: center;
  gap: 15px;
  padding: 9px 14px;
  cursor: pointer;
  list-style: none;
}

.series-archive summary::-webkit-details-marker { display: none; }
.series-archive summary > span { color: var(--red); font-size: 8px; font-weight: 800; letter-spacing: .13em; }
.series-archive summary > strong { color: var(--green); font: italic 13px Georgia, serif; }
.series-archive summary > small { color: #777970; font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; }
.series-archive details[open] summary > small { color: var(--red); }
.archived-match-heading { padding: 12px 14px; border-top: 1px solid var(--rule); color: #74766f; font: italic 11px Georgia, serif; }
.series-archive .scorebook-section { margin: 0 14px 30px; }
.series-archive .scorebook-section + .scorebook-section { margin-top: 32px; }

.scorebook-section + .scorebook-section { margin-top: 42px; }
.scorebook-section-heading {
  min-height: 37px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--green);
  color: var(--green);
}

.scorebook-section-heading > span { font-size: 8px; font-weight: 800; letter-spacing: .15em; }
.scorebook-section-heading > strong { font: 700 17px Georgia, serif; }
.scorebook-section-heading button { border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
.empty-scorebooks { color: #7d8078; text-align: center; font: italic 12px Georgia, serif; }

@media (max-width: 1100px) {
  .scorebook { grid-template-columns: 1fr; }
  .book-spine { display: none; }
  .batting-page { border-right: 0; border-bottom: 3px double var(--rule); }
  .bowler-choice { grid-template-columns: 1fr; }
  .choice-heading { padding: 0 0 18px; border: 0; border-bottom: 1px solid var(--rule); }
  .dice-console { grid-template-columns: minmax(190px, 1fr) auto 125px 28px 125px; }
  .play-view { min-height: auto; }
  .play-score { grid-template-columns: minmax(280px, .72fr) 1.28fr; }
  .live-press-box { display: none; }
  .actor-figures { gap: 8px; }
  .play-dice { grid-template-columns: minmax(230px, 1fr) 130px 25px 130px; padding-inline: 20px; }
  .picker-options { grid-template-columns: repeat(3, 1fr); }
  .series-stat-sections { grid-template-columns: 1fr; }
  .match-options { grid-template-columns: 1fr 1fr; }
  .series-fixtures { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 760px) {
  .masthead { min-height: 70px; padding: 12px 16px; }
  .game-header-actions { gap: 7px; }
  .press-box-launch { padding: 5px 6px; font-size: 6px; }
  .brand-mark { width: 40px; height: 40px; font-size: 18px; }
  .brand strong { font-size: 17px; }
  .brand small, .format-tag, .match-title span { display: none; }
  .match-title { max-width: 145px; }
  .match-title strong { font-size: 10px; line-height: 1.25; }
  .text-button { font-size: 7px; }
  .setup-stage { padding: 38px 13px 48px; }
  .setup-book { padding: 26px 17px 22px; background: var(--paper); }
  .book-heading { grid-template-columns: 53px 1fr; }
  .book-format { display: none; }
  .book-heading h1 { font-size: 23px; }
  .team-name-row, .squad-grid { grid-template-columns: 1fr; }
  .mode-selector { grid-template-columns: repeat(3, 1fr); }
  .mode-selector > span, .mode-selector small { grid-column: 1 / -1; margin: 0; }
  .mode-selector > span { margin-top: 4px; }
  .team-name-row { gap: 8px; }
  .versus { padding: 0; }
  .squad-grid { gap: 26px; }
  .innings-ribbon { justify-content: flex-start; }
  .innings-chip { min-width: 145px; padding: 9px 11px; }
  .innings-chip span { font-size: 7px; }
  .scorebook-wrap { padding: 32px 8px 20px; }
  .score-page { padding: 22px 10px 24px; }
  .page-heading h2 { font-size: 21px; }
  .big-score strong { font-size: 28px; }
  .batting-row { grid-template-columns: minmax(95px, 1.15fr) minmax(92px, 1fr) 25px 25px 22px 22px 34px; gap: 3px; font-size: 8px; }
  .batting-row > span:nth-child(2) { font-size: 7px; }
  .batting-row > span:first-child i { width: 14px; }
  .over-line { grid-template-columns: 115px 1fr; gap: 7px; }
  .over-meta { grid-template-columns: 23px 1fr; }
  .ball-box { width: 22px; height: 22px; font-size: 7px; }
  .bowling-row { grid-template-columns: minmax(95px, 1fr) 30px 23px 27px 24px 24px 35px; gap: 3px; font-size: 8px; }
  .match-controls { padding: 0 8px; margin-bottom: 42px; }
  .bowler-choice { padding: 18px 14px; }
  .bowler-grid { grid-template-columns: repeat(2, 1fr); }
  .dice-console { grid-template-columns: 1fr 1fr; gap: 15px; padding: 17px 13px; }
  .turn-card { grid-column: 1 / -1; }
  .needed { position: absolute; right: 20px; }
  .dice-console .die-wrap { grid-row: 2; }
  .dice-divider { display: none; }
  .die { width: 112px; }
  .recent ol { grid-template-columns: 1fr; }
  .decision-card, .result-card { margin: 40px 12px; padding: 40px 19px; }
  .decision-card h1, .result-card h1 { font-size: 40px; }
  .decision-actions { display: grid; }
  .result-stamp { position: static; margin: -17px auto 20px; }
  .result-totals { grid-template-columns: 1fr; }
  .match-report { padding: 17px 15px; }
  .match-report h2 { font-size: 22px; }
  .match-report-copy { columns: 1; }
  .day-review { padding: 16px 12px; }
  .result-series-actions { display: grid; }
  .archive { padding: 0 8px 45px; }
  .view-switcher { justify-content: stretch; }
  .view-switcher button { flex: 1; min-width: 0; padding-inline: 8px; }
  .view-switcher button small { display: none; }
  .play-view { width: calc(100% - 16px); padding: 12px 0 30px; gap: 8px; }
  .play-score { grid-template-columns: 1fr; }
  .live-total { border-right: 0; border-bottom: 1px solid var(--rule); }
  .live-total strong { font-size: 36px; }
  .victory-equations { display: flex; gap: 4px; }
  .victory-equations strong { min-width: 0; padding-inline: 4px; font-size: clamp(5px, 1.7vw, 8px); }
  .live-win-predictor { grid-template-columns: auto 1fr auto; gap: 5px 8px; }
  .live-win-predictor .predictor-label, .live-win-predictor > small { display: none; }
  .live-win-predictor .probability-bar { grid-column: 1 / -1; grid-row: 2; }
  .chart-heading { display: grid; }
  .chart-legend { flex-wrap: wrap; }
  .play-over { grid-template-columns: 92px 1fr; padding: 10px 12px; }
  .play-over > small { grid-column: 1 / -1; }
  .play-balls { gap: 5px; }
  .play-balls .ball-box { width: 26px; height: 26px; }
  .play-actors { grid-template-columns: 1fr 1fr; gap: 8px; }
  .actor-card { padding: 11px 12px; }
  .actor-card.bowler-card { grid-column: 1 / -1; }
  .actor-card h2 { font-size: 17px; }
  .actor-figures { flex-wrap: wrap; gap: 5px 10px; }
  .actor-figures strong { font-size: 23px; }
  .play-dice { grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
  .play-prompt { grid-column: 1 / -1; padding: 0 0 12px; border: 0; border-bottom: 1px solid var(--rule); }
  .play-prompt h2 { font-size: 22px; white-space: normal; }
  .play-dice .die { width: min(31vw, 112px); }
  .play-dice-arrow { display: none; }
  .play-bowler-picker { grid-template-columns: 1fr; padding: 14px; }
  .picker-heading { padding: 0 0 11px; border: 0; border-bottom: 1px solid var(--rule); }
  .picker-options { grid-template-columns: repeat(2, 1fr); }
  .full-scorebook-view { padding: 20px 8px 45px; }
  .series-dashboard { padding: 18px 8px 45px; }
  .series-hero { grid-template-columns: 1fr; gap: 20px; padding: 22px 16px; }
  .series-score { justify-content: center; }
  .series-hero > button { position: static; justify-self: start; }
  .series-fixtures { grid-template-columns: 1fr; gap: 5px; }
  .match-options { grid-template-columns: 1fr; }
  .lineup-library > div { grid-template-columns: 1fr 1fr; }
  .lineup-library > div > strong { grid-column: 1 / -1; }
  .series-records { grid-template-columns: 1fr 1fr; }
  .series-mvp { display: grid; gap: 4px; }
  .comparison-row { grid-template-columns: 32px 1fr; }
  .comparison-row > span:nth-child(3), .comparison-row > span:nth-child(4) { grid-column: 2; }
  .match-utility-bar { grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
  .match-utility-bar > strong { display: none; }
  .match-utility-bar > span { display: flex; }
  .match-utility-bar > div { gap: 3px; }
  .match-utility-bar button { padding-inline: 5px; font-size: 6px; }
  .media-centre { width: 100%; max-width: none; border-left: 0; }
  .media-header { min-height: 66px; padding: 12px 14px; }
  .media-header strong { font-size: 23px; }
  .media-body { padding: 14px 12px 28px; }
  .media-tabs button { padding-inline: 4px; font-size: 6px; }
  .broadcast-settings { grid-template-columns: 1fr 1fr; }
  .newspaper-front h2 { font-size: 25px; }
  .series-fixtures article { min-height: 52px; }
  .series-team-stats { padding: 14px 10px; }
  .series-archive summary { grid-template-columns: 55px 1fr; gap: 7px; }
  .series-archive summary > small { grid-column: 2; }
  .archive-heading { display: grid; gap: 4px; }
  .series-archive .scorebook-section { margin-inline: 4px; }
  footer { display: block; padding: 16px; }
  footer p + p { margin-top: 5px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

@media print {
  .masthead, .view-switcher, .quick-help, .series-export-bar, footer, .series-hero > button { display: none !important; }
  body, .game-shell, .series-dashboard, .full-scorebook-view { background: white !important; }
  .series-dashboard, .full-scorebook-view { max-width: none; padding: 0; }
  .series-archive details { display: block; break-inside: avoid; }
  .series-archive details > * { display: block; }
  .scorebook { box-shadow: none; }
}
