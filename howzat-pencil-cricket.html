a",name:"Redbank Oval",description:"Firm inland clay: pace and carry, true strokeplay and late cracks. Quick drainage.",pitch:"hard",pitches:["hard","hard","hard","true","wearing"],boundaryBias:0,drainage:2,wearDelay:0},{id:"southern_bay",country:"australia",name:"Southern Bay",description:"Cooler coastal air and a reliable strip; some matches offer early seam movement.",pitch:"hard",pitches:["hard","hard","true","green","slow"],boundaryBias:0,drainage:1,wearDelay:1,climate:["sunny","bright","bright","cloudy","cloudy","overcast","showers","hot"]},{id:"ironbark",country:"australia",name:"Ironbark Ground",description:"An abrasive but playable surface; quicks have the new ball and spin grows into the match.",pitch:"wearing",pitches:["wearing","hard","hard","slow","true"],boundaryBias:0,drainage:2,wearDelay:0},{id:"gulmohar",country:"india",name:"Gulmohar Oval",description:"Even early bounce and a dry square. Batting first offers time to build before the rough develops.",pitch:"slow",pitches:["slow","slow","wearing","true","hard"],boundaryBias:0,drainage:1,wearDelay:1},{id:"saffron",country:"india",name:"Saffron Gardens",description:"A patient batting surface with steadily widening rough; spinners become central later.",pitch:"wearing",pitches:["wearing","wearing","slow","true","hard"],boundaryBias:0,drainage:2,wearDelay:0},{id:"hillfort",country:"india",name:"Hillfort Ground",description:"Breezier upland conditions and a firmer strip give the seamers a place in the tour.",pitch:"hard",pitches:["hard","hard","green","slow","true"],boundaryBias:0,drainage:1,wearDelay:1,climate:["sunny","bright","bright","cloudy","cloudy","overcast","showers","hot"]},{id:"cinnamon",country:"sri_lanka",name:"Cinnamon Gardens",description:"Warm air and a slow, even surface; good batting early, grip as the square dries.",pitch:"slow",pitches:["slow","slow","wearing","true","hard"],boundaryBias:0,drainage:1,wearDelay:1},{id:"palm_coast",country:"sri_lanka",name:"Palm Coast Ground",description:"Sea breezes and passing showers, with an abrasive square and excellent drainage.",pitch:"wearing",pitches:["wearing","slow","slow","hard","true"],boundaryBias:0,drainage:2,wearDelay:0,climate:["sunny","bright","cloudy","cloudy","showers","showers","hot","bright"]},{id:"highland",country:"sri_lanka",name:"Highland Oval",description:"Cooler cloud and occasional early movement; the surface settles before late wear.",pitch:"green",pitches:["green","hard","slow","slow","true"],boundaryBias:0,drainage:1,wearDelay:1,climate:["sunny","bright","bright","cloudy","cloudy","overcast","showers","hot"]}];function qg(e,t){let a=e.climate||Je[e.country].weather;if(!t)return[...a];let n={sunny:["sunny","bright","hot"],bright:["bright","sunny","cloudy"],cloudy:["cloudy","bright","overcast"],overcast:["overcast","cloudy","showers"],showers:["cloudy","overcast","bright"],hot:["hot","sunny","bright"]};return[...a,t,t,...n[t]]}function Pc(e,t,a,n,l,i){let u=e.filter(v=>t==="world"||v.country===t),r=Math.max(0,a==="random"?Math.min(u.length-1,Math.floor(i*u.length)):u.findIndex(v=>v.id===a));if(t!=="world"||!l)return Array.from({length:n},(v,b)=>u[(r+(l?b:0))%u.length].id);let o=Object.keys(Je),c=u[r],m=o.indexOf(c.country);return Array.from({length:n},(v,b)=>{if(b===0)return c.id;let y=e.filter(T=>T.country===o[(m+b)%o.length]);return y[(Math.floor(b/o.length)+r)%y.length].id})}var Yg="Arthur Wainfleet",jg=[{id:"howzat",country:"england",character:"Hard, honest and usually fair",weapon:"Fast bowling with the new ball",drawPressure:"Moderate",memory:"Every cricketer needs one ground by which all the others are measured. For me it was Howzat. The pavilion clock was slow, the tea was strong and the pitch generally gave a good player precisely what he had earned \u2014 though never quite when he expected it.",counsel:"Do not arrive with a grand theory. Use the new ball properly, watch the sky and let the first few overs tell you what sort of match has come to meet you. A first-innings score around the middle hundreds keeps every result alive."},{id:"willow",country:"england",character:"Green, enclosed and watchful",weapon:"Seam bowling",drawPressure:"Low",memory:"The first time I captained at Willow Vale I mistook the quiet for peace. It was nothing of the sort. The crowd simply knew that on a green morning one good ball would soon bring another. We were three down before the church clock had finished striking eleven.",counsel:"Survive before you prosper. Openers should value their wickets, while seamers must attack before the grass fades. If you bowl first and waste the new ball, Willow becomes a far more ordinary place by afternoon."},{id:"sunbank",country:"england",character:"True, quick-scoring and unforgiving to captains",weapon:"Swing and relentless changes of angle",drawPressure:"Very high",memory:"At Sunbank the scoreboard attendant keeps the chalk in his hand. I once watched a respectable defensive field disappear beneath a tide of boundaries, every stroke greeted as though the crowd had ordered it with lunch. The pitch did not betray us; our caution did.",counsel:"Runs come quickly and the short square boundaries punish empty fields. Think about the declaration earlier than feels polite. With the ball, vary the attack and accept that buying a wicket may cost runs. Waiting for the surface to win the match for you is a fine way to draw it."},{id:"marsh",country:"england",character:"Slow, spacious and short of time",weapon:"Leg-spin",drawPressure:"High",memory:"A boundary at Marsh End must often be completed by committee: batter, partner and a weary fielder chasing towards the reeds. The ball seems to gather mud in its thoughts even on a dry day. Many a bright innings has sunk there without ever quite collapsing.",counsel:"Run hard and resist the temptation to wait for fours. Leg-spin gives the best chance of making the slow surface do something decisive. Keep one eye on the match clock; moderate scores can consume an immoderate amount of the five days."},{id:"foundry",country:"england",character:"Sound early, spiteful late",weapon:"Off-spin as the rough widens",drawPressure:"Low",memory:"The Old Foundry smells faintly of iron after rain. On the first morning its pitch can appear almost courteous. By the last afternoon the cracks have joined forces and the same ball that once came on to the bat begins stopping to inspect it.",counsel:"Bat while the surface is still an ally and do not leave the chase to the fourth innings if you can avoid it. Pace has a role early, but keep an off-spinner fresh for the wearing pitch. This ground usually produces a result if the captain allows it to age."},{id:"seabank",country:"england",character:"Hard underneath, restless overhead",weapon:"Fast bowling",drawPressure:"Moderate",memory:"At Seabank you can watch the weather arrive from beyond the sightscreen. I have left the field beneath blue sky and returned after tea to find the floodlights wondering whether they ought to come on. The pitch carries throughout; the air supplies the plot.",counsel:"Captain by the session. Fast bowlers enjoy the carry, but cloud may briefly make swing the sharper instrument. Batters should score while the light is kind. A plan chosen at breakfast may be quite wrong by tea."},{id:"meadow",country:"england",character:"True, vast and deceptively peaceful",weapon:"Swing bowling",drawPressure:"Very high",memory:"The Long Meadow is beautiful enough to make a captain sentimental, which is dangerous. Its boundaries retreat as you approach them and a well-timed stroke returns as a breathless three. We once batted all day there and still felt we had been standing still.",counsel:"Value running and partnerships more than boundary counts. The true pitch allows long occupations, so declarations matter enormously. Swing offers the best chance of interrupting an innings before it settles into the landscape."},{id:"pavilion",country:"england",character:"Hard, compact and theatrical",weapon:"Out-and-out pace",drawPressure:"Very high",memory:"At Pavilion Park the crowd sits close enough to complete an appeal before the wicketkeeper has begun it. The boundaries are inviting, the scoreboard excitable and no lead feels quite safe. I have seen a match change character there in the time it takes to remove a sweater.",counsel:"Set targets with a margin for sudden acceleration. Fast bowling is the best counter to a surface that rewards confident strokes, but a catching field will leak boundaries. Use aggression in spells, not as a permanent state of mind."},{id:"redbank",country:"australia",character:"Hard, dry and full of carry",weapon:"Fast bowling",drawPressure:"Moderate",memory:"The sound of bat on ball travels differently at Redbank \u2014 harder and cleaner, as if struck against the red earth itself. Our first tour there began with two bruised gloves and ended with a hundred made almost entirely in front of square.",counsel:"Do not confuse bounce with automatic wickets. Genuine pace can hurry a batter, but the reliable surface rewards anything loose. Batters who settle should make the innings count before the late cracks bring the match back towards the bowlers."},{id:"southern_bay",country:"australia",character:"Coastal, changeable and balanced",weapon:"Fast bowling, with swing under cloud",drawPressure:"Moderate",memory:"Southern Bay is where touring sides discover they packed for the wrong Australia. I have worn a sweater at breakfast, removed it before lunch and watched the ball swing after tea. The sea breeze has embarrassed many confident forecasts.",counsel:"Read the day in front of you rather than the country on the fixture list. Pace remains useful, but cloud can make swing decisive and the occasional green surface rewards seam. It is an excellent ground for a balanced attack."},{id:"ironbark",country:"australia",character:"Brisk early, abrasive later",weapon:"Leg-spin after the quicks",drawPressure:"Moderate",memory:"An Ironbark Test changes its accent as it goes. The quicks speak first, loudly, while the pitch is hard. By the later days the footmarks have taken over the conversation and the spinner who seemed ornamental on the first morning becomes captain of the whole affair.",counsel:"Select an attack for five days, not five overs. Use pace with the new ball, then hand responsibility to leg-spin as the surface wears. Excellent drainage means there is usually enough time for both halves of the plan."},{id:"gulmohar",country:"india",character:"Patient early, turning late",weapon:"Leg-spin",drawPressure:"High",memory:"Gulmohar taught me that patience and passivity are not the same thing. One morning our openers seemed to do nothing for an age; by tea they had built the only innings that mattered. Days later the rough opened like a second set of fielders around the bat.",counsel:"Bat first if you can and build while the bounce is even. Wear arrives a little later here, so a captain must create time for the spinners rather than assume it will appear. Leg-spin is the likeliest match-winner once the pitch begins to turn."},{id:"saffron",country:"india",character:"Dry, wearing and increasingly tactical",weapon:"Leg-spin",drawPressure:"Moderate",memory:"At Saffron Gardens the rough appears gradually, like ink soaking into paper. By the time everyone agrees it is there, the spinner has already moved a short leg two paces closer and the batter has begun examining marks that were invisible at lunch.",counsel:"First-innings runs purchase enormous influence. The surface wears earlier than Gulmohar and the excellent drainage protects the clock, so keep a specialist spinner ready. Make the fourth innings belong to your bowlers, not your batters."},{id:"hillfort",country:"india",character:"Firm, breezy and friendly to pace",weapon:"Fast bowling",drawPressure:"Moderate",memory:"Hillfort is the ground on an Indian tour that catches out the team selected for everywhere else. The air moves across the upland and the pitch has enough firmness to put the quicks back in the captain's thoughts. We once arrived with three spinners and spent two days apologising to our opening bowler.",counsel:"Do not select by reputation. Fast bowling is often the best weapon, especially under cloud, while the occasional green strip rewards patience from the top order. It is the best place in India to retain a varied attack."},{id:"cinnamon",country:"sri_lanka",character:"Warm, slow and steadily gripping",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Cinnamon Gardens has the most handsome scoreboard I ever lost beneath. Early on, the pitch allows a batter to arrange an innings with care. Later, every spinner seems to discover an extra finger and every captain an extra close catcher.",counsel:"Take the early batting seriously: those are the easiest runs the match will offer. As the surface dries, move towards spin without abandoning control. Leg-spin carries the greatest attacking promise across a full innings."},{id:"palm_coast",country:"sri_lanka",character:"Abrasive, coastal and interrupted",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Rain at Palm Coast seldom asks permission. It comes sideways, empties the ground and leaves just as abruptly, whereupon the excellent drainage produces a pitch before the players have finished their tea. The restart is often more dangerous than the shower.",counsel:"Stay tactically awake through interruptions. The drainage preserves more play than the forecast suggests, while the abrasive square gives leg-spin increasing value. Batters should rebuild concentration before trying to recover lost time in a single over."},{id:"highland",country:"sri_lanka",character:"Cloudy early, slow once settled",weapon:"Leg-spin over the full match",drawPressure:"Moderate",memory:"Highland Oval can look like a seamer's private estate when cloud sits over the hills. That impression does not last. The early movement fades, the surface settles and, by the time the mist returns, it is often the spinn
