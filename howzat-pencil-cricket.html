ile seamers must attack before the grass fades. If you bowl first and waste the new ball, Willow becomes a far more ordinary place by afternoon."},{id:"sunbank",country:"england",character:"True, quick-scoring and unforgiving to captains",weapon:"Swing and relentless changes of angle",drawPressure:"Very high",memory:"At Sunbank the scoreboard attendant keeps the chalk in his hand. I once watched a respectable defensive field disappear beneath a tide of boundaries, every stroke greeted as though the crowd had ordered it with lunch. The pitch did not betray us; our caution did.",counsel:"Runs come quickly and the short square boundaries punish empty fields. Think about the declaration earlier than feels polite. With the ball, vary the attack and accept that buying a wicket may cost runs. Waiting for the surface to win the match for you is a fine way to draw it."},{id:"marsh",country:"england",character:"Slow, spacious and short of time",weapon:"Leg-spin",drawPressure:"High",memory:"A boundary at Marsh End must often be completed by committee: batter, partner and a weary fielder chasing towards the reeds. The ball seems to gather mud in its thoughts even on a dry day. Many a bright innings has sunk there without ever quite collapsing.",counsel:"Run hard and resist the temptation to wait for fours. Leg-spin gives the best chance of making the slow surface do something decisive. Keep one eye on the match clock; moderate scores can consume an immoderate amount of the five days."},{id:"foundry",country:"england",character:"Sound early, spiteful late",weapon:"Off-spin as the rough widens",drawPressure:"Low",memory:"The Old Foundry smells faintly of iron after rain. On the first morning its pitch can appear almost courteous. By the last afternoon the cracks have joined forces and the same ball that once came on to the bat begins stopping to inspect it.",counsel:"Bat while the surface is still an ally and do not leave the chase to the fourth innings if you can avoid it. Pace has a role early, but keep an off-spinner fresh for the wearing pitch. This ground usually produces a result if the captain allows it to age."},{id:"seabank",country:"england",character:"Hard underneath, restless overhead",weapon:"Fast bowling",drawPressure:"Moderate",memory:"At Seabank you can watch the weather arrive from beyond the sightscreen. I have left the field beneath blue sky and returned after tea to find the floodlights wondering whether they ought to come on. The pitch carries throughout; the air supplies the plot.",counsel:"Captain by the session. Fast bowlers enjoy the carry, but cloud may briefly make swing the sharper instrument. Batters should score while the light is kind. A plan chosen at breakfast may be quite wrong by tea."},{id:"meadow",country:"england",character:"True, vast and deceptively peaceful",weapon:"Swing bowling",drawPressure:"Very high",memory:"The Long Meadow is beautiful enough to make a captain sentimental, which is dangerous. Its boundaries retreat as you approach them and a well-timed stroke returns as a breathless three. We once batted all day there and still felt we had been standing still.",counsel:"Value running and partnerships more than boundary counts. The true pitch allows long occupations, so declarations matter enormously. Swing offers the best chance of interrupting an innings before it settles into the landscape."},{id:"pavilion",country:"england",character:"Hard, compact and theatrical",weapon:"Out-and-out pace",drawPressure:"Very high",memory:"At Pavilion Park the crowd sits close enough to complete an appeal before the wicketkeeper has begun it. The boundaries are inviting, the scoreboard excitable and no lead feels quite safe. I have seen a match change character there in the time it takes to remove a sweater.",counsel:"Set targets with a margin for sudden acceleration. Fast bowling is the best counter to a surface that rewards confident strokes, but a catching field will leak boundaries. Use aggression in spells, not as a permanent state of mind."},{id:"redbank",country:"australia",character:"Hard, dry and full of carry",weapon:"Fast bowling",drawPressure:"Moderate",memory:"The sound of bat on ball travels differently at Redbank \u2014 harder and cleaner, as if struck against the red earth itself. Our first tour there began with two bruised gloves and ended with a hundred made almost entirely in front of square.",counsel:"Do not confuse bounce with automatic wickets. Genuine pace can hurry a batter, but the reliable surface rewards anything loose. Batters who settle should make the innings count before the late cracks bring the match back towards the bowlers."},{id:"southern_bay",country:"australia",character:"Coastal, changeable and balanced",weapon:"Fast bowling, with swing under cloud",drawPressure:"Moderate",memory:"Southern Bay is where touring sides discover they packed for the wrong Australia. I have worn a sweater at breakfast, removed it before lunch and watched the ball swing after tea. The sea breeze has embarrassed many confident forecasts.",counsel:"Read the day in front of you rather than the country on the fixture list. Pace remains useful, but cloud can make swing decisive and the occasional green surface rewards seam. It is an excellent ground for a balanced attack."},{id:"ironbark",country:"australia",character:"Brisk early, abrasive later",weapon:"Leg-spin after the quicks",drawPressure:"Moderate",memory:"An Ironbark Test changes its accent as it goes. The quicks speak first, loudly, while the pitch is hard. By the later days the footmarks have taken over the conversation and the spinner who seemed ornamental on the first morning becomes captain of the whole affair.",counsel:"Select an attack for five days, not five overs. Use pace with the new ball, then hand responsibility to leg-spin as the surface wears. Excellent drainage means there is usually enough time for both halves of the plan."},{id:"gulmohar",country:"india",character:"Patient early, turning late",weapon:"Leg-spin",drawPressure:"High",memory:"Gulmohar taught me that patience and passivity are not the same thing. One morning our openers seemed to do nothing for an age; by tea they had built the only innings that mattered. Days later the rough opened like a second set of fielders around the bat.",counsel:"Bat first if you can and build while the bounce is even. Wear arrives a little later here, so a captain must create time for the spinners rather than assume it will appear. Leg-spin is the likeliest match-winner once the pitch begins to turn."},{id:"saffron",country:"india",character:"Dry, wearing and increasingly tactical",weapon:"Leg-spin",drawPressure:"Moderate",memory:"At Saffron Gardens the rough appears gradually, like ink soaking into paper. By the time everyone agrees it is there, the spinner has already moved a short leg two paces closer and the batter has begun examining marks that were invisible at lunch.",counsel:"First-innings runs purchase enormous influence. The surface wears earlier than Gulmohar and the excellent drainage protects the clock, so keep a specialist spinner ready. Make the fourth innings belong to your bowlers, not your batters."},{id:"hillfort",country:"india",character:"Firm, breezy and friendly to pace",weapon:"Fast bowling",drawPressure:"Moderate",memory:"Hillfort is the ground on an Indian tour that catches out the team selected for everywhere else. The air moves across the upland and the pitch has enough firmness to put the quicks back in the captain's thoughts. We once arrived with three spinners and spent two days apologising to our opening bowler.",counsel:"Do not select by reputation. Fast bowling is often the best weapon, especially under cloud, while the occasional green strip rewards patience from the top order. It is the best place in India to retain a varied attack."},{id:"cinnamon",country:"sri_lanka",character:"Warm, slow and steadily gripping",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Cinnamon Gardens has the most handsome scoreboard I ever lost beneath. Early on, the pitch allows a batter to arrange an innings with care. Later, every spinner seems to discover an extra finger and every captain an extra close catcher.",counsel:"Take the early batting seriously: those are the easiest runs the match will offer. As the surface dries, move towards spin without abandoning control. Leg-spin carries the greatest attacking promise across a full innings."},{id:"palm_coast",country:"sri_lanka",character:"Abrasive, coastal and interrupted",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Rain at Palm Coast seldom asks permission. It comes sideways, empties the ground and leaves just as abruptly, whereupon the excellent drainage produces a pitch before the players have finished their tea. The restart is often more dangerous than the shower.",counsel:"Stay tactically awake through interruptions. The drainage preserves more play than the forecast suggests, while the abrasive square gives leg-spin increasing value. Batters should rebuild concentration before trying to recover lost time in a single over."},{id:"highland",country:"sri_lanka",character:"Cloudy early, slow once settled",weapon:"Leg-spin over the full match",drawPressure:"Moderate",memory:"Highland Oval can look like a seamer's private estate when cloud sits over the hills. That impression does not last. The early movement fades, the surface settles and, by the time the mist returns, it is often the spinner turning the match rather than the ball swinging.",counsel:"Use seam and pace while the new ball and cloud agree, but retain a strong spinner for the longer work. Batters who survive the opening passage should resist chasing the game too soon; the surface usually becomes more manageable before it wears again."}];function Bb(e){return e.anomaly==="low_gravity"?"Attack the stumps":e.anomaly==="giant"?"Saving singles and patient spin":e.anomaly==="clockwork"?"Reading the ball-age mechanism":e.anomaly==="thermals"?"Boundary riders and leg-spin":e.anomaly==="tidal"||e.anomaly==="crosswind"?"Swing bowling at the favourable turn":(e.wind||0)+(e.humidity||0)>=3?"Swing bowling":e.pitch==="green"?"Seam bowling":e.pitch==="wearing"||e.pitch==="slow"?"Leg-spin":e.pitch==="hard"||(e.altitude||0)>0?"Fast bowling":"A balanced attack"}var e1={silver_fern:"Silver Fern Basin sits so neatly among the hills that a touring captain may mistake shelter for mercy. On our first morning there the cloud never appeared to move, yet the ball wandered about like a sheep without a gate. We reached lunch four down and congratulated ourselves on the achievement.",volcanic_plateau:"At Volcanic Plateau the ground steams faintly after rain and the drainage works with indecent efficiency. I once sent the side back to the hotel during a downpour, only to be summoned ten minutes later and informed that play had resumed without us. The pitch was firmer after the shower than our excuses.",southern_sound:"The wind at Southern Sound once removed my cap, a bail and three pages of the scorer's book in the same over. Our swing bowler followed all three towards fine leg. It is a beautiful ground, provided one accepts that the weather is entitled to alter the field without consulting the captain.",indus_gardens:"The opening morning at Indus Gardens can feel less like a contest than an invitation. We accepted it greedily and were 286 for two by tea; by the next evening the dry square had begun keeping its own counsel. That Test taught me that easy runs are not free runs\u2014they are an advance payment on later trouble.",frontier_oval:"Frontier Oval announced itself with a ball that passed our opener's nose and reached the keeper at shoulder height. The next was driven through cover with scarcely a sound. For five days the pitch held that argument between fast bowling and brave batting, and neither side ever quite won it.",lantern_city:"We played beneath the lamps at Lantern City while the old ball scuffed itself the colour of the square. For thirty overs it did nothing; then it began reversing as if somebody had whispered a secret to it. Our middle order spent the evening accusing the laws of physics of favouritism.",highveld_park:"At Highveld Park I watched a top edge travel far enough to require refreshments. The same thin air that carries a mistimed hook also seems to sharpen the fast bowler's hurry. A captain spends the match alternating between admiring the spectacle and moving another fielder towards the rope.",cape_wind:"Cape Wind Ground gave me the most expensive bowling change of my career. I replaced a swing bowler because the sun had appeared; before his successor reached his mark, the cloud returned and the crosswind turned cold. The outgoing bowler reminded me of this at every reunion for twenty years.",baobab:"There is an old baobab beyond midwicket at this ground, and one can measure the match by its shadow. Early in the Test the ball comes gently onto the bat. By the time that shadow has crossed the square a dozen times, the spinner is setting the field and everybody else is merely offering suggestions.",trade_winds:"Trade Winds Oval carries sound, scent and cricket clean across the ground. On a lively first day our quicks had the slips hopping; after lunch the same breeze pushed three handsome drives beyond their reach. The crowd enjoyed both developments and showed no loyalty to our tactical dignity.",coral_bay:"At Coral Bay a shower emptied the terraces, polished the light and disappeared before the covers had settled. The first ball after the restart went for six and landed among spectators still returning with drinks. Compact grounds create instant folklore because every mistake has witnesses at close range.",rainforest_park:"Rainforest Park is never silent. Even in a maiden over there are insects, dripping leaves and a heavy outfield muttering beneath the ball. We once defended 214 there as though guarding a fortune; every boundary required such labour that the batters began applauding their own running.",delta_pavilion:"The air at Delta Pavilion clings to a touring shirt before breakfast. I remember our off-spinner asking for the ball in the ninth over and keeping it until dusk, by which time his fingers were raw and the opposition had forgotten what pace bowling looked like. The pitch had begun turning before either captain admitted it.",river_city:"River City tempted us with two sessions of immaculate batting. We declared that evening's damp a minor inconvenience and resumed the next morning to discover the ball stopping, gripping and generally revising the terms of our arrangement. Grounds beside great rivers are accustomed to changing their minds.",port_crescent:"At Port Crescent the cranes beyond the pavilion vanish whenever the cloud drops. During one such spell our seamers took three wickets; when the skyline returned, so did the batters' timing. I learned to watch the harbour rather than the scoreboard when deciding who should bowl next.",granite_ridge:"Granite Ridge is ringed by stone and played beneath an enormous sky. The outfield gave our best drives the speed of telegrams, but the bounce gave the local quicks an answer of their own. It remains the only ground where I was pleased to see 300 and frightened by it at the same time.",jacaranda:"Jacaranda Oval was in bloom when we arrived, scattering purple across a pitch so true that even my forward defence looked competent. By the second afternoon the scorebook had become indecently fat. A captain must manufacture wickets there, preferably before the beauty of the place makes him philosophical.",matobo:"The boundaries at Matobo Park seem to move away from a batter who is already running. Our finest stroke of the first day produced three, two aching calves and an argument about a fourth. By the final morning the worn square belonged to the spinners, who alone appeared not to be tired.",atlantic_commons:"Atlantic Commons gave us a morning of four seasons and six wickets. A patch of blue sky encouraged one batter to remove his sweater; the next ball seamed past him and removed his off stump. The Atlantic regards optimism as something to be corrected promptly.",loughside:"At Loughside the rain does not always fall; sometimes it simply hangs around the ground and waits to be noticed. We lost time, towels and nearly the match before a late partnership carried us to safety. The local ducks, I recall, showed much greater urgency between the wickets.",walled_city:"Walled City Oval keeps the early wind outside and the early movement on the pitch. We survived the new ball with more luck than technique, then watched the surface become a batter's ally by lunch. The old walls have seen enough sieges to know that patience usually outlasts noise.",citadel:"The climb to Citadel Ground leaves a tourist short of breath before the fast bowlers have contributed. On our first afternoon the ball climbed sharply, then the dry surface began taking scratches like an old desk. We selected for the first day and spent the fifth wishing we had selected for the last.",pamir:"Snow remained on the distant peaks when we played at Pamir Oval, though the square itself was hard enough to ring beneath a boot. The quicks found carry, the seamers found movement and our opening pair found several reasons to inspect their gloves. It was magnificent cricket from a safe distance.",amber_plain:"Amber Plain glows in the late afternoon, which is precisely when its leg-spinner becomes most troublesome. I once delayed using ours because the first innings had looked comfortable. By the time I corrected the error, the pitch was turning and the match was not\u2014in our direction, at least.",tranquillity:"The first six at Tranquillity Oval remained in the air so long that mid-on reconsidered his entire childhood beneath it. Low gravity turns every lofted stroke into a small astronomical event. I eventually removed the slips, attacked the stumps and tried not to look upwards.",pelagia:"At Pelagia Dome the shoals beyond the transparent roof changed direction just before the tide. Our swing bowler noticed before I did and took two wickets while I was still admiring the fish. The pressure eased after lunch, whereupon the batters began driving as though released from deep water.",cloudspire:"Cloudspire has no horizon, only layers of weather beneath one's feet. A crosswind once took a perfectly respectable outswinger and returned it as something no coaching manual had named. The batter missed, the keeper applauded and the umpire looked briefly over the edge.",dragons_rest:"A warm gust rose from the caldera at Dragon's Rest and carried a mis-hit beyond long-on; two overs later it held a catch above cover until three fielders had assembled beneath it. We stopped calling the updraft unfair when it dismissed their captain. Cricketing principles are remarkably sensitive to the score.",giants_table:"The Giant's Table made our boundary hitters look like men throwing pebbles across a lake. A stroke that would have cleared Pavilion Park returned as a breathless three, and by tea both sides were bargaining with their hamstrings. I have never valued a sharp single more highly\u2014or wished for a smaller kingdom.",clockwork:"At Clockwork Gardens a brass bell announces each change in the mechanism. One session aged the ball before our eyes; the next preserved its shine as if sealed in a cabinet. Our scorer adapted immediately. The rest of us required two days and several pointed notes from the pavilion."};function t1(e){let t=zl(e,0),a=e.drainage===0||e.boundaryBias<=-2?"High":e.boundaryBias>=2||e.pitch==="true"?"Very high":e.pitch==="green"||e.pitch==="wearing"?"Low":"Moderate",n=t?`${t.label.toLowerCase()}, strange and entirely itself`:e.pitch==="hard"?"Firm, brisk and full of carry":e.pitch==="green"?"Green, moving and watchful":e.pitch==="wearing"?"Dry, tactical and increasingly worn":e.pitch==="slow"?"Patient, gripping and short of easy run
