w"],boundaryBias:0,drainage:1,wearDelay:1,wind:1,humidity:1},{id:"volcanic_plateau",country:"new_zealand",name:"Volcanic Plateau",description:"Firm volcanic soil, dependable drainage and enough late wear to keep every style interested.",pitch:"hard",pitches:["hard","true","hard","wearing","green"],boundaryBias:0,drainage:2,wearDelay:1,wind:1},{id:"southern_sound",country:"new_zealand",name:"Southern Sound",description:"Cold crosswinds, a slow outfield and showers that make swing a recurring visitor.",pitch:"slow",pitches:["slow","true","true","hard","green"],boundaryBias:0,drainage:1,wearDelay:1,wind:2,humidity:1},{id:"indus_gardens",country:"pakistan",name:"Indus Gardens",description:"A broad, true surface built for long first innings before the dry days leave their mark.",pitch:"true",pitches:["true","true","hard","slow","wearing"],boundaryBias:1,drainage:2,wearDelay:1,outfieldBias:1},{id:"frontier_oval",country:"pakistan",name:"Frontier Oval",description:"Hard carry and a quick outfield give fast bowling and back-foot strokeplay equal invitation.",pitch:"hard",pitches:["hard","hard","true","green","wearing"],boundaryBias:0,drainage:2,wearDelay:1,altitude:1,outfieldBias:1},{id:"lantern_city",country:"pakistan",name:"Lantern City Ground",description:"Hot and abrasive: runs flow early, the old ball reverses, and spin waits beyond it.",pitch:"wearing",pitches:["wearing","true","hard","slow","wearing"],boundaryBias:0,drainage:2,wearDelay:0,ballAgeRate:1.25,oldBallBias:2},{id:"highveld_park",country:"south_africa",name:"Highveld Park",description:"Thin air, steep bounce and a flying outfield make both runs and fast-bowling wickets arrive quickly.",pitch:"hard",pitches:["hard","hard","true","green","wearing"],boundaryBias:1,drainage:2,wearDelay:1,altitude:2,outfieldBias:1},{id:"cape_wind",country:"south_africa",name:"Cape Wind Ground",description:"Cloud and a stiff crosswind keep the new ball moving above a firm coastal strip.",pitch:"hard",pitches:["hard","green","true","hard","slow"],boundaryBias:0,drainage:2,wearDelay:1,wind:2,humidity:1,climate:rs},{id:"baobab",country:"south_africa",name:"Baobab Oval",description:"Hot, slower and increasingly worn: batting begins comfortably before spin enters the room.",pitch:"slow",pitches:["slow","true","wearing","hard","slow"],boundaryBias:0,drainage:1,wearDelay:0,ballAgeRate:1.1},{id:"trade_winds",country:"west_indies",name:"Trade Winds Oval",description:"A hard, lively deck under a constant breeze, with attacking cricket on both sides of the ball.",pitch:"hard",pitches:["hard","hard","true","green","slow"],boundaryBias:0,drainage:2,wearDelay:1,wind:2,outfieldBias:1},{id:"coral_bay",country:"west_indies",name:"Coral Bay Ground",description:"Compact boundaries, coral-hard footing and rapid drainage between tropical showers.",pitch:"hard",pitches:["hard","true","hard","slow","green"],boundaryBias:2,drainage:2,wearDelay:1,wind:1,humidity:1,outfieldBias:1},{id:"rainforest_park",country:"west_indies",name:"Rainforest Park",description:"Humid, green-slow and heavy underfoot; patience matters as much as timing.",pitch:"green",pitches:["green","slow","true","true","hard"],boundaryBias:0,drainage:0,wearDelay:1,humidity:1,outfieldBias:-1},{id:"delta_pavilion",country:"bangladesh",name:"Delta Pavilion",description:"A humid, rain-threatened surface that grips early and turns more insistently with wear.",pitch:"slow",pitches:["slow","wearing","true","true","hard"],boundaryBias:0,drainage:1,wearDelay:0,humidity:1},{id:"river_city",country:"bangladesh",name:"River City Ground",description:"Good batting at the start; later humidity, grip and evening damp complicate the captain's arithmetic.",pitch:"true",pitches:["true","slow","wearing","hard","true"],boundaryBias:1,drainage:1,wearDelay:0,humidity:2},{id:"port_crescent",country:"bangladesh",name:"Port Crescent",description:"Coastal cloud lends the seamers a hand before the slow square begins favouring spin.",pitch:"slow",pitches:["slow","green","true","true","hard"],boundaryBias:0,drainage:2,wearDelay:0,wind:1,humidity:1,climate:Ah},{id:"granite_ridge",country:"zimbabwe",name:"Granite Ridge",description:"Dry highveld bounce and a fast outfield reward pace, placement and a willingness to score.",pitch:"hard",pitches:["hard","true","hard","wearing","slow"],boundaryBias:1,drainage:2,wearDelay:1,altitude:1,outfieldBias:1},{id:"jacaranda",country:"zimbabwe",name:"Jacaranda Oval",description:"A true, balanced batting surface where bowlers need craft more than assistance.",pitch:"true",pitches:["true","true","hard","slow","wearing"],boundaryBias:0,drainage:1,wearDelay:1},{id:"matobo",country:"zimbabwe",name:"Matobo Park",description:"Large boundaries and a dry square that steadily transfers authority to the spinners.",pitch:"wearing",pitches:["wearing","slow","true","hard","wearing"],boundaryBias:-1,drainage:2,wearDelay:0,ballAgeRate:1.1},{id:"atlantic_commons",country:"ireland",name:"Atlantic Commons",description:"Green, exposed and frequently overcast; seamers can make the first two sessions their own.",pitch:"green",pitches:["green","hard","true","true","slow"],boundaryBias:0,drainage:1,wearDelay:1,wind:2,humidity:1},{id:"loughside",country:"ireland",name:"Loughside Ground",description:"A slow green surface beside the water, with showers and reluctant drainage pressing the clock.",pitch:"slow",pitches:["slow","green","true","true","hard"],boundaryBias:0,drainage:0,wearDelay:1,humidity:1},{id:"walled_city",country:"ireland",name:"Walled City Oval",description:"Firm underneath and sheltered enough to become an excellent batting ground once the new ball fades.",pitch:"hard",pitches:["hard","true","green","hard","slow"],boundaryBias:0,drainage:2,wearDelay:1,wind:1},{id:"citadel",country:"afghanistan",name:"Citadel Ground",description:"Dry altitude and hard bounce make a lively opening before the pitch begins to abrade.",pitch:"hard",pitches:["hard","hard","wearing","true","slow"],boundaryBias:0,drainage:2,wearDelay:0,altitude:2,ballAgeRate:1.1},{id:"pamir",country:"afghanistan",name:"Pamir Oval",description:"Cool mountain air above a green-hard strip gives pace and seam an unusual foothold.",pitch:"green",pitches:["green","hard","hard","true","slow"],boundaryBias:0,drainage:1,wearDelay:1,altitude:2,wind:1,climate:rs},{id:"amber_plain",country:"afghanistan",name:"Amber Plain",description:"Hot, slow and wearing; flight, patience and leg-spin become more persuasive by the session.",pitch:"wearing",pitches:["wearing","slow","wearing","true","hard"],boundaryBias:-1,drainage:2,wearDelay:0,ballAgeRate:1.15},{id:"tranquillity",country:"beyond",name:"Tranquillity Oval",description:"Moon \xB7 Low gravity keeps lofted shots and catches aloft; attacking the stumps avoids the aerial lottery.",pitch:"hard",pitches:["hard","true","hard"],boundaryBias:2,drainage:2,wearDelay:2,altitude:2,outfieldBias:1,anomaly:"low_gravity"},{id:"pelagia",country:"beyond",name:"Pelagia Dome",description:"Underwater city \xB7 Tidal pressure alternates each session between lavish swing and heavy aerial strokes.",pitch:"true",pitches:["true","slow","hard"],boundaryBias:0,drainage:2,wearDelay:1,humidity:2,anomaly:"tidal"},{id:"cloudspire",country:"beyond",name:"Cloudspire Ground",description:"Floating city \xB7 Crosswinds reverse with the sessions, exaggerating swing and making lofted hitting volatile.",pitch:"hard",pitches:["hard","green","true"],boundaryBias:1,drainage:2,wearDelay:1,wind:2,anomaly:"crosswind"},{id:"dragons_rest",country:"beyond",name:"Dragon's Rest",description:"Mythical caldera \xB7 Thermal updrafts carry sixes and catches while the hot square wears at remarkable speed.",pitch:"wearing",pitches:["wearing","hard","slow"],boundaryBias:1,drainage:2,wearDelay:0,ballAgeRate:1.3,anomaly:"thermals"},{id:"giants_table",country:"beyond",name:"The Giant's Table",description:"Mythical highland \xB7 Colossal boundaries turn many fours into twos and sixes into threes; running decides innings.",pitch:"true",pitches:["true","hard","slow"],boundaryBias:-2,drainage:1,wearDelay:1,anomaly:"giant"},{id:"clockwork",country:"beyond",name:"Clockwork Gardens",description:"Mechanical realm \xB7 The ball ages at a different rate each session, announced in the conditions panel.",pitch:"true",pitches:["true","wearing","hard","slow"],boundaryBias:0,drainage:2,wearDelay:0,anomaly:"clockwork"}];function cs(e,t){return e.anomaly?e.anomaly==="low_gravity"?{label:"LOW GRAVITY",description:"Lofted strokes carry; catches hang. Attack the stumps to avoid the aerial lottery.",scoringBias:1,appealBias:0,ballAgeRate:1}:e.anomaly==="tidal"?t%2===0?{label:"HIGH TIDE",description:"Pressure is bending the ball: swing gains, aerial strokes labour.",scoringBias:-1,appealBias:1,ballAgeRate:1}:{label:"LOW TIDE",description:"The dome relaxes: timing improves and swing loses some bite.",scoringBias:1,appealBias:-1,ballAgeRate:1}:e.anomaly==="crosswind"?t%2===0?{label:"WESTERLY CROSSWIND",description:"Swing is amplified and lofted shots may sail. Conventional fields limit the gamble.",scoringBias:1,appealBias:1,ballAgeRate:1}:{label:"EASTERLY CROSSWIND",description:"The wind has reversed; variation and placement become more valuable.",scoringBias:0,appealBias:1,ballAgeRate:1}:e.anomaly==="thermals"?{label:"THERMAL UPDRAFTS",description:"Aerial strokes travel, aerial chances linger, and the square ages rapidly.",scoringBias:1,appealBias:1,ballAgeRate:1.35}:e.anomaly==="giant"?{label:"COLOSSAL BOUNDARIES",description:"Boundary blows are shortened; save singles and force the batters to keep running.",scoringBias:-1,appealBias:-1,ballAgeRate:1,mode:"giant"}:t%3===0?{label:"QUICKENED MECHANISM",description:"The clockwork is fast: the ball ages twice as quickly this session.",scoringBias:0,appealBias:0,ballAgeRate:2}:t%3===1?{label:"SLOWED MECHANISM",description:"The clockwork is slow: the ball keeps its condition for longer.",scoringBias:1,appealBias:0,ballAgeRate:.5}:{label:"TRUE MECHANISM",description:"The gears run to ordinary cricket time for this session.",scoringBias:0,appealBias:0,ballAgeRate:1}:null}function Bh(e){return!!(e&&Te[e.country].kind==="beyond")}function Oy(e,t){let a=e.climate||Te[e.country].weather;if(!t)return[...a];let n={sunny:["sunny","bright","hot"],bright:["bright","sunny","cloudy"],cloudy:["cloudy","bright","overcast"],overcast:["overcast","cloudy","showers"],showers:["cloudy","overcast","bright"],hot:["hot","sunny","bright"]};return[...a,t,t,...n[t]]}function Vo(e,t,a,n,i,s){let r=e.filter(k=>t==="world"?Te[k.country].kind==="test":k.country===t),o=r.length?r:e.filter(k=>Te[k.country].kind==="test"),c=a==="random"?-1:o.findIndex(k=>k.id===a),u=c>=0?c:Math.min(o.length-1,Math.floor(s*o.length));if(t!=="world"||!i)return Array.from({length:n},(k,S)=>o[(u+(i?S:0))%o.length].id);let m=Yo,w=o[u],g=m.indexOf(w.country);return Array.from({length:n},(k,S)=>{if(S===0)return w.id;let A=e.filter(_=>_.country===m[(g+S)%m.length]);return A[(Math.floor(S/m.length)+u)%A.length].id})}var $y="Arthur Wainfleet",Dy=[{id:"howzat",country:"england",character:"Hard, honest and usually fair",weapon:"Fast bowling with the new ball",drawPressure:"Moderate",memory:"Every cricketer needs one ground by which all the others are measured. For me it was Howzat. The pavilion clock was slow, the tea was strong and the pitch generally gave a good player precisely what he had earned \u2014 though never quite when he expected it.",counsel:"Do not arrive with a grand theory. Use the new ball properly, watch the sky and let the first few overs tell you what sort of match has come to meet you. A first-innings score around the middle hundreds keeps every result alive."},{id:"willow",country:"england",character:"Green, enclosed and watchful",weapon:"Seam bowling",drawPressure:"Low",memory:"The first time I captained at Willow Vale I mistook the quiet for peace. It was nothing of the sort. The crowd simply knew that on a green morning one good ball would soon bring another. We were three down before the church clock had finished striking eleven.",counsel:"Survive before you prosper. Openers should value their wickets, while seamers must attack before the grass fades. If you bowl first and waste the new ball, Willow becomes a far more ordinary place by afternoon."},{id:"sunbank",country:"england",character:"True, quick-scoring and unforgiving to captains",weapon:"Swing and relentless changes of angle",drawPressure:"Very high",memory:"At Sunbank the scoreboard attendant keeps the chalk in his hand. I once watched a respectable defensive field disappear beneath a tide of boundaries, every stroke greeted as though the crowd had ordered it with lunch. The pitch did not betray us; our caution did.",counsel:"Runs come quickly and the short square boundaries punish empty fields. Think about the declaration earlier than feels polite. With the ball, vary the attack and accept that buying a wicket may cost runs. Waiting for the surface to win the match for you is a fine way to draw it."},{id:"marsh",country:"england",character:"Slow, spacious and short of time",weapon:"Leg-spin",drawPressure:"High",memory:"A boundary at Marsh End must often be completed by committee: batter, partner and a weary fielder chasing towards the reeds. The ball seems to gather mud in its thoughts even on a dry day. Many a bright innings has sunk there without ever quite collapsing.",counsel:"Run hard and resist the temptation to wait for fours. Leg-spin gives the best chance of making the slow surface do something decisive. Keep one eye on the match clock; moderate scores can consume an immoderate amount of the five days."},{id:"foundry",country:"england",character:"Sound early, spiteful late",weapon:"Off-spin as the rough widens",drawPressure:"Low",memory:"The Old Foundry smells faintly of iron after rain. On the first morning its pitch can appear almost courteous. By the last afternoon the cracks have joined forces and the same ball that once came on to the bat begins stopping to inspect it.",counsel:"Bat while the surface is still an ally and do not leave the chase to the fourth innings if you can avoid it. Pace has a role early, but keep an off-spinner fresh for the wearing pitch. This ground usually produces a result if the captain allows it to age."},{id:"seabank",country:"england",character:"Hard underneath, restless overhead",weapon:"Fast bowling",drawPressure:"Moderate",memory:"At Seabank you can watch the weather arrive from beyond the sightscreen. I have left the field beneath blue sky and returned after tea to find the floodlights wondering whether they ought to come on. The pitch carries throughout; the air supplies the plot.",counsel:"Captain by the session. Fast bowlers enjoy the carry, but cloud may briefly make swing the sharper instrument. Batters should score while the light is kind. A plan chosen at breakfast may be quite wrong by tea."},{id:"meadow",country:"england",character:"True, vast and deceptively peaceful",weapon:"Swing bowling",drawPressure:"Very high",memory:"The Long Meadow is beautiful enough to make a captain sentimental, which is dangerous. Its boundaries retreat as you approach them and a well-timed stroke returns as a breathless three. We once batted all day there and still felt we had been standing still.",counsel:"Value running and partnerships more than boundary counts. The true pitch allows long occupations, so declarations matter enormously. Swing offers the best chance of interrupting an innings before it settles into the landscape."},{id:"pavilion",country:"england",character:"Hard, compact and theatrical",weapon:"Out-and-out pace",drawPressure:"Very high",memory:"At Pavilion Park the crowd sits close enough to complete an appeal before the wicketkeeper has begun it. The boundaries are inviting, the scoreboard excitable and no lead feels quite safe. I have seen a match change character there in the time it takes to remove a sweater.",counsel:"Set targets with a margin for sudden acceleration. Fast bowling is the best counter to a surface that rewards confident strokes, but a catching field will leak boundaries. Use aggression in spells, not as a permanent state of mind."},{id:"redbank",country:"australia",character:"Hard, dry and full of carry",weapon:"Fast bowling",drawPressure:"Moderate",memory:"The sound of bat on ball travels differently at Redbank \u2014 harder and cleaner, as if struck against the red earth itself. Our first tour there began with two bruised gloves and ended with a hundred made almost entirely in front of square.",counsel:"Do not confuse bounce with automatic wickets. Genuine pace can hurry a batter, but the reliable surface rewards anything loose. Batters who settle should make the innings count before the late cracks bring the match back towards the bowlers."},{id:"southern_bay",country:"australia",character:"Coastal, changeable and balanced",weapon:"Fast bowling, with swing under cloud",drawPressure:"Moderate",memory:"Southern Bay is where touring sides discover they packed for the wrong Australia. I have worn a sweater at breakfast, removed it before lunch and watched the ball swing after tea. The sea breeze has embarrassed many confident forecasts.",counsel:"Read the day in front of you rather than the country on the fixture list. Pace remains useful, but cloud can make swing decisive and the occasional green surface rewards seam. It is an excellent ground for a balanced attack."},{id:"ironbark",country:"australia",character:"Brisk early, abrasive later",weapon:"Leg-spin after the quicks",drawPressure:"Moderate",memory:"An Ironbark Test changes its accent as it goes. The quicks speak first, loudly, while the pitch is hard. By the later days the footmarks have taken over the conversation and the spinner who seemed ornamental on the first morning becomes captain of the whole affair.",counsel:"Select an attack for five days, not five overs. Use pace with the new ball, then hand responsibility to leg-spin as the surface wears. Excellent drainage means there is usually enough time for both halves of the plan."},{id:"gulmohar",country:"india",character:"Patient early, turning late",weapon:"Leg-spin",drawPressure:"High",memory:"Gulmohar taught me that patience and passivity are not the same thing. One morning our openers seemed to do nothing for an age; by tea they had built the only innings that mattered. Days later the rough opened like a second set of fielders around the bat.",counsel:"Bat first if you can and build while the bounce is even. Wear arrives a little later here, so a captain must create time for the spinners rather than assume it will appear. Leg-spin is the likeliest match-winner once the pitch begins to turn."},{id:"saffron",country:"india",character:"Dry, wearing and increasingly tactical",weapon:"Leg-spin",drawPressure:"Moderate",memory:"At Saffron Gardens the rough appears gradually, like ink soaking into paper. By the time everyone agrees it is there, the spinner has already moved a short leg two paces closer and the batter has begun examining marks that were invisible at lunch.",counsel:"First-innings runs purchase enormous influence. The surface wears earlier than Gulmohar and the excellent drainage protects the clock, so keep a specialist spinner ready. Make the fourth innings belong to your bowlers, not your batters."},{id:"hillfort",country:"india",character:"Firm, breezy and friendly to pace",weapon:"Fast bowling",drawPressure:"Moderate",memory:"Hillfort is the ground on an Indian tour that catches out the team selected for everywhere else. The air moves across the upland and the pitch has enough firmness to put the quicks back in the captain's thoughts. We once arrived with three spinners and spent two days apologising to our opening bowler.",counsel:"Do not select by reputation. Fast bowling is often the best weapon, especially under cloud, while the occasional green strip rewards patience from the top order. It is the best place in India to retain a varied attack."},{id:"cinnamon",country:"sri_lanka",character:"Warm, slow and steadily gripping",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Cinnamon Gardens has the most handsome scoreboard I ever lost beneath. Early on, the pitch allows a batter to arrange an innings with care. Later, every spinner seems to discover an extra finger and every captain an extra close catcher.",counsel:"Take the early batting seriously: those are the easiest runs the match will offer. As the surface dries, move towards spin without abandoning control. Leg-spin carries the greatest attacking promise across a full innings."},{id:"palm_coast",country:"sri_lanka",character:"Abrasive, coastal and interrupted",weapon:"Leg-spin",drawPressure:"Moderate",memory:"Rain at Palm Coast seldom asks permission. It comes sideways, empties the ground and leaves just as abruptly, whereupon the excellent drainage produces a pitch before the players have finished their tea. The restart is often more dangerous than the shower.",counsel:"Stay tactically awake through interruptions. The drainage preserves more play than the forecast suggests, while the abrasive square gives leg-spin increasing value. Batters should rebuild concentration before trying to recover lost time in a single over."},{id:"highland",country:"sri_lanka",character:"Cloudy early, slow once settled",weapon:"Leg-spin over the full match",drawPressure:"Moderate",memory:"Highland Oval can look like a seamer's private estate when cloud sits over the hills. That impression does not last. The early movement fades, the surface settles and, by the time the mist returns, it is often the spinner turning the match rather than the ball swinging.",counsel:"Use seam and pace while the new ball and cloud agree, but retain a strong spinner for the longer work. Batters who survive the opening passage should resist chasing the game too soon; the surface usually becomes more manageable before it wears again."}];function Iy(e){return e.anomaly==="low_gravity"?"Attack the stumps":e.anomaly==="giant"?"Saving singles and patient spin":e.anomaly==="clockwork"?"Reading the ball-age mechanism":e.anomaly==="thermals"?"Boundary riders and leg-spin":e.anomaly==="tidal"||e.anomaly==="crosswind"?"Swing bowling at the favourable turn":(e.wind||0)+(e.humidity||0)>=3?"Swing bowling":e.pitch==="green"?"Seam bowling":e.pitch==="wearing"||e.pitch==="slow"?"Leg-spin":e.pitch==="hard"||(e.altitude||0)>0?"Fast bowling":"A balanced attack"}var xk={silver_fern:"Silver Fern Basin sits so neatly among the hills that a touring captain may mistake shelter for mercy. On our first morning there the cloud never appeared to move, yet the ball wandered about like a sheep without a gate. We reached lunch four down and congratulated ourselves on the achievement.",volcanic_plateau:"At Volcanic Plateau the ground steams faintly after rain and the drainage works with indecent efficiency. I once sent the side back to the hotel during a downpour, only to be summoned ten minutes later and informed that play had resumed without us. The pitch was firmer after the shower than our excuses.",southern_sound:"The wind at Southern Sound once removed my cap, a bail and three pages of the scorer's book in the same over. Our swing bowler followed all three towards fine leg. It is a beautiful ground, provided one accepts that the weather is entitled to alter the field without consulting the captain.",indus_gardens:"The opening morning at Indus Gardens can feel less like a contest than an invitation. We accepted it greedily and were 286 for two by tea; by the next evening the dry square had begun keeping its own counsel. That Test taught me that easy runs are not free runs\u2014they are an advance payment on later trouble.",frontier_oval:"Frontier Oval announced itself with a ball that passed our opener's nose and reached the keeper at shoulder height. The next was driven through cover with scarcely a sound. For five days the pitch held that argument between fast bowling and brave batting, and neither side ever quite won it.",lantern_city:"We played beneath the lamps at Lantern City while the old ball scuffed itself the colour of the square. For thirty overs it did nothing; then it began reversing as if somebody had whispered a secret to it. Our middle order spent the evening accusing the laws of physics of favouritism.",highveld_park:"At Highveld Park I watched a top edge travel far enough to require refreshments. The same thin air that carries a mistimed hook also seems to sharpen the fast bowler's hurry. A captain spends the match alternating between admiring the spectacle and moving another fielder towards the rope.",cape_wind:"Cape Wind Ground gave me the most expensive bowling change of my career. I replaced a swing bowler because the sun had appeared; before his successor reached his mark, the cloud returned and the crosswind turned cold. The outgoing bowler reminded me of this at every reunion for twenty years.",baobab:"There is an old baobab beyond midwicket at this ground, and one can measure the match by its shadow. Early in the Test the ball comes gently onto the bat. By the time that shadow has crossed the square a dozen times, the spinner is setting the field and everybody else is merely offering suggestions.",trade_winds:"Trade Winds Oval carries sound, scent and cricket clean across the ground. On a lively first day our quicks had the slips hopping; after lunch the same breeze pushed three handsome drives beyond their reach. The crowd enjoyed both developments and showed no loyalty to our tactical dignity.",coral_bay:"At Coral Bay a shower emptied the terraces, polished the light and disappeared before the covers had settled. The first ball after the restart went for six and landed among spectators still returning with drinks. Compact grounds create instant folklore because every mistake has witnesses at close range.",rainforest_park:"Rainforest Park is never silent. Even in a maiden over there are insects, dripping leaves and a heavy outfield muttering beneath the ball. We once defended 214 there as though guarding a fortune; every boundary required such labour that the batters began applauding their own running.",delta_pavilion:"The air at Delta Pavilion clings to a touring shirt before breakfast. I remember our off-spinner asking for the ball in the ninth over and keeping it until dusk, by which time his fingers were raw and the opposition had forgotten what pace bowling looked like. The pitch had begun turning before either captain admitted it.",river_city:"River City tempted us with two sessions of immaculate batting. We declared that evening's damp a minor inconvenience and resumed the next morning to discover the ball stopping, gripping and generally revising the terms of our arrangement. Grounds beside great rivers are accustomed to changing their minds.",port_crescent:"At Port Crescent the cranes beyond the pavilion vanish whenever the cloud drops. During one such spell our seamers took three wickets; when the skyline returned, so did the batters' timing. I learned to watch the harbour rather than the scoreboard when deciding who should bowl next.",granite_ridge:"Granite Ridge is ringed by stone and played beneath an enormous sky. The outfield gave our best drives the speed of telegrams, but the bounce gave the local quicks an answer of their own. It remains the only ground where I was pleased to see 300 and frightened by it at the same time.",jacaranda:"Jacaranda Oval was in bloom when we arrived, scattering purple across a pitch so true that even my forward defence looked competent. By the second afternoon the scorebook had become indecently fat. A captain must manufacture wickets there, preferably before the beauty of the place makes him philosophical.",matobo:"The boundaries at Matobo Park seem to move away from a batter who is already running. Our finest stroke of the first day produced three, two aching calves and an argument about a fourth. By the final morning the worn square belonged to the spinners, who alone appeared not to be tired.",atlantic_commons:"Atlantic Commons gave us a morning of four seasons and six wickets. A patch of blue sky encouraged one batter to remove his sweater; the next ball seamed past him and removed his off stump. The Atlantic regards optimism as something to be corrected promptly.",loughside:"At Loughside the rain does not always fall; sometimes it simply hangs around the ground and waits to be noticed. We lost time, towels and nearly the match before a late partnership carried us to safety. The local ducks, I recall, showed much greater urgency between the wickets.",walled_city:"Walled City Oval keeps the early wind outside and the early movement on the pitch. We survived the new ball with more luck than technique, then watched the surface become a batter's ally by lunch. The old walls have seen enough sieges to know that patience usually outlasts noise.",citadel:"The climb to Citadel Ground leaves a tourist short of breath before the fast bowlers have contributed. On our first afternoon the ball climbed sharply, then the dry surface began taking scratches like an old desk. We selected for the first day and spent the fifth wishing we had selected for the last.",pamir:"Snow remained on the distant peaks when we played at Pamir Oval, though the square itself was hard enough to ring beneath a boot. The quicks found carry, the seamers found movement and our opening pair found several reasons to inspect their gloves. It was magnificent cricket from a safe distance.",amber_plain:"Amber Plain glows in the late afternoon, which is precisely when its leg-spinner becomes most troublesome. I once delayed using ours because the first innings had looked comfortable. By the time I corrected the error, the pitch was turning and the match was not\u2014in our direction, at least.",tranquillity:"The first six at Tranquillity Oval remained in the air so long that mid-on reconsidered his entire childhood beneath it. Low gravity turns every lofted stroke into a small astronomical event. I eventually removed the slips, attacked the stumps and tried not to look upwards.",pelagia:"At Pelagia Dome the shoals beyond the transparent roof changed direction just before the tide. Our swing bowler noticed before I did and took two wickets while I was still admiring the fish. The pressure eased after lunch, whereupon the batters began driving as though released from deep water.",cloudspire:"Cloudspire has no horizon, only layers of weather beneath one's feet. A crosswind once took a perfectly respectable outswinger and returned it as something no coaching manual had named. The batter missed, the keeper applauded and the umpire looked briefly over the edge.",dragons_rest:"A warm gust rose from the caldera at Dragon's Rest and carried a mis-hit beyond long-on; two overs later it held a catch above cover until three fielders had assembled beneath it. We stopped calling the updraft unfair when it dismissed their captain. Cricketing principles are remarkably sensitive to the score.",giants_table:"The Giant's Table made our boundary hitters look like men throwing pebbles across a lake. A stroke that would have cleared Pavilion Park returned as a breathless three, and by tea both sides were bargaining with their hamstrings. I have never valued a sharp single more highly\u2014or wished for a smaller kingdom.",clockwork:"At Clockwork Gardens a brass bell announces each change in the mechanism. One session aged the ball before our eyes; the next preserved its shine as if sealed in a cabinet. Our scorer adapted immediately. The rest of us required two days and several pointed notes from the pavilion."};function Rk(e){let t=cs(e,0),a=e.drainage===0||e.boundaryBias<=-2?"High":e.boundaryBias>=2||e.pitch==="true"?"Very high":e.pitch==="green"||e.pitch==="wearing"?"Low":"Moderate",n=t?`${t.label.toLowerCase()}, strange and entirely itself`:e.pitch==="hard"?"Firm, brisk and full of carry":e.pitch==="green"?"Green, mo "He has marked the inland fixtures in his diary as the places where he must prove himself.","His father still works at the depot; Jalen wants his quiet overs to mean something there.","He rehearses the leg-break after practice, determined not to remain a one-trick curiosity.","Voss wants him to attack; the coaches are trying to give that pace a repeatable shape."],gulmohar:["He still returns to his first concrete practice strip when his timing deserts him.","The archive holds his fearless school scores, but the senior side now needs his judgement.","When a partnership breaks, he begins again as if drawing a cleaner set of plans.","A beloved veteran may lose a place under him; Rathore knows the cost of that promise.","He is often the first to notice a teammate struggling, and the last to say so publicly.","He hopes the next generation will inherit an archive with room for their own names.","On tour he keeps time by tapping the dressing-room bench, a habit the bowlers now imitate.","His old village coach still sends corrections after every televised spell.","He collects train tickets from tours and measures himself against the movement in unfamiliar air.","The captain asks for control; he keeps a private list of batters worth tempting anyway.","An open-net six balls changed his life; he never walks past a waiting trialist."],cinnamon:["The younger batters copy his leave, though he would prefer them to remember his rare straight drive.","A year of expectation has made him quieter, but it has not dimmed his appetite for a chase.","He often translates between personalities as carefully as he reads a field.","His hardest choice is whether to protect the side's elegance or risk looking untidy in pursuit of a win.","When a game turns rough, he enjoys finding a route nobody discussed at the morning meeting.","He practises with a worn ball, trying to make the same hand position tell three different stories.","He notices a batter's nerves at the crease and writes the detail on the back of a scorecard.","Every tour makes him change one small thing, which is why his old teammates barely recognise his action.","His colleagues ask whether the practice strip is fair; he answers by inviting them to bat on it.","The smile disappears when a batter starts reading him, and a new variation usually follows.","He has accepted a shorter first spell, though he longs to be trusted when the ball softens."],silver_fern:["A good innings brings messages from cousins across the basin, each claiming to have taught his first shot.","He studies the opposing quick all tour and keeps their next meeting to himself.","The headlines embarrass him; he would rather turn one bright hundred into a dependable season.","He gives every player a voice, then carries the blame when the shared decision fails.","He keeps the analysis notebook closed during team meals, a promise he is learning to honour.","There is a place for a star in this modest side, if he can learn to accept it.","He brings a travel keyboard on tour and sometimes finds a keeper's rhythm before a song's.","He plants a sapling for each debutant, then checks whether the newcomers are being watered too.","At the observatory he watches slow changes; on the field he makes a batter feel every one of them.","His family taught him that good work can be both patient and impossible to ignore.","He keeps his father's old coaching notes but is beginning to write over their margins."],indus:["He presses a crease mark into the soil as carefully as his family once folded a spine.","After one reckless dismissal he stayed at the ground until the lights went out, practising the leave.","Children imitate the drive; Raza would like them to notice the work between the boundaries.","He knows every selection will be read as a verdict on his promise to trust the young.","He holds the old ball as though it contains a secret, then spends the evening explaining it to apprentices.","His best days arrive late, when he can take a tired innings or ball somewhere unexpected.","The hardest part of his job is telling two friends that only one can keep wicket.","He wants his quickest spell to be remembered for an idea as well as a speed reading.","A stubborn afternoon without swing used to trouble him; now he treats it as an invitation.","He enjoys the crowd's gasp but is trying to earn the captain's quieter trust.","He has won ugly matches with an old ball and still keeps the unflattering scorecards."],maredi:["His first request on tour is a fast net, where he can remind himself what the ball is doing.","He has stopped correcting people who call the club his inheritance; the next innings is his reply.","He coaches the juniors on the same difficult starts he is often sent out to repair.","He wants every story in the club to be heard, even when it complicates his team sheet.","Injured teammates come to him first; he wishes they would also ask about his batting.","Sheer strength brought him here, but he knows the next step is deciding when to wait.","The caf\xE9 argument after each Test matters almost as much to him as the result.","She has made it impossible for selection meetings to discuss her as merely a useful outsider.","A maiden over from him can feel like a promise the whole attack must keep.","He has a notebook of wickets taken away from the Highveld, ready for the next doubter.","The captain wants his pace in every Test; his body and the physio have other views."],trade_winds:["He wants an innings that travels farther than the fishing-town radio signal ever did.","On a flat pitch he sometimes misses the hillside's uneven bounce and must invent his own patience.","His best partnerships change key halfway through without anyone hearing the adjustment.","He loves a full ground, but knows the quieter dressing-room conversations decide a long series.","Every tour asks him to speak for several islands; he would rather listen before answering.","He is still learning to trust the leg-break when the match stops feeling like a street game.","He can turn an overthrow into theatre, then spend an hour correcting his own footwork.","The old quicks watch his run-up; he wants their respect without copying their career.","He talks openly about the fear that follows a brilliant spell and keeps running in anyway.","A five-wicket afternoon would help settle the argument that spin is only a change of pace here.","He accepts the invisible overs, knowing they let the fast bowlers return to applause."],delta:["He is happiest when an impatient captain has to move a fielder twice before lunch.","He grew up watching boats leave at dawn and still likes to turn a hurried single into a voyage.","The academy students ask why he came back; each winter he finds a new answer.","He knows exactly how fragile calm can be because he had to rebuild it ball by ball.","He hides a new delivery until the field is set to make the old one look certain.","He has learned to score runs without waiting for a spinner to become tired.","He thinks a good lunch can repair a fielding side as surely as a wicket.","He is practising with the old ball now, unwilling to be sent away after the shine fades.","He asks close fielders to speak softly so a batter can hear the ball turning.","The ferry crossing taught him wind; he is still learning when to ignore it.","The club took a chance on him and he intends to make the next academy place easier to win."],granite:["He helps at the academy reluctantly, then stays longest when a child finally learns to leave.","He keeps a small tally of the thirty-run innings that once would have become rash twenties.","He returned when the team needed runs, and now must help it expect more than survival.","He is trying to build a side that wins before the spectators start praising its resilience.","He has known the ridge in every season and resents the idea that his craft belongs only there.","The dressing room calls for him in trouble; he wants a chance to shape a game from the start.","He is teaching a young keeper everything that made the old coaches doubt him.","He waits for the wind to settle, then asks the batter to make the first mistake.","The school fields gave him no straight run-up; the rough ground made him accurate anyway.","A batter's six only tells him where to pitch the next ball.","He turned down a safer offer, and every new season makes that decision feel larger."],atlantic:["His kit bag always contains a dry pair of gloves and a scorecard from a washed-out triumph.","The captain trusts his cover drive; Fionn is learning to trust the innings around it.","He remembers when indoor nets were all he had, and makes room for the next newcomer.","He writes a few lines after every Test, though the best endings are rarely the ones he planned.","He says the simplest field is usually right, then spends a whole session proving it.","He has stopped trying to win every exchange and started learning how to stay in one.","He can tell the length of a delay by how many boats he has carved.","Those streetlight evenings still return to him when a bright new ball refuses to swing.","He takes the ball when the weather leaves everyone else asking which end to use.","The club wants him to contain; he keeps showing them the wicket-taking field.","He has the pace for a long career, provided they let him grow one spell at a time."],citadel:["After practice he stays to show children why a well-judged leave can win an over.","His finest innings have come after surviving the first temptation to answer every ball.","Each tour makes him explain where he belongs; at the crease he can simply belong to the innings.","He is gathering coaches and scorebooks so the club can outlast any one captain.","His notebook travels in the kit trunk, where every returning player can add a page.","The captain gives him freedom, but Qais is beginning to value the plan behind the surprise.","He listens more than he translates, knowing that teammates sometimes need silence first.","He wants a young quick to inherit the work of his spell, not just the story told about it.","He rarely raises his voice; by the end of a long afternoon the batters have heard him clearly.","He is teaching apprentices the awkward grip that once made coaches ask him to change.","One wild over still follows him in conversation; he is working towards the patient spell after it."]},Xy={hatherley:["Edmund grew up scoring Hatherley games from the pavilion steps. Now a reserve keeper, he is determined that his first catch will be written into the same battered book.","Rory's opening stand in the winter league made the selectors look twice. He still works the gate at junior matches and knows who was cheering before anyone knew his name.","Hugh can bowl spin through an entire practice without repeating a field. Wetherall admires his nerve but wants to know whether he can keep one plan for six balls.","Oscar brings a sharp new-ball spell from the county's outer clubs. He keeps an old timetable in his kit, a reminder of the trains he took to reach his first trial.","Niall taught himself leg-spin from diagrams in discarded scorebooks. His googly is real; he wants the senior side to believe the stock ball is too.","Arthur opens with an appetite the old pavilion finds suspicious. He is trying to prove that an attacking first hour can still be Hatherley cricket.","Seth spent years as a net seamer before a late wicket haul forced a selection debate. He has no wish to return to being useful only on Thursdays.","Laurence collects the batting gloves of retired county players and wears none of them. A middle-order place, he says, ought to be earned in his own hands."],redbank:["Mason keeps wicket with a workshop apprentice's quick hands. The senior players tease his tidy kit, but he has a reply prepared for every ball that gets past them.","Ethan learned to open on a gravel oval where the bounce told no two stories alike. Redbank's hard pitches suit him; he still wants to learn when to leave.","Joel's off-spin made him indispensable to the depot side. He is waiting to show Voss that a patient spell can set up an aggressive field.","Tyler bowls fast enough to attract a crowd to an empty net. His older sister keeps a notebook of the days he remembered to bowl straight.","Nathan practises leg-spin after shifts at the riverside yard. He talks openly about the sixes he has conceded, and remembers every batter who took the risk.","Samir was once called too careful for Redbank's top order. His answer has been to bat longer and make room for the hitters around him.","Harrison learned seam bowling on the rebuilt oval and helped paint its stand. He wants his first home wicket to belong to the club that kept the ground open.","Blake's middle-order runs have rescued more club games than the selectors noticed. He is learning to ask for a place instead of waiting for a vacancy."],gulmohar:["Ritesh kept wicket at an open net when nobody had brought gloves. He has returned every year since and now wants the senior cap that first afternoon made possible.","Aman opens with the confidence of a district tournament winner. He keeps his losing final scorecard beside the winning one to remember how quickly a reputation changes.","Yusuf's off-spin began in a courtyard too narrow for a long run-up. His best spell came against friends who knew every variation and still missed the arm ball.","Samar has the pace to unsettle a practice session. Rathore has asked him to stay for the quiet overs too, when a fast bowler must build rather than announce.","Aditya treats leg-spin as a question put to the batter. He writes the answers in the archive margins, though Pranav insists the library books are not his notebook.","Rafiq has worked his way from the annual open net to the touring party. He bats as though each chance should make the next unknown trialist easier to invite.","Omkar's seam bowling grew from afternoons on a school roof. He is saving for a proper pair of boots and trying to make his old run-up unnecessary.","Kunal sketches field placements on receipts from the reading-room caf\xE9. He wants his first middle-order innings to be something more than a clever diagram."],cinnamon:["Nuwan keeps wicket with a dancer's balance and a mechanic's patience. He wants Farzan to see a rival for the gloves, not merely a dependable substitute.","Tharindu learned his opening game on a narrow strip beside the sea. He judges the first ball by sound, then tries not to let the memory overrule the pitch.","Imesh bowls slow off-spin with a smile that disappears when the batter charges. The captain hopes his calm can survive the third over of a difficult spell.","Dinuka's pace first turned heads at a school reunion match. He has been learning lengths ever since, eager for a Test that asks him to return for a second spell.","Shenali keeps a notebook of wrist positions and refuses to call a poor ball unlucky. Her leg-spin has made the practice batters cautious of the quietest reserve.","Lahiru drives beautifully in the nets and used to disappear in long innings. An ugly, match-saving fifty has changed how the coaches speak about him.","Roshan's seamers arrive from a short run-up he refuses to lengthen. He says a bowler should save some energy for listening to what the surface says.","Kasun is the touring side's first volunteer for a difficult middle-order place. He is trying to make improvisation look like a plan rather than an emergency."],silver_fern:["Fraser has kept wicket for three generations of Basin captains in club photographs. He wants one image where the ball is in his gloves and the Test is his.","Manaia opens with the patience of someone who has rebuilt more than one school practice pitch. Their wh\u0101nau come early to every match, even when selection does not.","Luke's off-spin is shaped by long indoor winters. He wants a place on a dry tour to prove that his best ball was never a trick of the Basin air.","Kahu was a fast bowler before a long injury made him start his run-up again. The new action feels strange, but the first ball after the return did not.","Ollie learned leg-spin by bowling at a stump left in the park. He records each over in a small notebook and wants to stop crossing out the bad ones.","Neel has captained a school side and knows how lonely a quiet opener can feel. He is ready to score the runs without needing the first word at team meetings.","Tane's seam spell won a Basin derby while the usual stars went wicketless. He still carries that ball, though he knows the next chance must stand on its own.","Joel often repairs teammates' bats before working on his own innings. He wants to be known for a fifth-day stand rather than the kindness of his kit bag."],indus:["Imran keeps wicket in the narrow practice lane behind the Gardens. He can hear a batter's doubt from there and wants a Test to prove his judgement travels.","Kamran's opening game is full of daring pulls and anxious leaves. He keeps a letter from a former coach asking him to trust the leave as much as the shot.","Shahmeer bowls off-spin with a fast bowler's impatience. Daniyal has challenged him to win an over by giving away nothing at all.","Arsalan's new-ball pace brought him into the squad; his older brother still asks whether he can return with the old ball. The answer is almost ready.","Hamza studies leg-spin on cracked practice strips after everyone has gone home. He wants the Gardens crowd to remember the ball before it turns, not only the wicket.","Naveed bats at the top of the order with the air of someone late for a train. He is trying to make a long partnership feel as exciting as a quick start.","Tahir found late movement while bowling to neighbours in a courtyard. His place depends on showing it again when the ball is older and nobody is watching.","Faisal has rescued club matches with hurried middle-order runs and then apologised for the chances he took. His captain would prefer he stop apologising."],maredi:["Arun learned wicketkeeping at the caf\xE9's back-yard wall, returning every ball before the cook noticed. He wants a chance to keep in front of the whole club.","Imran opens with a careful defence that can suddenly become a counterattack. He has marked the high-bounce away grounds as the true test of his selection.","Chamu's off-spin carries the quiet persistence of long academy evenings. Farai mentors him, though the two both know the same place may eventually be at stake.","Yasir bowls fast from a run-up measured in neat steps. His family still come to the nets because they have learned to tell from the first stride how he feels.","Nikhil practises leg-spin against Sanele until the light fails. Their friendly argument about flight has become the club's best unofficial coaching session.","Ebrahim learned to bat on hard surfaces that punished a slow first movement. He wants to show the senior side he can wait for an innings, too.","Sizwe is a seam bowler who takes the awkward end without complaint. He keeps track of the chances his pressure makes for someone else and calls them his share.","Ravi scores middle-order runs with a mechanic's attention to small adjustments. He has turned down a safer batting slot because he wants to matter when the innings frays."],trade_winds:["Shamar keeps wicket with the instinct of a beach cricketer and the precision of a watchmaker. He wants Joel to hear a real selection challenge behind their jokes.","Lennox opens for a harbour side where every boundary lands near the water. He has promised his family an innings they can listen to from beginning to end.","Dinesh brings off-spin from a little ground where the sea breeze never settles. His variations travel well; his confidence still needs an overseas spell.","Keon bowls fast and claims his cousin Kemar taught him everything except patience. He is looking for a first Test that lasts longer than his opening burst.","Rafael's leg-spin is cheered at home and questioned away. He keeps a list of batters who have not yet faced the ball he believes in most.","Jaden has batted through a storm-delayed chase without losing his place at the top. He wants selectors to value a long innings as loudly as the last six.","Andre's seam bowling was built on a hillside strip shared by three villages. He is learning which conditions reward restraint instead of another shorter ball.","Malik plays the middle order as if every chase remains possible. His captain is trying to teach him the rarer skill of leaving a game alive for someone else."],delta:["Tareq keeps wicket and maintains the junior pavilion scoreboard. He wants the senior players to know him for a difficult take rather than a tidy total.","Pavel opens with little flourish and a stubborn appetite for singles. His first academy coach still phones when he reaches fifty, even if nobody else noticed.","Hasan's off-spin came from bowling in a narrow school corridor. He wants the close fielders to trust his length before they start telling him to turn it more.","Rifat has the pace to make the ball hurry through Delta's slow pitches. The challenge now is proving that a quick can stay useful after the opening spell.","Samiul's leg-break survived a summer when the river covered the nets. He practised with a rubber ball indoors and kept the notebook from that season.","Nabin waits for his chance at the top order without sounding patient. He is building an innings that could make the captain find room for him somewhere else.","Parvez learned to bowl seam in the half-light after a late ferry home. He believes a difficult over can be made smaller, one ball at a time.","Fahim's middle-order batting has held together several academy collapses. He is determined that the senior side will learn his name before a crisis forces it to."],granite:["Blessing keeps wicket for the academy and knows every young bowler's favourite length. She wants the senior gloves without making a friend feel discarded.","Sean attacks the first hour as though the next one is promised. A long partnership on a difficult tour has begun to change his mind about that.","Tatenda's off-spin is built on a rare ability to make a quiet over feel threatening. He is tired of being called a sensible reserve when wickets are needed.","Kudakwashe bowls fast from a rough school-run approach that the coaches keep trying to smooth. He will change anything except the last three strides.","Ryan learned leg-spin from his grandmother's old club scorecards. He wants the new book to contain a spell that nobody can dismiss as a novelty.","Farai bats at the top with an eye for the single that settles a partnership. She has grown weary of being described as a future player by people who never select her.","Tinashe takes the ball at the hard end and asks for one more over. He knows resistance is the club's old virtue; he wants to turn it into a win.","Leonard has played the middle-order repair job since school. He is saving the first ball of his senior cap for a day when the side is already ahead."],atlantic:["Seamus keeps wicket in weather that makes most fielders want the pavilion. He carries a spare pair of dry gloves for whichever youngster follows him out.","Bilal opened his first winter league in a sports hall with taped boundaries. A place outdoors, under a proper sky, remains his private measure of progress.","Aidan's off-spin is learned on days when the wind makes a straight ball strange. He has begun asking for the ball when everyone else wants to wait.","Cillian bowls fast with the same fierce expression he once saved for a close family derby. His older cousin reminds him that the second spell counts too.","Conor keeps a leg-spinner's little collection of near misses. He wants one full afternoon in which a captain leaves his catching field in place.","Imran makes careful top-order runs and speaks up when newcomers feel like visitors. His first Test would belong to more than the selector who chose him.","Oisin's seamers bite on damp mornings; he trains for the rare dry afternoon when nothing helps. He thinks that will be the measure of his craft.","Declan learned to rebuild an innings after so many rain breaks that he now packs his batting gloves in a waterproof bag. He dislikes being called merely reliable."],citadel:["Latif keeps wicket for the travelling side and knows where every spare glove is packed. He is waiting for a Test in which his hands can do the talking.","Samiullah opens in the evening leagues and still phones his first coach after a hard dismissal. He wants the next generation to see patience as an ambition.","Reza's off-spin grew from street games with too little room to bowl quickly. He writes down every change of field he would have made as captain.","Jawad bowls fast and keeps a list of the grounds he has reached by borrowed transport. His next destination is a senior scorecard with his own spell in it.","Wahid's leg-spin looks extravagant beside the club's new coaching plans. He is determined to show that an unusual method can still be taught and trusted.","Zubair bats near the top and helps translate the team's travelling notes. He wants a partnership that lasts longer than any explanation of where he belongs.","Feroz bowls seam after work and saves voice messages from the coaches who cannot be at practice. He is turning their separate advice into one action.","Fahim can settle a troubled middle order without making it look dramatic. He hopes the selectors will notice the innings before the applause arrives."]},Qy={"Orin Vale":"Orin opens as though the horizon belongs to someone else. He watches a ball's shadow before its seam and wants to find out what an Earth bowler considers ordinary.","Cerys Halcyon":"Cerys keeps an atlas of grounds that cannot be placed on maps. She begins cautiously, then changes the direction of an innings without seeming to change a stroke.","Sable Meridian":"Sable was raised on scores from matches nobody can agree took place. She bats with a collector's care and has never told Wainfleet which scorebook started it.","Aster Quoin":"Aster captains as if the ground is one more player. Their field placements seem impossible until the light or flight of the ball makes the geometry plain.","Tavian Rill":"Tavian learnt seam bowling where the air refuses to behave twice in the same way. He wants the Wanderers to earn a victory that needs no explanation from the ground.","Mara Vesper":"Mara bowls wrist-spin under strange skies and refuses the idea that mystery excuses a poor length. She keeps the ball from her first Earth-side wicket wrapped in cloth.","Ivo Pell":"Ivo keeps wicket with the calm of someone used to catches arriving from unexpected angles. He has a habit of asking visiting batters about the ordinary places they miss.","Neris Cloud":"Neris carries a weather notebook with pages that rearrange themselves after rain. She is still trying to separate a good swing ball from a generous atmosphere.","Cael Morrow":"Cael bowls fast on grounds where a high bounce can become a long journey. The first time a batter stood up to him, he asked for another over.","Elian Thorne":"Elian's leg-spin drifts towards slips that were not there when he began his run-up. He practises with an empty field so the trick never replaces the skill.","Sorrel Kest":"Sorrel is the Wanderers' quickest bowler and their most patient listener. She wants to know what courage looks like when the visitors understand the conditions better than she does.","Lio Aster":"Lio keeps wicket from a crouch so still the crowd forgets to watch. The reserve gloves suit him for now; he is waiting for a catch that changes Aster's mind.","Peregrine Moss":"Peregrine opens on distant grounds and collects small stones from each crease. He plans to return them all after an innings that lasts until the light changes.","Una Sol":"Una's off-spin depends on flight that a visitor might mistake for a trick of the sky. She is determined to take a wicket on a ground with no peculiarities at all.","Kiran Tidemark":"Kiran bowls fast beside tides that climb walls at tea. He measures his run-up twice before play, afraid of letting the ground make his decisions for him.","Milo Lune":"Milo sends leg-breaks into the high air and waits longer than most bowlers for the answer. He is learning when to shorten the flight and admit a batter has read him.","Eira Fenn":"Eira bats near the top and remembers every visiting side's first look at the ground. She wants an innings that persuades them to watch her instead of the horizon.","Tarin North":"Tarin's seam bowling travels well between impossible surfaces. He misses the straightforward pitches of his youth and would never admit it to the other Wanderers.","Ayla Quill":"Ayla writes down the stories travelling teams tell over lunch. In the middle order she is trying to make room for one of her own, without waiting for a collapse."};var Jt=["opener","opener","top_order","top_order","all_rounder","all_rounder","middle_order","bowler","bowler","bowler","bowler"],wa=[{id:"hatherley",name:"Hatherley County",country:"england",groundId:"howzat",colours:{primary:"#7d2638",secondary:"#f2e6c9",label:"Claret and cream"},emblem:"A gate in winter elm",founded:"1887",introduction:"Born from a fixture between estate workers and railway clerks, Hatherley regard the scorebook as both record and responsibility. The pavilion clock loses four minutes whenever rain approaches, a fact every captain denies believing and quietly checks.",cricketingIdentity:"Patient batting, paired seam bowling and a stubborn faith that a long match will eventually reveal the better-prepared side.",clubQuestion:"Can a side built to endure learn when to attack?",rivalry:{clubId:"maredi",name:"Maredi CC",trophy:"The Wainfleet\u2013Maredi Ledger",story:"A disputed declaration on an early overseas tour remains unresolved because the surviving scorebooks disagree."},players:[{name:"Alistair Merriton",profile:"Exacting opener; marks guard while humming the first note of a hymn."},{name:"Rowan Hatherley",profile:"Gifted stroke-maker carrying the founder's surname and its unwanted assumptions."},{name:"Giles Penford",profile:"Schoolmaster and notebook tactician who catalogues every bowler's release point."},{name:"Euan Wetherall",profile:"Calm captain whose reluctance to declare is a standing pavilion argument."},{name:"Jasper Crowthorne",profile:"Adventurous left-hander, useful seamer and persuasive captain-in-waiting."},{name:"Hamish Bellcroft",profile:"Former quick who rebuilt himself around cutters after a back injury."},{name:"Rupert Ainsley",profile:"Pavilion steward's son; neat keeper and stubborn late-order batter."},{name:"Fergus Pritchard",profile:"Swing bowler with a groundsman's instinct for damp air."},{name:"Miles Tarrant",profile:"Metronomic seamer who remembers the plan for every batter."},{name:"Gideon Rooke",profile:"Chess-playing off-spinner determined to matter before the fourth innings."},{name:"Tobias Fenwick",profile:"The county's rawest fast bowler; capable of scattering stumps and slips alike."}],reserves:["Edmund Ashcombe","Rory Whitfield","Hugh Denton","Oscar Lethbridge","Niall Broughton","Arthur Meade","Seth Alderton","Laurence Pike"],bowlingStyles:["medium","medium","medium","medium","seam","seam","medium","swing","seam","off_spin","fast"],battingRoles:Jt,keeperIndex:6,captainIndex:3,viceCaptainIndex:4,captaincy:{engineStyle:"conservative",label:"The long game",summary:"Euan Wetherall protects time, wickets and scoreboard position, declaring only when the case has become difficult to resist."},callbacks:{arrival:"Hatherley arrive with the old scorebook open and the familiar belief that patience is an attacking resource.",milestone:"The Hatherley method has produced something substantial: careful work is beginning to acquire authority.",breakthrough:"That is a Hatherley wicket in the old style\u2014pressure shared across the attack, the reward belonging to the whole spell.",pressure:"Hatherley are being asked whether endurance alone is enough; somebody must decide when to change the pace of the game.",victory:"Hatherley close the scorebook on another win, tradition vindicated without quite ending the argument about change."}},{id:"redbank",name:"Redbank Union CC",country:"australia",groundId:"redbank",colours:{primary:"#9d3f2f",secondary:"#173f35",label:"Rust red and bottle green"},emblem:"A red gum",founded:"1912",introduction:"Redbank's railway, depot and community teams combined to save their riverside oval from redevelopment. Its mythology is full of comebacks: a stand rebuilt after fire, an innings won with two substitutes and a seven-for taken after a night shift.",cricketingIdentity:"Positive batting, hard-running fielders and fast bowlers who attack the body and the game in equal measure.",clubQuestion:"Is aggression still courage when everyone expects it?",rivalry:{clubId:"silver_fern",name:"Silver Fern Basin CC",trophy:"The Trans-Tasman Foundry Cup",story:"Redbank's forward pressure meets Silver Fern's collective discipline in a rivalry neither side can hurry."},players:[{name:"Jack Callaghan",profile:"Compact station-country opener, happiest when a quick thinks he is intimidated."},{name:"Mitchell Yarran",profile:"Elegant opener from a long Riverina cricketing family."},{name:"Dev Sandhu",profile:"Restless No. 3 who searches for the run the field has forgotten."},{name:"Lachlan Voss",profile:"Forceful captain who regards every quiet passage as a challenge."},{name:"Arjun Sethi",profile:"Measured vice-captain, clean striker and clever off-cutter bowler."},{name:"Cooper Maddox",profile:"Surf lifesaver and fast-bowling all-rounder with no public concept of fatigue."},{name:"Noah Finlayson",profile:"Genial keeper who remembers every opponent's first-innings mistake."},{name:"Riley Keane",profile:"Left-arm swing bowler determined to prosper beyond coastal air."},{name:"Jalen Briggs",profile:"Workshop-league seamer who maintains pressure without ceremony."},{name:"Kieran Balmain",profile:"Baseball convert whose googly arrived before his stock leg-break."},{name:"Benji Warburton",profile:"Tall, spectacularly quick and the club's most valuable unfinished project."}],reserves:["Mason Dwyer","Ethan Koora","Joel Mercer","Tyler McRae","Nathan Warrigal","Samir Gill","Harrison Vale","Blake Telford"],bowlingStyles:["medium","medium","medium","medium","off_spin","fast","medium","swing","seam","leg_spin","fast"],battingRoles:Jt,keeperIndex:6,captainIndex:3,viceCaptainIndex:4,captaincy:{engineStyle:"aggressive",label:"Forward pressure",summary:"Lachlan Voss crowds the bat, hunts wickets and would rather create a contest than preserve a comfortable position."},callbacks:{arrival:"Redbank have taken their boundary lap; from here they intend to make the match move at their speed.",milestone:"Redbank's positive intent has become a platform rather than a burst of noise.",breakthrough:"The Union quicks have broken through, and the field closes in as though the whole club took the wicket.",pressure:"Redbank are still pressing forward, but courage and impatience are beginning to resemble one another.",victory:"Redbank win without apology, another hard result to add to a club history built on getting back up."}},{id:"gulmohar",name:"Gulmohar Sporting Club",country:"india",groundId:"gulmohar",colours:{primary:"#b43b2f",secondary:"#fff5dc",label:"Vermilion and ivory"},emblem:"A flowering branch",founded:"1924",introduction:"Gulmohar began in a civic reading-room courtyard and still keeps its archive beside poetry, engineering manuals and members' letters. Its annual open net allows any district cricketer six balls without introduction or recommendation.",cricketingIdentity:"Adaptable batting supported by spin, seam and changes of angle used as parts of one long argument.",clubQuestion:"Can eleven different cricketing educations become one side?",rivalry:{clubId:"indus",name:"Indus Gardens CC",trophy:"The Readers' Cup",story:"The clubs exchange books at every tour and then contest the cricket with startling ferocity."},players:[{name:"Aarav Subramaniam",profile:"Patient left-handed opener raised on matting wickets."},{name:"Vihaan Deshpande",profile:"Exuberant opener learning that caution can be a tool rather than a surrender."},{name:"Kabir Sen",profile:"Railway architect who constructs innings in visible stages."},{name:"Mehul Rathore",profile:"Exacting captain who insists present form must outrank reputation."},{name:"Ishan Noor",profile:"Improvising left-hander, skidding seamer and gifted reader of moods."},{name:"Pranav Kulkarni",profile:"Classical off-spinner, powerful sweeper and keeper of the club archive."},{name:"Nikhil Rozario",profile:"Rhythmic keeper-batter from a family of band musicians."},{name:"Gurtej Bains",profile:"Strong farm-raised quick becoming a formidable old-ball bowler."},{name:"Faizal Mir",profile:"Mountain-town swing bowler and accomplished traveller."},{name:"Subhash Iyer",profile:"Fearless leg-spinner who treats every over as a wager."},{name:"Rudra Mahato",profile:"Open-net discovery whose heavy ball unsettles established batters."}],reserves:["Ritesh Nair","Aman Gill","Yusuf Merchant","Samar Chatterjee","Aditya Vyas","Rafiq Contractor","Omkar Pawar","Kunal Basu"],bowlingStyles:["medium","medium","medium","medium","seam","off_spin","medium","fast","swing","leg_spin","fast"],battingRoles:Jt,keeperIndex:6,captainIndex:3,viceCaptainIndex:4,captaincy:{engineStyle:"analytical",label:"Selection by evidence",summary:"Mehul Rathore follows form and match-ups, changing bowlers and fields when the numbers say an old plan has expired."},callbacks:{arrival:"Gulmohar bring many schools of cricket to the same page; the first task is deciding which language this match requires.",milestone:"This innings has acquired the patient architecture Gulmohar value\u2014now comes the question of acceleration.",breakthrough:"Gulmohar's varied attack finds its answer;
