<style>
:root{color-scheme:dark;--bg:#060912;--panel:rgba(11,15,26,.86);--line:rgba(255,255,255,.13);--ink:#f4f0e8;--muted:#9298a8;--gold:#f5b75d;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");mix-blend-mode:soft-light}

.starfield{position:absolute;inset:-30%;opacity:.78;background-image:radial-gradient(circle,#d7e4ff 0 1px,transparent 1.3px),radial-gradient(circle,#fff 0 .7px,transparent 1px),radial-gradient(circle,#9fb8df 0 .8px,transparent 1px);background-size:91px 91px,143px 143px,211px 211px;background-position:17px 9px,45px 71px,103px 29px}
.world{position:absolute;width:1500px;height:1050px;left:0;top:0;transform-origin:0 0;will-change:transform}
.relations{position:absolute;inset:0;width:1500px;height:1050px;overflow:visible;pointer-events:none;z-index:0}.relation{fill:none;stroke:rgba(190,204,230,.13);stroke-width:1.2;stroke-dasharray:4 9}.relation.strong{stroke:rgba(216,225,242,.19);stroke-width:1.5;stroke-dasharray:2 7}
.halo{position:absolute;width:410px;height:410px;border:1px solid color-mix(in srgb,var(--c),transparent 88%);border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--c),transparent 93%),transparent 68%);pointer-events:none}
.halo strong{position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:color-mix(in srgb,var(--c),white 10%);opacity:.42;font-size:14px;text-transform:uppercase;letter-spacing:.2em;white-space:nowrap}
.dot{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;background:transparent;cursor:pointer;animation:float 7s ease-in-out infinite;animation-delay:var(--d);z-index:3}
.dot:before{content:"";position:absolute;inset:-55%;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff 0 9%,color-mix(in srgb,var(--c),white 25%) 14%,var(--c) 32%,color-mix(in srgb,var(--c),transparent 85%) 52%,transparent 72%);filter:drop-shadow(0 0 7px var(--c));transition:.18s ease}
.dot:hover:before,.dot:focus-visible:before,.dot.selected:before{transform:scale(1.55);filter:drop-shadow(0 0 13px var(--c))}.dot:focus-visible{outline:1px solid white;outline-offset:8px}
.dot.hidden{display:none}.dot.dim{opacity:.08;pointer-events:none}
@keyframes float{0%,100%{margin-top:-3px}50%{margin-top:4px}}
.dot .tip{position:absolute;left:50%;bottom:calc(100% + 13px);transform:translateX(-50%) translateY(4px);min-width:150px;max-width:230px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(7,10,18,.94);box-shadow:0 10px 30px #0008;opacity:0;visibility:hidden;pointer-events:none;text-align:center;transition:.15s ease}
.dot:hover .tip,.dot:focus-visible .tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}.tip b{display:block;font:500 13px/1.15 var(--serif)}.tip small{display:block;margin-top:3px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.1em}
.mast{position:fixed;z-index:10;left:24px;right:24px;top:19px;display:grid;grid-template-columns:1fr auto;gap:18px;pointer-events:none}.mast>*{pointer-events:auto}.eyebrow{color:var(--gold);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.18em}.mast h1{margin:4px 0 0;font:500 clamp(28px,3.4vw,48px)/.96 var(--serif);letter-spacing:-.04em}.mast p{max-width:560px;margin:8px 0 0;color:#a9adba;font-size:11px;line-height:1.5}
.controls{display:flex;gap:8px;align-items:flex-start}.search{display:flex;align-items:center;gap:8px;width:min(330px,31vw);height:41px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,18,.72);backdrop-filter:blur(18px)}.search span{color:#8c92a2}.search input{width:100%;border:0;outline:0;background:none;color:white;font-size:12px}.search input::placeholder{color:#73798a}.pill{height:41px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,18,.72);color:#e6dfd2;cursor:pointer;font-size:11px;white-space:nowrap;backdrop-filter:blur(18px)}.pill:hover{background:#171d2c;border-color:#ffffff45}
.legend{position:fixed;z-index:10;left:24px;bottom:23px;width:238px;padding:13px;border:1px solid var(--line);border-radius:18px;background:rgba(7,10,18,.76);backdrop-filter:blur(18px)}.legend-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.legend-head strong{font-size:9px;text-transform:uppercase;letter-spacing:.15em}.legend-head button{border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer}.cluster{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;width:100%;padding:7px;border:0;border-radius:9px;background:none;color:#c6c9d2;text-align:left;cursor:pointer;font-size:10px}.cluster:hover,.cluster.active{background:#ffffff12;color:#fff}.cluster.faded{opacity:.32}.swatch{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}.count{color:#72798b}
.help{position:fixed;z-index:8;right:23px;bottom:23px;display:flex;gap:13px;color:#72798a;font-size:9px;pointer-events:none}.help b{color:#adb2c0}
.drawer{position:fixed;z-index:30;top:12px;right:12px;bottom:12px;width:min(410px,calc(100vw - 24px));display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(150deg,rgba(23,28,44,.98),rgba(7,10,18,.99));box-shadow:-25px 0 80px #0008;transform:translateX(calc(100% + 24px));transition:.38s cubic-bezier(.2,.8,.2,1)}.drawer.open{transform:translateX(0)}.drawer:before{content:"";position:absolute;right:-80px;top:-90px;width:280px;height:280px;border-radius:50%;background:var(--c);filter:blur(60px);opacity:.14}.drawer-head{position:relative;padding:22px 22px 18px;border-bottom:1px solid var(--line)}.close{position:absolute;right:15px;top:15px;width:33px;height:33px;border:1px solid var(--line);border-radius:50%;background:#ffffff09;color:#c3c6d0;cursor:pointer}.num{margin-bottom:18px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.15em}.drawer h2{max-width:310px;margin:0;font:500 34px/1.02 var(--serif);letter-spacing:-.03em}.place{margin-top:7px;color:#a1a6b5;font-size:11px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:17px}.tag{padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:#c8cbd4;font-size:8px;text-transform:uppercase;letter-spacing:.09em}.tag.primary{border-color:color-mix(in srgb,var(--c),transparent 48%);color:var(--c)}.memory{position:relative;padding:22px;overflow:auto;scrollbar-width:thin;scrollbar-color:#30384a transparent}.memory blockquote{margin:0;color:#e8e3da;font:400 18px/1.52 var(--serif)}.memory blockquote:before{content:"“";display:block;height:30px;color:var(--c);font:58px/.8 var(--serif)}.why{margin-top:26px;padding-top:17px;border-top:1px solid var(--line);color:#9298a8;font-size:11px;line-height:1.5}.why strong{display:block;margin-bottom:4px;color:#c7cad3;font-size:9px;text-transform:uppercase;letter-spacing:.13em}.empty{position:fixed;z-index:9;left:50%;top:50%;display:none;transform:translate(-50%,-50%);color:#abb0bd;font:20px var(--serif)}.empty.show{display:block}
@media(max-width:720px){.mast{left:15px;right:15px;top:14px;grid-template-columns:1fr;gap:12px}.mast h1{font-size:31px}.mast p{display:none}.controls{width:100%}.search{width:auto;flex:1}.legend{left:10px;bottom:10px;width:182px;padding:9px}.cluster{padding:5px 6px}.help{display:none}.drawer{top:auto;left:7px;right:7px;bottom:7px;width:auto;height:min(68vh,580px);transform:translateY(calc(100% + 18px))}.drawer.open{transform:translateY(0)}.drawer h2{font-size:29px}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.drawer{transition:none}}
</style>

<header class="mast">
  <div><div class="eyebrow">92 visits · one personal atlas</div><h1>The Wetherspoons Universe</h1><p>A constellation of grand rooms, grim corners, useful toilets and nights that got away. Every dot is a pub; every orbit is a memory.</p></div>

<script>
const DATA={"pubs":[{"id":1,"location":"(East) Dereham","pub":"Romany Rye","comment":"Whilst visiting old pal and bandmate Sam Kemp for what was supposed to be a 'songwriting weekend'. We wrote one song which we ended up calling 'Sexfucker' because we couldn't think of a serious name. Few memories of the spoons, notably John Travolta visited it years after me.","cluster":"people","mood":"Mixed","wl":true,"x":1077.8897352359265,"y":768.0872295295229,"size":12.942857142857143,"delay":"-4.15"},{"id":2,"location":"Aberystwyth","pub":"Hen Orsaf","comment":"Whilst waiting for a train from Aberystwyth with Joey and our girlfriends at the time. It was the last time I saw his girlfriend and the last time he saw mine. Quite a good station pub all things considered.","cluster":"journey","mood":"Mixed","wl":false,"x":1210.2135606428358,"y":159.69280652580775,"size":11.957142857142857,"delay":"-6.50"},{"id":3,"location":"Aldgate","pub":"Goodmans Field","comment":"This was a quick half to get the numbers up. One of the more annoyingly expensive ones. No feelings.","cluster":"functional","mood":"Cold","wl":false,"x":822.4488475943415,"y":896.9411597834912,"size":10.428571428571429,"delay":"-1.88"},{"id":4,"location":"Ashford","pub":"County Hotel","comment":"Whilst desperately trying to extend Fisher away at Kennington into more of a day out. Had lunch. Very middling spoons, though you get the impression that it might be one of the nicer things to do in Ashford which says more about Ashford than the spoons.","cluster":"functional","mood":"Mixed","wl":false,"x":799.6017255512504,"y":957.5937595372818,"size":12.614285714285714,"delay":"-2.33"},{"id":5,"location":"Barkingside","pub":"New Fairlop Oak","comment":"After playing cricket with old friend Kathleen's then boyfriend Samit. I remember getting up to go to the bar to get a round and he said \"can I get something with a bit of *ker-nack sound*\". I actually knew what he meant - hop forward pale ale. Very little happening in this part of London.","cluster":"people","mood":"Mixed","wl":false,"x":1162.0807836737868,"y":612.3169668666251,"size":13.142857142857142,"delay":"-4.06"},{"id":6,"location":"Batley","pub":"Union Rooms","comment":"Glorious building, really beautiful. Had lunch here whilst walking from Leeds to Huddersfield once. I was bored.","cluster":"grand","mood":"Warm","wl":false,"x":360.38949775032944,"y":390.9030868245843,"size":10.6,"delay":"-4.04"},{"id":7,"location":"Beaconsfield","pub":"Hope & Champion","comment":"In a service station! In a service station! Spoons in a service station! Ex Rebecca and I stayed at the Ibis budget next to it whilst going to a wedding nearish to it and had breakfast here the next day. It was absolutely buzzing with Spurs fans.","cluster":"journey","mood":"Mixed","wl":false,"x":1339.09480356238,"y":233.00801635568652,"size":12.514285714285714,"delay":"-2.52"},{"id":8,"location":"Belfast","pub":"Bridge House","comment":"Had a curry in here with Ed and Casimir on a 22 pint stout bender in Belfast. One of the great days. The spoons was the worst pub we went to.","cluster":"chaos","mood":"Cold","wl":false,"x":648.5156427952546,"y":294.89109354487084,"size":11.014285714285714,"delay":"-0.15"},{"id":9,"location":"Birmingham","pub":"Dragon Inn","comment":"Somewhat of a base of operations for the SOAS pool team during a tournament. Happy memories.","cluster":"grand","mood":"Warm","wl":false,"x":306.4462999079234,"y":321.0028724192198,"size":10.314285714285715,"delay":"-6.57"},{"id":10,"location":"Brighton","pub":"Bright Helm","comment":"The most chaotic of the three Brighton spoons and probably my least preferred.","cluster":"chaos","mood":"Mixed","wl":false,"x":962.101768331393,"y":112.6742988640817,"size":10.114285714285714,"delay":"-0.05"},{"id":11,"location":"Brighton","pub":"Post & Telegraph","comment":"The best building of the three Brighton spoons but also the one that smells the most of gravy.","cluster":"grand","mood":"Mixed","wl":false,"x":154.11970962433782,"y":152.57414852622833,"size":10.342857142857143,"delay":"-5.64"},{"id":12,"location":"Brighton","pub":"West Quay","comment":"In a marina and one of my all time favourites. I have very fond memories of being sat upstairs by a window looking out at a formation of starlings dancing over the sea. It felt like they were doing it especially for us.","cluster":"people","mood":"Warm","wl":false,"x":1297.074284879401,"y":930.2267876233384,"size":12.128571428571428,"delay":"-2.56"},{"id":13,"location":"Brixton","pub":"Beehive","comment":"Pure chaos. Toilet cubicles with broken locks. Low ceilings. Loud. Mix of some of Brixton's weirdest locals and people going to whatever's on at the O2 academy. Avoid.","cluster":"chaos","mood":"Cold","wl":false,"x":568.9640353662327,"y":239.80922826602236,"size":11.385714285714286,"delay":"-2.54"},{"id":14,"location":"Brockley","pub":"Brockley Barge","comment":"Pure chaos. One of the best. A rare spoons that is in an actual pub building. Many fond memories with all kinds of friends. Very handy for the Overground.","cluster":"journey","mood":"Warm","wl":false,"x":1267.8006835220879,"y":131.3045255413128,"size":11.2,"delay":"-0.66"},{"id":15,"location":"Bromley","pub":"Greyhound","comment":"I went here once with the brother of the Fisher FC fixture secretary who was a total nightmare. The night was awful but I went along with it because my life was essentially in the absolute pits and I welcomed any human contact. Grim.","cluster":"shadow","mood":"Cold","wl":false,"x":285.90678732508394,"y":550.7877742826797,"size":12.32857142857143,"delay":"-6.25"},{"id":16,"location":"Bromley","pub":"Richmal Crompton","comment":"A large open space that smells of gravy. Handy for the train.","cluster":"journey","mood":"Mixed","wl":false,"x":1365.738335155824,"y":151.44318801739374,"size":9.871428571428572,"delay":"-0.34"},{"id":17,"location":"Camberwell","pub":"Fox on the Hill","comment":"A grand and versatile pub. I love the variety of rooms and gardens to enjoy. A beautiful country pub building. A spoons with a car park in zone 2 London. Sit in the front garden for the first day of summer and sip that Bud Light, squinting at the London Eye. True happiness. Beautiful memories.","cluster":"grand","mood":"Beloved","wl":false,"x":195.38407226898613,"y":389.1830457954663,"size":13.2,"delay":"-6.92"},{"id":18,"location":"Cambridge","pub":"Regal","comment":"Former cinema, massive, brilliant. Went here with Laura and old pal Johnny who was entering a film into a short film festival. It was truly incomprhensible. But the spoons was totally understandable and recognisable as it always is. Went again on a much more recent visit to use the toilets. Clean enough.","cluster":"grand","mood":"Warm","wl":false,"x":94.77964926491967,"y":345.88509195977906,"size":13.357142857142858,"delay":"-3.54"},{"id":19,"location":"Camden","pub":"Ice Wharf","comment":"Unsettlingly wide and busy. A classic location frequented many times, though not one I have ever really enjoyed. Main memories are of asking if we can borrow chairs from other tables to accommodate large groups awkwardly.","cluster":"shadow","mood":"Cold","wl":false,"x":135.44593874317692,"y":829.9740286578494,"size":12.157142857142857,"delay":"-1.33"},{"id":20,"location":"Catford","pub":"London & Rye","comment":"Pure chaos. Gone but never forgotten. The venue for my 50th spoons party. Thank you to everyone who came and made it special.","cluster":"chaos","mood":"Mixed","wl":false,"x":640.9857906435303,"y":66.02656622560752,"size":10.785714285714286,"delay":"-1.91"},{"id":21,"location":"Chatham","pub":"Thomas Waghorn","comment":"Post Fisher away day at Chatham where they were selling pitchers of 'Tropical Rum Punch' which we drank a lot of. We followed it up at the Spoons with pitchers of woo woo then a large bottle of VK on the train home where we might've also then gone on to Zima and Trisha's in Soho. Unforgotten scenes.","cluster":"chaos","mood":"Mixed","wl":false,"x":898.5130819764341,"y":382.97075160368047,"size":13.285714285714285,"delay":"-1.41"},{"id":22,"location":"Chelmsford","pub":"Ivory Peg","comment":"I'd spent the day interviewing people about how they enjoyed the taste of coffee at the Wild Bean Café at a bp petrol station just outside of Chelmsford. I was excited because I was going to be able to expense a Wetherspoons experience. Totally forgettable.","cluster":"journey","mood":"Cold","wl":false,"x":1136.7603375066908,"y":463.38608389386934,"size":12.67142857142857,"delay":"-2.35"},{"id":23,"location":"City (Cannon Street)","pub":"Sir John Hawkshaw","comment":"Strange to say but I think this is the weirdest one. Quite small and very transient, a pub where surely nobody ever gets pissed in. Perfectly designed to hold you for exactly 1 to 2 pints before getting a train back to Sidcup. Feels liminal. Feels nowhere.","cluster":"journey","mood":"Mixed","wl":false,"x":1096.0682687279777,"y":259.8240669171504,"size":12.657142857142857,"delay":"-6.56"},{"id":24,"location":"City (Leadenhall Market)","pub":"Crosse Keys","comment":"The soaring finale of my 28th birthday 'race to 70' spoons night. The hardcore group was totally wankered. Joey threw up on the carpet. Henry kept insisting on us going clubbing. Jack started arguing with someone. It was so good. My boys, my beautiful boys. I felt for the few others who had arrived sober to this one but they had very much missed the main event which was spoons 69 - the Liberty Bounds. ","cluster":"chaos","mood":"Warm","wl":false,"x":706.4887066991494,"y":272.1221096798538,"size":14.785714285714285,"delay":"-0.46"},{"id":25,"location":"City (Liverpool Street)","pub":"Hamilton Hall","comment":"Not a great place. The site of me hitting the wall after walking the Weaver Line. Too expensive. Too many people from Essex.","cluster":"journey","mood":"Mixed","wl":false,"x":1325.1545976716227,"y":257.0639292236631,"size":10.771428571428572,"delay":"-6.45"},{"id":26,"location":"City (Tower Hill)","pub":"Liberty Bounds","comment":"The 69th spoons. Visited first on my 28th birthday with Joey, Henry, and Jack - three of my best boys. There was something so special about us all becoming the worst versions of ourselves at the same time, versions I'd seen before in all of them, but not all at the same time. It was very intimate. Joey became chaotic and kept ordering Limoncello Spritzes to the table. Jack kept dropping coins in pints and insisted that people downed them. Henry became a total moron and kept asking questions like \"what is mayonaise?\". All whilst overlooking the Tower of London. The best and happiest memory I have in a Wetherspoons.","cluster":"chaos","mood":"Mixed","wl":false,"x":601.8630278763791,"y":227.3519837428069,"size":17,"delay":"-3.42"},{"id":27,"location":"Clapham Junction","pub":"London & South Western","comment":"I have had breakfast here twice waiting to get on a train from Clapham Junction. It's strange how many people are carrying hockey sticks in this area on a Saturday morning. Absolutely fine place, no comment.","cluster":"functional","mood":"Mixed","wl":false,"x":750.9470221862709,"y":1017.8558154533218,"size":11.957142857142857,"delay":"-3.81"},{"id":28,"location":"Deal","pub":"Sir Norman Wisdom","comment":"Really jazzy carpet and strange furnishings. The typography is all different. I vaguely remember sitting at a wide coffin shaped table. All weird, don't hate it. ","cluster":"functional","mood":"Mixed","wl":false,"x":511.3756707504202,"y":917.2018666643988,"size":11.314285714285715,"delay":"-0.04"},{"id":29,"location":"Derby","pub":"Standing Order","comment":"Absolutely stunning interior, an old bank. Like drinking in an art gallery. Stupendous. Visited whilst represnting SOAS at the BUCS Snooker Championships. We lost every match.","cluster":"grand","mood":"Warm","wl":false,"x":330.07184677660064,"y":63.310035185379235,"size":11.5,"delay":"-5.55"},{"id":30,"location":"Ealing","pub":"Sir Malcom Balcon","comment":"There are many much much nicer pubs in Ealing than this.","cluster":"functional","mood":"Mixed","wl":false,"x":853.023406735878,"y":748.5307220076736,"size":9.8,"delay":"-3.31"},{"id":31,"location":"Edinburgh","pub":"Booking Office","comment":"Handy for the train. That's about it really.","cluster":"journey","mood":"Mixed","wl":false,"x":1319.3165097995081,"y":162.86090174480705,"size":9.628571428571428,"delay":"-5.59"},{"id":32,"location":"Edinburgh","pub":"Playfair","comment":"Met some family after a sprawling solo pub crawl around Edinburgh and Leith. Enjoyed some chicken wings before we went to watch a Scotland women's football game. The space left no impression on me.","cluster":"people","mood":"Mixed","wl":false,"x":1052.9195632031226,"y":643.6012738805734,"size":11.814285714285715,"delay":"-1.75"},{"id":33,"location":"Edinburgh","pub":"Standing Order","comment":"Gorgeous old bank. Worth visiting.","cluster":"grand","mood":"Warm","wl":false,"x":208.413445549143,"y":370.3417902764169,"size":9.485714285714286,"delay":"-6.11"},{"id":34,"location":"Elephant & Castle","pub":"Rockingham Arms","comment":"Before the refurb it was a masterclass in hostile interior design. After the refurb the chaos has been sligthly masked but ultimately no amount of perfume will ever cover the smell of shite. This is a spoons in Elephant & Castle. It is not 'nice', but you can have a good time. Used to go here a lot before going bowling in the Elephant bowling alley.","cluster":"shadow","mood":"Mixed","wl":false,"x":115.90671461755394,"y":900.9537937292312,"size":14.014285714285714,"delay":"-1.24"},{"id":35,"location":"Faversham","pub":"Leading Light","comment":"There's some really odd gargoyle type things in here that elevate it. The least interesting place to drink in Faversham which is a town full of great places to drink.","cluster":"functional","mood":"Mixed","wl":false,"x":672.6082126525108,"y":674.3637678670459,"size":11.371428571428572,"delay":"-2.45"},{"id":36,"location":"Forest Hill","pub":"Capitol","comment":"Rest in power. Many happy memories in this ex cinema, but the happiest was with my pal Evelyn during the substantial meal rule of covid where we had some food then kept ordering pints to see when they'd tell us to order more food. We got four rounds in. Also remember watching Soccer Aid here and finding out that Boris Karloff's real name was William Pratt.","cluster":"people","mood":"Warm","wl":false,"x":1083.5331117273317,"y":698.8509320126622,"size":14.114285714285714,"delay":"-1.99"},{"id":37,"location":"Gatwick","pub":"Beehive","comment":"I had a curry here once waiting for my mum's flight to land. I watched the 2022 world cup final on my phone during it. A man was taking a younger woman on what seemed to be a terrible date.","cluster":"journey","mood":"Mixed","wl":false,"x":1449.3474858559828,"y":434.81300223860535,"size":11.7,"delay":"-2.97"},{"id":38,"location":"Gatwick","pub":"Red Lion","comment":"Pre flight pint. Happy times.","cluster":"journey","mood":"Warm","wl":false,"x":1332.5054065459265,"y":495.2654711863912,"size":9.414285714285715,"delay":"-0.48"},{"id":39,"location":"Glasgow","pub":"Counting House","comment":"Glorious old bank building which acted as the start and end of a long day boozing in Glasgow. Worth a visit.","cluster":"grand","mood":"Warm","wl":false,"x":467.664725307632,"y":335.9114014011806,"size":10.542857142857143,"delay":"-1.80"},{"id":40,"location":"Gravesend","pub":"Robert Pocock","comment":"Two visits both before watching Fisher play Punjab United. The first time somone walked around handing out slices of cake. Busy in the way Kent town Wetherspoons are where you suspect the people there have nowhere better to go and nothing better to do, such is the dullness of where they live.","cluster":"journey","mood":"Mixed","wl":false,"x":1424.3476206870937,"y":191.4661199922608,"size":13.185714285714287,"delay":"-3.83"},{"id":41,"location":"Great Yarmouth","pub":"Troll Cart","comment":"A few visits during SOAS pool tournaments. The only place I ever did the thing where you put your table number on Facebook and ask people to send you things. Immediately got sent 6 pints of Shipyard Ale and a side of peas. The staff absolutely hated me. The bouncer checked my ID again. \"But you checked it when I came in\" I protested. \"Yeah but I think I should check it again\" he said. When the peas came the server said \"not that you're going to eat them\". To prove a point I ate them and showed up the empty bowl. He laughed at me. Very much at me, not with.","cluster":"chaos","mood":"Mixed","wl":true,"x":662.1322929437274,"y":397.23716590418155,"size":17,"delay":"-4.21"},{"id":42,"location":"Greenwich","pub":"Gate Clock","comment":"I remember having a particularly refreshing Coors Light here partway through a long walk. The upstairs feels like it should be a Chinese restaurant. I will not explain why I fell this way.","cluster":"journey","mood":"Mixed","wl":false,"x":1297.358994451248,"y":121.9257769191776,"size":11.685714285714285,"delay":"-2.96"},{"id":43,"location":"Hackney","pub":"Baxters Court","comment":"Another one of the centres of chaos gradually being phased out. My main memory here is Neil forcing me to stay for another pint just long enough for me to miss the last Overground and having to take a few nightbuses. I had a long meeting the next day with a tricky client. A bad choice.","cluster":"chaos","mood":"Mixed","wl":false,"x":594.7700907846656,"y":271.2095077936241,"size":13.085714285714285,"delay":"-6.90"},{"id":44,"location":"Heathrow","pub":"Crown Rivers","comment":"Almost luxurious in Terminal 5. Happy memories of a last scampi and chips before jetting off somewhere distant. Britain saying one last goodbye.","cluster":"journey","mood":"Warm","wl":false,"x":1232.5549080359274,"y":408.84649322519584,"size":11.057142857142857,"delay":"-5.61"},{"id":45,"location":"Holborn","pub":"Knights Templar","comment":"Gone but never forgotten, another glorious old bank building in t et breakfast after they'd been up all night. Matty threw up several times on Pentonville Road whilst Jack sang \"I'm a spoons man\" to the tune of Soul Man. Not a good pub.","cluster":"chaos","mood":"Warm","wl":false,"x":881.7095978380321,"y":397.70822133193667,"size":12.557142857142857,"delay":"-4.31"},{"id":52,"location":"Islington","pub":"White Swan","comment":"Oddly grand in a 90s way. I like the upstairs. The finishing point of my Windrush Line walk. Never before has a cold pint of Stella Artois tasted so good.","cluster":"journey","mood":"Mixed","wl":false,"x":1369.003549974793,"y":386.68025061055306,"size":11.2,"delay":"-1.25"},{"id":53,"location":"Kings Cross","pub":"Barrel Vault","comment":"Perfectly fine place to be before catching a train though it was slightly ruined by the Unite the Kingdom Tommy Robinson march when I was last there - pints in plastic from 9.30am for that day.","cluster":"journey","mood":"Mixed","wl":false,"x":1195.5861626208011,"y":469.4016589743694,"size":11.757142857142856,"delay":"-3.71"},{"id":54,"location":"Kingston-upon-Hull","pub":"Admiral of the Humber","comment":"A dinner when in Hull with the band. Sam Kemp had two plates of Ham Egg and Chips. No other memories","cluster":"people","mood":"Mixed","wl":true,"x":1154.7369553129045,"y":945.2342176980951,"size":10.428571428571429,"delay":"-1.53"},{"id":55,"location":"Kirkcaldy","pub":"Robert Nairn","comment":"Slightly beautiful. Had a lovely pint of Tennant's with cousin Kitty a while ago.","cluster":"people","mood":"Beloved","wl":false,"x":1055.5676110772984,"y":756.5428674503253,"size":10.157142857142857,"delay":"-0.28"},{"id":56,"location":"Leeds","pub":"Wetherspoons","comment":"Very handy for the train, kind of enjoyable crescent shape, nothing bad to say.","cluster":"journey","mood":"Mixed","wl":false,"x":1181.8231390232997,"y":293.5411134151186,"size":10.128571428571428,"delay":"-2.58"},{"id":57,"location":"Leith","pub":"Foot of the Walk","comment":"A strangely windowless space in Leith. Functioned as a pit stop for some food amidst a sprawling solo pub crawl of Edinburgh which was truly delightful. By far the least interesting pub I went to that day, but sometimes you got to eat.","cluster":"journey","mood":"Mixed","wl":false,"x":1497.1911166453197,"y":354.31842420119284,"size":12.357142857142858,"delay":"-5.47"},{"id":58,"location":"Leytonstone","pub":"Walnut Tree","comment":"Breakfast before walking the Hainault loop. Some shady characters. Very little daylight. Not entirely pleasant and was happy to leave.","cluster":"journey","mood":"Warm","wl":false,"x":1080.474464751763,"y":254.43576665039689,"size":10.914285714285715,"delay":"-6.79"},{"id":59,"location":"London Bridge","pub":"Sun Wharf","comment":"One of the strangest on the list. I was initially excited by the prospect but I find this spoons far too claustrophobic and am confused by the toilets being so easily accessed. A total lack of daylight. Not a nice environment.","cluster":"shadow","mood":"Cold","wl":false,"x":244.12634869507002,"y":870.2786366591961,"size":12.228571428571428,"delay":"-4.48"},{"id":60,"location":"Maidenhead","pub":"Bear","comment":"Went here after completing a section of the Thames walk, I think from Staines to Maidenhead. I remember it being surprisingly nice for a Wetherspoons and enjoyed a satisfying post walk pint.","cluster":"journey","mood":"Mixed","wl":false,"x":1483.6615269354265,"y":396.20535237919194,"size":11.714285714285715,"delay":"-1.50"},{"id":61,"location":"Maidstone","pub":"Society Rooms","comment":"Had a splendid pint of something from the Windsor & Eton brewery here once. Handy for the train. Has some kind of odd hearth thing I can't quite remember which adds good novelty points.","cluster":"journey","mood":"Mixed","wl":false,"x":1341.8727282445961,"y":265.7728880782489,"size":11.642857142857142,"delay":"-1.85"},{"id":62,"location":"Manchester","pub":"Seven Stars","comment":"Days away from the next England game the entire pub was involved in a deafening rendition of '10 German bombers'. Slightly frightening.","cluster":"shadow","mood":"Mixed","wl":false,"x":225.0032061468242,"y":814.948035335022,"size":10.928571428571429,"delay":"-4.72"},{"id":63,"location":"Manchester","pub":"Wetherspoons / Manchester & County","comment":"The worst place I have ever been. Spoons 92 (in honour of the class of 92)","cluster":"shadow","mood":"Cold","wl":false,"x":353.063489377656,"y":665.9472617624023,"size":10.057142857142857,"delay":"-4.32"},{"id":64,"location":"Mile End","pub":"Half Moon","comment":"Where I had my first wetherspoons spice bag. Where I caught the dreamer from the dream. A setting for the brief summer non-binary fling of 2024.","cluster":"functional","mood":"Mixed","wl":false,"x":624.0968744165567,"y":669.0232462216493,"size":11.057142857142857,"delay":"-6.66"},{"id":65,"location":"North Greenwich","pub":"Stargazer","comment":"Did it for the numbers. I find the O2 upsetting and unsettling. There were lots of goths there that day. The table service took about 25 minutes to deliver Jack the Bud Light I got him as a joke. He hated it.","cluster":"shadow","mood":"Cold","wl":false,"x":110.85110949432101,"y":639.976403322836,"size":11.971428571428572,"delay":"-3.34"},{"id":66,"location":"Old Street","pub":"Masque Haunt","comment":"The first stop on the 28th birthday 'race to 70' event. The most wholesome stop of the evening, was genuinely lovely to see my pals. Was busy but had a warm atmosphere.","cluster":"people","mood":"Warm","wl":false,"x":1097.8204129271564,"y":597.1925020731749,"size":11.4,"delay":"-4.33"},{"id":67,"location":"Peckham","pub":"Kentish Drovers","comment":"Chaos. Pure chaos. It's really not for everyone but I sometimes enjoy dipping in here and just watching it all happen. Will be a sad day when it goes.","cluster":"chaos","mood":"Mixed","wl":false,"x":733.4290254222693,"y":353.31091368987444,"size":11.142857142857142,"delay":"-5.14"},{"id":68,"location":"Putney","pub":"Railway","comment":"I think me and Dad had missed the train so waited here for the next one. Handy for the station, useful toilet.","cluster":"journey","mood":"Mixed","wl":false,"x":1379.4593703193925,"y":269.7001930870237,"size":10.571428571428571,"delay":"-6.60"},{"id":69,"location":"Putney","pub":"Rocket","comment":"One of the greats. Luxury West London riverside pinting. The first time I ever saw anyone reserve a table in a Wetherspoons. Feels too nice to be in the portfolio.","cluster":"functional","mood":"Warm","wl":false,"x":548.3742268846775,"y":989.2149344367854,"size":11.32857142857143,"delay":"-4.74"},{"id":70,"location":"Redhill","pub":"Sun","comment":"Came here after a long meandering walk. Had a pint of Thornbridge's Jaipur IPA for a handful of pennies which was excellent. Slightly edgy vibe and has that stale food smell. Classic town centre stuff. Not nice but it gets worse.","cluster":"shadow","mood":"Mixed","wl":false,"x":183.88250267739852,"y":841.0748181794906,"size":12.271428571428572,"delay":"-5.94"},{"id":71,"location":"Rotherhithe","pub":"Surrey Docks","comment":"I have a real soft spot for this place. I've been many times and it is exceedingly useful as a toilet stop. The staff are really friendly and there's always an outside chance of some kind of fight breaking out which is good to watch. A couple of weird old man alcoholics mixed in with the occasional large gathering of old boys speaking Cantonese to each other around their Porettis. Once had a 3 course Christmas meal here with Neil which was a great time.","cluster":"people","mood":"Warm","wl":false,"x":1008.4425829523759,"y":662.9815810471106,"size":15.528571428571428,"delay":"-5.96"},{"id":72,"location":"Royal Tunbridge Wells","pub":"Opera House","comment":"Glorious old Opera House. Worth a visit. Spectacular interior. Wetherspoons gets a lot of credit for keeping such a lovely building open in some way.","cluster":"grand","mood":"Beloved","wl":false,"x":179.4971270885402,"y":395.356448455129,"size":11.128571428571428,"delay":"-5.98"},{"id":73,"location":"Sidcup","pub":"Tailors Chalk","comment":"Did it for the numbers. Not comfortable. I went on to a micropub down the road where they were doing a small beer festival. I met an old guy who was dressed immaculately like David Byrne. That was a much nicer place to visit.","cluster":"functional","mood":"Mixed","wl":false,"x":851.7318765357945,"y":968.060422375539,"size":12.214285714285715,"delay":"-3.06"},{"id":74,"location":"Soho","pub":"Montagu Pyke","comment":"Has some value as an old classic Soho venue that used to be much more interesting but is largely full of English people not from London sheltering from the high prices of Central London. I don't think anyone plans to go here.","cluster":"functional","mood":"Mixed","wl":false,"x":766.2052166527806,"y":807.927496818056,"size":12.214285714285715,"delay":"-5.16"},{"id":75,"location":"Soho","pub":"Moon under Water","comment":"Really useful toilet location. Very middling and nondescript place to drink otherwise.","cluster":"functional","mood":"Mixed","wl":false,"x":834.3460170593117,"y":840.7525947263789,"size":10.228571428571428,"delay":"-3.99"},{"id":76,"location":"Southwark","pub":"Pommelers Rest","comment":"Really useful toilet location. One of those where the app really outperforms ordering at the bar. Odd combo of tourists and pisshead locals. Not a nice place but has some location-based uses.","cluster":"functional","mood":"Mixed","wl":false,"x":610.1676574306003,"y":986.3987040162922,"size":11.728571428571428,"delay":"-5.80"},{"id":77,"location":"St Albans","pub":"Waterend Barn","comment":"If it weren't for the frankly terrible stale food smell this would be rated very highly. It's a beautiful building with one of the better ceilings.","cluster":"grand","mood":"Warm","wl":false,"x":342.3937420517832,"y":278.15662085176695,"size":11.1,"delay":"-3.73"},{"id":78,"location":"Staines","pub":"George","comment":"Ended up here after a Thames walk, I think from Hampton to Staines. Not great, but happily sat outside in the sun. I might have eaten at TGI Friday's afterwards. ","cluster":"journey","mood":"Mixed","wl":false,"x":1280.1028643491254,"y":462.92870335254855,"size":11.314285714285715,"delay":"-1.71"},{"id":79,"location":"Stratford","pub":"Goldengrove","comment":"Quite similar to the Walnut Tree in Leytonstone. Not pleasant and has a lot of edgy characters but does a job in a bit of a dead area.","cluster":"shadow","mood":"Cold","wl":false,"x":376.0652013895824,"y":694.2900108180482,"size":10.914285714285715,"delay":"-5.16"},{"id":80,"location":"Surbiton","pub":"Coronation Hall","comment":"Beauitful building, some kind of old cinema/theatre. The main hall has that stale food smell but you can drink in the lobby quite happily. Very interesting ceiling. A fan.","cluster":"grand","mood":"Mixed","wl":false,"x":420.3200789829648,"y":381.63963452821866,"size":11.442857142857143,"delay":"-4.73"},{"id":81,"location":"Telford","pub":"Thomas Botfield","comment":"Very functional. Was here during a pool tournament for SOAS. I remember refilling the coffee mug up to the brim with espresso and drinking all of that before staying up all night drinking and playing pool with a guy from Sheffield Hallam who was truly mental. Oh the follies of youth.","cluster":"chaos","mood":"Mixed","wl":false,"x":705.6324954662941,"y":337.0058973243887,"size":13.057142857142857,"delay":"-2.24"},{"id":82,"location":"Tooting","pub":"JJ Moons","comment":"Scary toilets.","cluster":"functional","mood":"Mixed","wl":false,"x":468.87453321893815,"y":845.2312460570976,"size":9.2,"delay":"-6.60"},{"id":83,"location":"Turnpike Lane","pub":"Toll Gate","comment":"A spacious and loud one. I must've been on the way to somewhere weird like Enfield Town football club. Not one I visited more than once but I feel vaguely warm towards it.","cluster":"chaos","mood":"Mixed","wl":false,"x":865.6070473802516,"y":69.61899075949376,"size":11.442857142857143,"delay":"-5.59"},{"id":84,"location":"Victoria","pub":"Wetherspoons","comment":"The sky lounge. One of the bubbliest, happiest places in London. I love it at around midday on a Saturday when it's people from Kent and Sussex just coming into London for their big day out talking about where they're going to go. My old trombone teacher who used to play in the pit orchestra for Wicked would apparently walk over to here, drink 2 pints, and be back in position for his first note in the second half every single performance. Also a great people watching location.","cluster":"journey","mood":"Warm","wl":false,"x":1140.5612456433953,"y":489.1526832033052,"size":15.87142857142857,"delay":"-4.33"},{"id":85,"location":"Waterloo","pub":"Lion & Unicorn","comment":"Fairly nondescript and new, preferable to the Brewdog, but there are far more interesting places to drink around Waterloo.","cluster":"functional","mood":"Mixed","wl":false,"x":547.3591190073349,"y":801.4066687753013,"size":10.742857142857144,"delay":"-1.89"},{"id":86,"location":"Welling","pub":"New Cross Turnpike","comment":"I first visited purely because I realised it would be number 49. The toilets are impressively far away from the main bit of the pub. More interesting options are elsewhere.","cluster":"functional","mood":"Mixed","wl":false,"x":604.0897388348424,"y":698.1569713862814,"size":11.457142857142857,"delay":"-5.98"},{"id":87,"location":"Wembley","pub":"JJ Moons","comment":"Goes quite deep. Stopped in to use the toilet and tick it off for the numbers during my Lioness Line walk. Sat outside watching Wembley high street go by. I will not return.","cluster":"journey","mood":"Cold","wl":false,"x":1443.3012950870273,"y":461.657147875526,"size":11.471428571428572,"delay":"-5.21"},{"id":88,"location":"Wigan","pub":"Moon under Water","comment":"One of the few I've been to with my dad. It was a last resort for dinner. Dad exasperated that there wasn't \"even a Pizza Express\" that we could eat at. ","cluster":"people","mood":"Mixe hat grew in the retelling.","terms":["chaos","chaotic","wankered","threw up","fight","bender","pitchers","bouncer","all night","worst versions","scenes","mental","loud","pisshead"]},{"id":"journey","name":"Between places","short":"Journeys","colour":"#55D6D0","x":1280,"y":340,"about":"Stations, airports, long walks and the useful pint between one place and another.","terms":["train","station","flight","terminal","walk","walking","overground","line walk","handy","before catching","pre flight","pit stop","service station","travelodge","airport","thames"]},{"id":"people","name":"People & time","short":"Memories","colour":"#A68BFF","x":1180,"y":780,"about":"Friends, family, old relationships and moments preserved by the pub around them.","terms":["happy memories","fond memories","beautiful memories","friend","pal","boys","dad","mum","cousin","uncle","girlfriend","birthday","band","family","school","lovely","happy times","soft spot"]},{"id":"functional","name":"The utility belt","short":"Functional","colour":"#78D887","x":680,"y":850,"about":"Toilets, breakfasts, quick halves and pubs visited because they did a job.","terms":["for the numbers","numbers up","functional","toilet","breakfast","no comment","no feelings","forgettable","nondescript","middling","absolutely fine","perfectly fine","does a job","that's about it","last resort","useful"]},{"id":"shadow","name":"The shadow realm","short":"Grim","colour":"#7392B7","x":210,"y":720,"about":"Claustrophobia, stale food, hostile rooms and the pubs best viewed from a distance.","terms":["worst","grim","not pleasant","not nice","unpleasant","avoid","claustrophobic","windowless","lack of daylight","no daylight","stale food","smells of gravy","smell of shite","scary","upsetting","unsettling","awful","edgy","hostile","dingy","frightening"]}],"counts":{"grand":13,"chaos":14,"journey":26,"people":13,"functional":17,"shadow":9}};
const semanticCentres={grand:{x:300,y:220},journey:{x:1030,y:190},functional:{x:1260,y:650},shadow:{x:850,y:870},chaos:{x:250,y:740},people:{x:660,y:475}};
DATA.clusters.forEach(c=>Object.assign(c,semanticCentres[c.id]));
const world=document.getElementById("world"),view=document.getElementById("viewport"),drawer=document.getElementById("drawer");
const cmap=Object.fromEntries(DATA.clusters.map(c=>[c.id,c]));
const affinityTerms={
 grand:["glorious","gorgeous","beautiful","stunning","spectacular","old bank","cinema","opera","interior","building","ceiling","grand","art gallery","theatre","rooms","garden","architecture"],
 chaos:["chaos","chaotic","wankered","threw up","vomit","fight","bender","pitchers","bouncer","all night","worst versions","scenes","mental","loud","pisshead","downed","drinking","boozing","pub crawl"],

 functional:["for the numbers","numbers up","functional","toilet","breakfast","no comment","no feelings","forgettable","nondescript","middling","absolutely fine","perfectly fine","does a job","that's about it","last resort","useful","quick half","lunch","dinner","food"],

};
function affinityScore(text,term){if(!text.includes(term))return 0;return 1+Math.min(1.5,(term.split(" ").length-1)*.55)}
function placeByAffinity(p){
 const text=(p.pub+" "+p.location+" "+p.comment).toLowerCase();
 const scores=DATA.clusters.map(c=>({id:c.id,score:affinityTerms[c.id].reduce((n,t)=>n+affinityScore(text,t),0)}));
 scores.find(s=>s.id===p.cluster).score+=2.8;
 scores.sort((a,b)=>b.score-a.score);
 const primary=scores.find(s=>s.id===p.cluster),others=scores.filter(s=>s.id!==p.cluster&&s.score>0);
 const secondary=others[0]||null,tertiary=others[1]||null;
 const secondaryPull=secondary?Math.min(.36,.12+secondary.score/(primary.score+secondary.score+2)*.5):0;
 const tertiaryPull=tertiary?Math.min(.10,tertiary.score/(primary.score+tertiary.score+5)*.18):0;
 const primaryWeight=1-secondaryPull-tertiaryPull;
 const a=cmap[p.cluster],b=secondary?cmap[secondary.id]:a,c=tertiary?cmap[tertiary.id]:a;
 const seed=(p.id*2654435761)>>>0,angle=((seed%1000)/1000)*Math.PI*2;
 const jitter=26+((seed>>>10)%58);
 p.x=a.x*primaryWeight+b.x*secondaryPull+c.x*tertiaryPull+Math.cos(angle)*jitter;
 p.y=a.y*primaryWeight+b.y*secondaryPull+c.y*tertiaryPull+Math.sin(angle)*jitter;
 p.secondary=secondary?secondary.id:null;
 p.secondaryPull=secondaryPull;
 p.affinities=scores;
}
DATA.pubs.forEach(placeByAffinity);
let active=null,query="",selected=null,scale=.72,tx=0,ty=0,drag=null,moved=false;
const dots=[];
function setup(){
 const links=[["grand","people",1],["grand","journey",0],["journey","people",1],["journey","functional",1],["functional","shadow",1],["shadow","chaos",1],["chaos","people",1],["people","shadow",0]];
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","relations");svg.setAttribute("viewBox","0 0 1500 1050");
 links.forEach(([from,to,strong])=>{const a=cmap[from],b=cmap[to],line=document.createElementNS("http://www.w3.org/2000/svg","path"),mx=(a.x+b.x)/2,my=(a.y+b.y)/2-35;line.setAttribute("d","M "+a.x+" "+a.y+" Q "+mx+" "+my+" "+b.x+" "+b.y);line.setAttribute("class","relation"+(strong?" strong":""));svg.append(line)});world.append(svg);
 DATA.clusters.forEach(c=>{const h=document.createElement("div");h.className="halo";h.style.cssText="left:"+c.x+"px;top:"+c.y+"px;--c:"+c.colour;h.innerHTML="<strong>"+c.short+"</strong>";world.append(h)});
 DATA.pubs.forEach(p=>{const b=document.createElement("button");b.className="dot";b.style.cssText="left:"+p.x+"px;top:"+p.y+"px;--c:"+cmap[p.cluster].colour+";--s:"+p.size+"px;--d:"+p.delay+"s";b.setAttribute("aria-label",p.pub+", "+p.location);b.innerHTML='<span class="tip"><b>'+escapeHTML(p.pub)+'</b><small>'+escapeHTML(p.location)+" · "+escapeHTML(cmap[p.cluster].name)+(p.secondary?" ↗ "+escapeHTML(cmap[p.secondary].name):"")+"</small></span>";b.onclick=e=>{e.stopPropagation();if(!moved)openPub(p,b)};world.append(b);dots.push({p,b})});
 const list=document.getElementById("clusterList");DATA.clusters.forEach(c=>{const b=document.createElement("button");b.className="cluster";b.dataset.id=c.id;b.innerHTML='<span class="swatch" style="--c:'+c.colour+'"></span><span>'+c.name+'</span><span class="count">'+DATA.counts[c.id]+"</span>";b.onclick=()=>{active=active===c.id?null:c.id;filter();if(active){scale=Math.max(.8,Math.min(innerWidth/640,innerHeight/640));tx=innerWidth/2-c.x*scale;ty=innerHeight/2-c.y*scale}else fit();render()};list.append(b)});
 fit();filter();render();
}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fit(){scale=Math.max(.42,Math.min(.9,Math.min(innerWidth/1620,innerHeight/1140)));tx=(innerWidth-1500*scale)/2;ty=(innerHeight-1050*scale)/2}
function render(){world.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"}
function match(p){const text=(p.pub+" "+p.location+" "+p.comment).toLowerCase();return(!active||p.cluster===active)&&(!query||text.includes(query))}
function filter(){let n=0;dots.forEach(({p,b})=>{const yes=match(p);b.classList.toggle("hidden",!yes);if(yes)n++});document.querySelectorAll(".cluster").forEach(b=>{b.classList.toggle("active",b.dataset.id===active);b.classList.toggle("faded",!!active&&b.dataset.id!==active)});document.getElementById("empty").classList.toggle("show",n===0)}
function openPub(p,b,centre=false){selected=p;document.querySelectorAll(".dot.selected").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");const c=cmap[p.cluster],secondary=p.secondary?cmap[p.secondary]:null;drawer.style.setProperty("--c",c.colour);document.getElementById("num").textContent="Pub "+String(p.id).padStart(2,"0")+" of 92";document.getElementById("name").textContent=p.pub;document.getElementById("place").textContent=p.location;document.getElementById("quote").textContent=p.comment;document.getElementById("tags").innerHTML='<span class="tag primary">'+c.name+'</span>'+(secondary?'<span class="tag">Also: '+secondary.name+"</span>":"")+'<span class="tag">'+p.mood+"</span>"+(p.wl?'<span class="tag">Wetherspoons Lodge</span>':"");document.getElementById("why").innerHTML="<strong>Why it sits here</strong>Primarily "+c.name.toLowerCase()+". "+(secondary?"Its language also pulls it towards "+secondary.name.toLowerCase()+", so it sits between the two constellations. ":c.about);drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");if(centre){scale=Math.max(scale,1);tx=innerWidth/2-p.x*scale-(innerWidth>720?180:0);ty=innerHeight/2-p.y*scale;render()}}
function close(){selected=null;drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");document.querySelectorAll(".dot.selected").forEach(x=>x.classList.remove("selected"))}
view.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,tx,ty};moved=false;view.classList.add("dragging");view.setPointerCapture(e.pointerId)});
view.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;render()});
view.addEventListener("pointerup",()=>{drag=null;view.classList.remove("dragging")});
view.addEventListener("wheel",e=>{e.preventDefault();const old=scale;scale=Math.max(.32,Math.min(2.2,scale*Math.exp(-e.deltaY*.001)));tx=e.clientX-(e.clientX-tx)*(scale/old);ty=e.clientY-(e.clientY-ty)*(scale/old);render()},{passive:false});
document.getElementById("search").oninput=e=>{query=e.target.value.trim().toLowerCase();filter()};
document.getElementById("random").onclick=()=>{const pool=dots.filter(x=>match(x.p));if(pool.length){const item=pool[Math.floor(Math.random()*pool.length)];openPub(item.p,item.b,true)}};
document.getElementById("all").onclick=()=>{active=null;query="";document.getElementById("search").value="";fit();filter();render()};
document.getElementById("close").onclick=close;addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="/"&&document.activeElement!==document.getElementById("search")){e.preventDefault();document.getElementById("search").focus()}});
addEventListener("resize",()=>{if(!selected){fit();render()}});
setup();
