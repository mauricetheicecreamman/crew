  <style>

  }
  function emptyCounts() { return Object.fromEntries(CODES.map(c => [c, ''])); }

      id, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), status: 'draft',
      setup: {
        observer: model.observer || '', date: localDate(), time: localTime(), league: '', home: { name: '', squad: emptyCounts(), onPitch: emptyCounts(), point: '' },
        away: { name: '', squad: emptyCounts(), onPitch: emptyCounts(), point: '' },
        genderRules: '', rulesOther: '', weather: '', surface: '', pitchSize: '', competitiveness: '',
        context: { derby: false, cup: false, semi: false, final: false, other: '' },
        players: []
      },
      result: { duration: '', homeScore: '', awayScore: '', checked: false, checkedNote: '' },
      transcript: '', events: [], qualitative: [], quickNotes: [], nextIncident: 1,
      assessed: { tackle: false, collision: false, foul: false, contact: false, skill_error: false, other: false, verbal_abuse: false },
      clock: { elapsedMs: 0, runningSince: null, period: 1, started: false }

  function activeMatch() { return model.matches.find(m => m.id === model.activeMatchId) || null; }
  function ensureShape(m) {
    if (!m || typeof m !== 'object') throw new Error('The file does not contain a match.');

    m.setup.away ||= { name: '', squad: emptyCounts(), onPitch: emptyCounts(), point: '' };
    for (const side of ['home','away']) {
      m.setup[side].squad ||= emptyCounts(); m.setup[side].onPitch ||= emptyCounts();
      for (const c of CODES) { m.setup[side].squad[c] ??= ''; m.setup[side].onPitch[c] ??= ''; }
    }
    m.setup.context ||= { derby: false, cup: false, semi: false, final: false, other: '' };
    m.setup.players ||= []; m.result ||= { duration:'',homeScore:'',awayScore:'',checked:false,checkedNote:'' };
    m.events ||= []; m.qualitative ||= []; m.quickNotes ||= []; m.nextIncident ||= m.events.length + 1;
    m.assessed ||= {}; for (const c of Object.keys(CODE_NAMES)) m.assessed[c] ??= false;
    m.clock ||= { elapsedMs:0,runningSince:null,period:1,started:false };

  }
  function openDb() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { resolve(null); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Could not open local match storage.'));
    });
  }
  function dbRead() {
    if (!database) {
      try { return Promise.resolve(JSON.parse(localStorage.getItem(DB_NAME) || 'null')); }
      catch { return Promise.resolve(null); }
    }
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get('current');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  function dbWrite(value) {
    if (!database) {
      try { localStorage.setItem(DB_NAME, JSON.stringify(value)); return Promise.resolve(); }
      catch (err) { return Promise.reject(err); }
    }
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, 'current');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Local save was interrupted.'));
    });
  }
  function markChanged() {
    const m = activeMatch();

    saveTimer = setTimeout(async () => {
      try { await dbWrite(model); setSaveStatus('Saved on this device'); }
      catch (err) { setSaveStatus('Could not save locally', true); console.error(err); }
    }, 250);
  }
  function setSaveStatus(text, bad = false) {

  }
  function toast(text) {
    toastRoot.innerHTML = `<div class="toast">${esc(text)}</div>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 2600);
  }
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function val(value) { return esc(value === null || value === undefined ? '' : value); }
  function getPath(obj, path) { return path.split('.').reduce((o,k) => o?.[k], obj); }
  function setPath(obj, path, value) {
    const parts = path.split('.'); const last = parts.pop();

  }
  function shortDate(s) {

  }

  function elapsedMs(m) {

      </div>

  }
  function renderQuickNotes(m) {
    return `<section class="card"><div class="card-header"><div><h2>Quick note during play</h2><p>Start the match clock once; tap to save a short note with the current period and time.</p></div></div>
      <div class="clock-panel"><div><div class="clock-display" id="clock-display">${formatClock(elapsedMs(m))}</div><div class="clock-meta" id="clock-meta">Period ${m.clock.period||1} · ${m.clock.runningSince?'Clock running':'Clock paused'}</div></div>
        <div class="button-row"><button class="button secondary small" data-clock-toggle>${m.clock.runningSince?'Pause':'Start clock'}</button><button class="button secondary small" data-period-next>Next period</button></div></div>
      <div class="grid" style="margin-top:12px"><div class="field full"><label for="quick-note">Quick note</label><textarea id="quick-note" placeholder="Short observation to follow up after the match">${val(m.quickDraft||'')}</textarea></div><div class="field"><button class="button" type="button" data-add-quick-note>Save timed note</button></div></div>
      ${m.quickNotes.length?`<div class="divider"></div><div class="event-list">${m.quickNotes.slice().reverse().map((n,i)=>`<div class="event-item"><div class="event-id">${esc(n.time||'No time')}</div><div class="event-detail"><strong>Quick note · ${esc(n.id)}</strong><p>${esc(n.text)}</p></div><div class="event-actions"><button class="mini-action" data-delete-quick="${esc(n.id)}" aria-label="Delete note">×</button></div></div>`).join('')}</div>`:''}
    </section>`;
  }
  function assessedPanel(m) {
    return `<section class="card"><div class="card-header"><div><h2>Observation coverage</h2><p>Mark a category as assessed when you have checked it. A checked category with no entries exports zero; an unchecked category remains blank.</p></div></div><div class="chip-row">${Object.keys(CODE_NAMES).map(c=>`<button type="button" class="button ${m.assessed[c]?'small':'secondary small'}" data-assessed="${c}">${m.assessed[c]?'✓ ':''}${esc(CODE_NAMES[c])}</button>`).join('')}</div></section>`;
  }
  function renderEvents(m) {
    if (!m.events.length) return `<div class="empty-state"><h3>No coded incidents yet</h3><p>Add an event after reviewing the transcript. You can mark categories with no incidents as assessed above.</p></div>`;
    return `<div class="event-list">${m.events.slice().reverse().map(e=>`<article class="event-item"><div class="event-id">${esc(e.id)}<br>${esc(e.time||'')}</div><div class="event-detail"><strong>${esc(eventSummary(e))}</strong><p>${esc(e.description||e.transcriptRef||'No description entered')}${e.injury?` · Injury: ${esc([e.injury.bodyPart,e.injury.type].filter(Boolean).join(', ')||'details entered')}`:''}</p></div><div class="event-actions"><button class="mini-action" type="button" data-edit-event="${esc(e.id)}">Edit</button><button class="mini-action" type="button" data-delete-event="${esc(e.id)}" aria-label="Delete ${esc(e.id)}">×</button></div></article>`).join('')}</div>`;
  }
  function renderCode(m) {
    return `<div class="page-head"><div><p class="eyebrow">Step 2 of 3 · transcript coding</p><h1>${esc(displayMatchName(m))}</h1><p class="lede">Code from the transcript after the match. Incident IDs stay attached when an event appears in more than one table.</p></div><button class="button secondary" type="button" data-open-glossary>Category definitions</button></div>
      ${renderQuickNotes(m)}
      <section class="card"><div class="card-header"><div><h2>Transcript</h2><p>Paste text or import a plain-text file. The transcript stays in this browser and is included only in the JSON backup.</p></div></div>
        <div class="grid"><div class="field full"><label for="transcript-search">Find a word or phrase</label><input type="search" id="transcript-search" placeholder="Search transcript text"></div><div class="field full"><div id="search-results" class="search-results"></div></div><div class="field full"><label for="transcript-text">Transcript text</label><textarea class="transcript-area" id="transcript-text" placeholder="Paste or import the match commentary transcript">${val(m.transcript)}</textarea><small class="hint">Selecting a passage and choosing “Use selected transcript excerpt” will copy it into the incident description.</small></div><div class="field"><label class="button secondary" for="transcript-file">Import .txt transcript<input id="transcript-file" type="file" accept=".txt,text/plain,.md,text/markdown" hidden></label></div><div class="field"><button class="button ghost" type="button" data-clear-transcript>Clear transcript</button></div></div>
      </section>
      ${assessedPanel(m)}
      ${renderEventForm(m)}
      <section class="card"><div class="card-header"><div><h2>Coded incidents <span class="table-total">${m.events.length}</span></h2><p>One row can carry multiple applicable codes under the same incident ID.</p></div></div>${renderEvents(m)}</section>
      ${renderQualitative(m)}
      <section id="coding-glossary" class="card glossary"><div class="card-header"><div><h2>Framework definitions</h2><p>Definitions from the observation framework and its risk assessment appendix.</p></div></div>${glossary()}</section>
      <div class="button-row"><button class="button" type="button" data-page="review">Continue to review →</button><button class="button secondary" type="button" data-page="setup">← Fixture setup</button></div>`;
  }

  const QUAL_TYPES = {
    competitiveness: 'Heightened competitiveness', time_wasting: 'Tactical time wasting',
    good_sportsmanship: 'Good sportsmanship', poor_sportsmanship: 'Poor sportsmanship',
    hesitancy: 'Hesitancy about tackles', fun: 'Enjoyment / lack of enjoyment', other: 'Other observation'
  };
  function renderQualitative(m) {
    const q = currentQualEditing ? m.qualitative.find(x=>x.id===currentQualEditing) : null;
    const rows = m.qualitative.length ? `<div class="event-list">${m.qualitative.slice().reverse().map(n=>`<article class="event-item"><div class="event-id">${esc(n.id)}<br>${esc(n.time||'')}</div><div class="event-detail"><strong>${esc(QUAL_TYPES[n.kind]||n.kind)}</strong><p>${esc(n.description||'')}${n.who?` · Involved: ${esc(n.who)}`:''}${n.impact?` · Impact: ${esc(n.impact)}`:''}</p></div><div class="event-actions"><button class="mini-action" type="button" data-edit-qual="${esc(n.id)}">Edit</button><button class="mini-action" type="button" data-delete-qual="${esc(n.id)}" aria-label="Delete observation">×</button></div></article>`).join('')}</div>` : '<p class="footer-note">No qualitative observations added yet.</p>';
    return `<section class="card"><div class="card-header"><div><h2>Qualitative observations</h2><p>Record what happened and the context. Leave causes open where you cannot establish them.</p></div></div>
      <form id="qual-form" class="event-form">
        <div class="field"><label for="qual-kind">Observation type</label><select id="qual-kind" name="kind">${Object.entries(QUAL_TYPES).map(([k,t])=>`<option value="${k}" ${q?.kind===k?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
        <div class="field"><label for="qual-time">Match time / period</label><input id="qual-time" name="time" type="text" placeholder="e.g. P2 31:10" value="${val(q?.time||'')}"></div>
        <div class="field"><label for="qual-who">Who was involved, if known</label><input id="qual-who" name="who" type="text" value="${val(q?.who||'')}"></div>
        <div class="field"><label for="qual-ref">Transcript reference</label><input id="qual-ref" name="transcriptRef" type="text" value="${val(q?.transcriptRef||'')}"></div>
        <div class="field span2"><label for="qual-description">What happened</label><textarea id="qual-description" name="description" rows="3">${val(q?.description||'')}</textarea></div>
        <div class="field"><label for="qual-context">Context / possible reason</label><textarea id="qual-context" name="context" rows="2">${val(q?.context||'')}</textarea></div>
        <div class="field"><label for="qual-impact">Impact on player(s) or game</label><textarea id="qual-impact" name="impact" rows="2">${val(q?.impact||'')}</textarea></div>
        <div class="field span2 button-row"><button class="button" type="submit">${q?'Save observation':'Add qualitative observation'}</button>${q?'<button class="button secondary" type="button" data-cancel-qual>Cancel edit</button>':''}</div>
      </form>
      ${rows}
    </section>`;
  }

  function eventCount(m, code, filter = null) {
    return m.events.filter(e => (e.codes||[]).includes(code) && (!filter || filter(e))).reduce((sum,e)=>sum+(Number(e.count)||1),0);
  }
  function pairRows() {
    const rows=[];
    for (const a of CODES) for (const b of CODES) rows.push({ actor:a, receiver:b, key:`${a}>${b}`, text:`${a} on ${b}` });
    return rows;
  }
  function rowCounts(m, code, row) {
    const matching = m.events.filter(e => (e.codes||[]).includes(code) && (code==='skill_error' ? e.receiver===row.receiver : (e.actor||'UNK')===row.actor && (e.receiver||'UNK')===row.receiver));
    const result = Object.fromEntries(OUTCOMES.map(o=>[o,0]));
    for (const e of matching) result[e.outcome||'unknown'] += Number(e.count)||1;
    return result;
  }
  function catTotal(m, code) { return eventCount(m,code); }
  function outcomeShort(o) { return ({no_treatment:'No treat',treatment_continue:'Treat + continue',unable_continue:'Came off',unknown:'Unknown'})[o]; }
  function tableRowsFor(m, code) {
    const pairings = code==='skill_error' ? CODES.map(c=>({actor:null,receiver:c,key:`single:${c}`,text:`Affected: ${c} · ${CAT[c]}`})) : pairRows();
    const assessed=!!m.assessed[code];
    const rows=pairings.map(p=>{
      const counts=rowCounts(m,code,p);
      return `<div class="pair-row"><span class="pair-label">${esc(p.text)}</span>${OUTCOMES.map(o=>`<span class="pair-count ${assessed?'':'blank'}" data-label="${esc(outcomeShort(o))}">${assessed?counts[o]:'—'}</span>`).join('')}<span class="pair-count ${assessed?'':'blank'}" data-label="Total">${assessed?Object.values(counts).reduce((a,b)=>a+b,0):'—'}</span></div>`;
    }).join('');
    const total=assessed?catTotal(m,code):'—';
    return `<details class="table-group"><summary><span>${esc(CODE_NAMES[code])}</span><span class="table-total">${assessed?`${total} total`:'Not assessed'}</span></summary><div class="table-content">
      <div class="pair-row header"><span>${code==='skill_error'?'Affected category':'Actor on receiver'}</span>${OUTCOMES.map(o=>`<span>${esc(outcomeShort(o))}</span>`).join('')}<span>Total</span></div>${rows}
      <div class="pair-row"><span class="pair-label">Column total</span>${OUTCOMES.map(o=>{const col=m.events.filter(e=>(e.codes||[]).includes(code)&&(e.outcome||'unknown')===o).reduce((s,e)=>s+(Number(e.count)||1),0);return `<span class="pair-count ${assessed?'':'blank'}" data-label="${esc(outcomeShort(o))}">${assessed?col:'—'}</span>`}).join('')}<span class="pair-count ${assessed?'':'blank'}" data-label="Total">${assessed?total:'—'}</span></div>
      </div></details>`;
  }
  function verbalSummary(m) {
    const roles=['player','coach','spectator','unknown'];
    const assessed=!!m.assessed.verbal_abuse;
    return `<div class="psych-header"><span>Source</span><span>Description</span><span>Frequency</span></div>${roles.map(role=>{
      const matches=m.events.filter(e=>(e.codes||[]).includes('verbal_abuse')&&(e.sourceRole||'unknown')===role);
      const freq=matches.reduce((s,e)=>s+(Number(e.count)||1),0);
      const notes=[...new Set(matches.map(e=>e.description).filter(Boolean))].join(' · ');
      return `<div class="psych-row"><span class="pair-label">${role==='unknown'?'Unknown / not recorded':role[0].toUpperCase()+role.slice(1)}</span><span class="psych-description">${esc(notes||'')}</span><span class="pair-count ${assessed?'':'blank'}" data-label="Frequency">${assessed?freq:'—'}</span></div>`;
    }).join('')}<div class="callout">Table 3 total: ${assessed?eventCount(m,'verbal_abuse'):'not assessed'}${assessed?' observations':''}.</div>`;
  }
  function profileWarnings(m) {
    const warnings=[]; const s=m.setup;
    if (!s.date) warnings.push('Match date has not been recorded.');
    if (!s.home.name || !s.away.name) warnings.push('Enter both team names when known.');
    if (!s.competitiveness) warnings.push('Contextual match competitiveness has not been selected.');
    for (const side of ['home','away']) for(const c of CODES) {
      const squad=Number(s[side].squad[c]);const on=Number(s[side].onPitch[c]);
      if(s[side].squad[c]!==''&&s[side].onPitch[c]!==''&&on>squad) warnings.push(`${side==='home'?'Home':'Away'} ${CAT[c]} on-pitch count exceeds the squad count.`);
    }
    const duration=Number(m.result.duration);
    if(duration>0) for(const p of s.players) if(Number(p.minutes)>duration) warnings.push(`${p.label||'A player'} has more minutes than the match duration.`);
    if((m.result.homeScore!==''||m.result.awayScore!=='')&&(m.result.homeScore===''||m.result.awayScore==='')) warnings.push('One score field is still blank.');
    for(const e of m.events) if(e.injury){
      if(e.outcome==='unable_continue'&&e.injury.cameOff==='no')warnings.push(`${e.id}: outcome says the player came off, but injury details say they did not.`);
      if(e.outcome==='treatment_continue'&&e.injury.cameOff==='yes')warnings.push(`${e.id}: outcome says the player continued, but injury details say they came off.`);
    }
    const notAssessed=Object.keys(CODE_NAMES).filter(c=>!m.assessed[c]);
    if(notAssessed.length) warnings.push(`${notAssessed.length} observation ${notAssessed.length===1?'category is':'categories are'} still marked not assessed.`);
    return warnings;
  }
  function renderReview(m) {
    const warnings=profileWarnings(m);
    const eventN=m.events.reduce((s,e)=>s+(Number(e.count)||1),0);
    const injuryN=m.events.filter(e=>e.injury).length;
    const totalQual=m.qualitative.length+m.quickNotes.length;
    const context=[m.setup.context.derby?'Local derby':'',m.setup.context.cup?'Cup match':'',m.setup.context.semi?'Semi-final':'',m.setup.context.final?'Final':'',m.setup.context.other].filter(Boolean).join(', ')||'Not recorded';
    return `<div class="page-head"><div><p class="eyebrow">Step 3 of 3 · review and export</p><h1>Review match</h1><p class="lede">Check the profile, observation coverage and calculated tables. You can still export a partial match.</p></div><button class="button" type="button" data-export-xlsx>Download Excel</button></div>
      <div class="summary-strip"><div class="summary-stat"><strong>${eventN}</strong><span>coded event count</span></div><div class="summary-stat"><strong>${injuryN}</strong><span>injury records</span></div><div class="summary-stat"><strong>${totalQual}</strong><span>qualitative / quick notes</span></div><div class="summary-stat"><strong>${m.result.homeScore!==''&&m.result.awayScore!==''?`${val(m.result.homeScore)}–${val(m.result.awayScore)}`:'—'}</strong><span>home–away score</span></div></div>
      <section class="card"><div class="card-header"><div><h2>Check before export</h2><p>These are reminders; they do not prevent a partial download.</p></div></div><ul class="warning-list">${warnings.length?warnings.map(w=>`<li class="warning">${esc(w)}</li>`).join(''):'<li class="warning ok">No setup inconsistencies found.</li>'}</ul><p class="footer-note">Unknown / not recorded is a valid coded response. Unassessed table cells remain blank; assessed cells with no events show zero.</p></section>
      <section class="card"><div class="card-header"><div><h2>Match profile</h2><p>${esc(m.id)} · ${esc(FRAMEWORK_VERSION)}</p></div><button class="button secondary small" data-page="setup">Edit fixture</button></div><div class="kv-grid">
        ${kv('Observer',m.setup.observer)}${kv('Date and time',[shortDate(m.setup.date),m.setup.time].filter(Boolean).join(' · '))}${kv('League',m.setup.league)}${kv('Home team',m.setup.home.name)}${kv('Away team',m.setup.away.name)}${kv('Rules',rulesLabel(m.setup.genderRules,m.setup.rulesOther))}${kv('Weather',m.setup.weather)}${kv('Surface',m.setup.surface)}${kv('Pitch size',m.setup.pitchSize)}${kv('Competitiveness',m.setup.competitiveness?`Level ${m.setup.competitiveness}`:'Not recorded')}${kv('Context',context)}${kv('Duration',m.result.duration?`${m.result.duration} minutes`:'Not recorded')}${kv('Final score',m.result.homeScore!==''&&m.result.awayScore!==''?`${m.result.homeScore}–${m.result.awayScore}`:'Not recorded')}${kv('Result check',m.result.checked?'Checked with referee / coach':'Not checked')}
      </div><div class="divider"></div><div class="team-grid">${['home','away'].map(side=>`<div class="team-card"><h3>${esc(m.setup[side].name|| (side==='home'?'Home team':'Away team'))} · squad / on pitch</h3><div class="kv-grid">${CODES.map(c=>kv(CAT[c],`${m.setup[side].squad[c]||'—'} / ${m.setup[side].onPitch[c]||'—'}`)).join('')}</div><p class="footer-note">On-pitch count: ${esc(m.setup[side].point||'point not recorded')}</p></div>`).join('')}</div></section>
      <section class="card"><div class="card-header"><div><h2>Table 1 · levels of contact</h2><p>Tackle and collision counts by ordered participant pairing and outcome. All 36 directed pairings are available.</p></div></div>${TABLES.table1.map(c=>tableRowsFor(m,c)).join('')}</section>
      <section class="card"><div class="card-header"><div><h2>Table 2 · injury risk factors</h2><p>“Unable to continue” means the player had to come off because of the incident.</p></div></div>${TABLES.table2.map(c=>tableRowsFor(m,c)).join('')}</section>
      <section class="card"><div class="card-header"><div><h2>Table 3 · psychological risk factors</h2><p>Verbal abuse towards a player, summarised by source.</p></div></div><details class="table-group"><summary><span>Verbal abuse towards player</span><span class="table-total">${m.assessed.verbal_abuse?`${eventCount(m,'verbal_abuse')} total`:'Not assessed'}</span></summary><div class="table-content">${verbalSummary(m)}</div></details></section>
      <section class="card"><div class="card-header"><div><h2>Injuries and qualitative notes</h2><p>These detail sheets retain the incident IDs and transcript references.</p></div><div class="button-row"><button class="button secondary small" data-page="code">Edit coding</button></div></div><div class="kv-grid">${kv('Injury records',injuryN)}${kv('Qualitative observations',m.qualitative.length)}${kv('Quick notes',m.quickNotes.length)}${kv('Player-time records',m.setup.players.length)}</div></section>
      <section class="card"><div class="card-header"><div><h2>Download and backup</h2><p>The Excel workbook has analysis-ready sheets. The JSON file is a full backup including the transcript.</p></div></div><div class="button-row"><button class="button" data-export-xlsx>Download Excel workbook</button><button class="button secondary" data-export-json="${esc(m.id)}">Download JSON backup</button><button class="button secondary" data-export-all-json>Backup all matches</button></div><p class="footer-note">Your browser may ask where to save the file. Export stays on this device; nothing is uploaded.</p></section>
      <div class="button-row"><button class="button secondary" type="button" data-page="code">← Back to coding</button><button class="button ${m.status==='reviewed'?'secondary':''}" type="button" data-mark-reviewed>${m.status==='reviewed'?'Mark as in progress':'Mark match reviewed'}</button></div>
      <section class="card glossary"><div class="card-header"><div><h2>Framework definitions</h2><p>Reference definitions from the attached framework.</p></div></div>${glossary()}</section>`;
  }
  function kv(k,v) { return `<div class="kv"><span>${esc(k)}</span><strong>${esc(v===null||v===undefined||v===''?'Not recorded':String(v))}</strong></div>`; }
  function rulesLabel(code, other) {
    return ({min1:'Minimum 1 female per team',min2:'Minimum 2 females per team',min3:'Minimum 3 females per team',any:'Any gender composition',not_aware:'Not aware',other:other||'Other'})[code]||'Not recorded';
  }
  function glossary() {
    const definitions=[
      ['Tackle','An attempt to obtain possession of the ball from the opposition by using the feet.'],
      ['Collision','A forceful coming together of two or more players.'],
      ['Foul','A call by the referee denoting an unfair act.'],
      ['Contact','Player-to-player contact that is not classed as a tackle, foul or collision.'],
      ['Skill error / fall / slip / stumble','A mistake such as a slip, fall or stumble that did not result from external force.'],
      ['Other risk factor','A risk factor occurring in the match that is not covered by the preceding categories.'],
      ['Verbal abuse towards a player','Name-calling, constant teasing, sarcasm, racist, sexist or homophobic taunts, threats and gestures.'],
      ['No treatment','The player continued without treatment.'],
      ['Treatment required','The player required treatment and was able to continue.'],
      ['Unable to continue','The player had to come off because of the incident, whether or not treatment was also received.'],
      ['Hazard','Something with the potential to cause harm.'],
      ['Risk','The likelihood that harm from a particular hazard is experienced.'],
      ['Risk assessment','Identify relevant hazards, estimate likelihood and severity, compare risks using a priority matrix, and identify ways to reduce residual risk. Risk cannot always be eliminated.'],
      ['Severity · None','Very slight or no physical injury, cost or damage to reputation.'],
      ['Severity · Minor','First aid; the player can continue. Minor cost or damage to reputation.'],
      ['Severity · Moderate','Medical attention and/or the player is unable to continue. Moderate cost or damage to reputation.'],
      ['Severity · Severe','Disabling or fatal injury, or significant cost or reputation damage that would impair the FA’s ability to function.'],
      ['Likelihood · Very likely','Under prevailing conditions, an incident is very difficult to avoid and is anticipated many times a year.'],
      ['Likelihood · Likely','An incident requires some fault or abnormality; an annual event or several times in a season.'],
      ['Likelihood · Possible','Several factors need to be present; it could occur occasionally within a five-year period.'],
      ['Likelihood · Not likely','Only exceptional conditions would lead to an incident; the framework compares it to being struck by lightning in the UK.'],
      ['Risk matrix · Low','No further action required.'],
      ['Risk matrix · Medium','Action to reduce residual risk is required.'],
      ['Risk matrix · Severe','Current risk is unacceptable; the activity should stop immediately.']
    ];
    return definitions.map(([title,body])=>`<details><summary>${esc(title)}</summary><p>${esc(body)}</p></details>`).join('');
  }

  function makeProfileRows(m) {
    const s=m.setup, r=m.result;
    const rows=[
      ['Match ID',m.id],['Framework version',FRAMEWORK_VERSION],['Export date',new Date().toISOString()],
      ['Observer',s.observer],['Match date',s.date],['Kick-off time',s.time],['League',s.league],
      ['Home team',s.home.name],['Away team',s.away.name],['Gender composition rules',rulesLabel(s.genderRules,s.rulesOther)],
      ['Weather conditions',s.weather],['Surface',s.surface],['Pitch size',s.pitchSize],
      ['Contextual competitiveness level',s.competitiveness],['Local derby',s.context.derby?'Yes':'No'],['Cup match',s.context.cup?'Yes':'No'],
      ['Semi-final',s.context.semi?'Yes':'No'],['Final',s.context.final?'Yes':'No'],['Other competitiveness context',s.context.other],
      ['Match duration minutes',numOrBlank(r.duration)],['Home score',numOrBlank(r.homeScore)],['Away score',numOrBlank(r.awayScore)],
      ['Result checked with referee or coach',r.checked?'Yes':'No'],['Result check note',r.checkedNote]
    ];
    for(const side of ['home','away']) {
      for(const c of CODES) {
        rows.push([`${side} squad ${c} (${CAT[c]})`,numOrBlank(s[side].squad[c])]);
        rows.push([`${side} on-pitch ${c} (${CAT[c]})`,numOrBlank(s[side].onPitch[c])]);
      }
      rows.push([`${side} on-pitch count reference point`,s[side].point]);
    }
    for(const c of Object.keys(CODE_NAMES)) rows.push([`Table coverage: ${CODE_NAMES[c]}`,m.assessed[c]?'Assessed':'Not assessed']);
    return rows;
  }
  function numOrBlank(v) { return v === '' || v === null || v === undefined || Number.isNaN(Number(v)) ? null : Number(v); }
  function tableExportRows(m,codes,tableName) {
    const rows=[];
    for(const code of codes) {
      const assessed=!!m.assessed[code];
      const entries=code==='skill_error' ? CODES.map(c=>({actor:null,receiver:c})) : pairRows();
      for(const pair of entries) {
        const counts=rowCounts(m,code,pair);
        rows.push([
          m.id,tableName,CODE_NAMES[code],code==='skill_error'?'AFFECTED_CATEGORY':'PAIRING',pair.actor||'',pair.receiver||'',code==='skill_error'?pair.receiver:'',
          assessed?counts.no_treatment:null,assessed?counts.treatment_continue:null,assessed?counts.unable_continue:null,assessed?counts.unknown:null,
          assessed?Object.values(counts).reduce((a,b)=>a+b,0):null,assessed?'Yes':'No'
        ]);
      }
      const totals=Object.fromEntries(OUTCOMES.map(o=>[o,m.events.filter(e=>(e.codes||[]).includes(code)&&(e.outcome||'unknown')===o).reduce((s,e)=>s+(Number(e.count)||1),0)]));
      rows.push([m.id,tableName,CODE_NAMES[code],'CATEGORY_TOTAL','','','',assessed?totals.no_treatment:null,assessed?totals.treatment_continue:null,assessed?totals.unable_continue:null,assessed?totals.unknown:null,assessed?Object.values(totals).reduce((a,b)=>a+b,0):null,assessed?'Yes':'No']);
    }
    return rows;
  }
  function table3Rows(m) {

    if(target.id==='home-button'){model.activeMatchId=null;page='home';currentEditing=null;currentQualEditing=null;render();return;}
    if(target.dataset.page){const next=target.dataset.page;if(next==='home'){model.activeMatchId=null;page='home';render();return;}setPage(next);return;}
    if(target.hasAttribute('data-create-match')){createMatchDraft();return;}
    if(target.dataset.openMatch){model.activeMatchId=target.dataset.openMatch;const m=activeMatch();page=m?.currentPage||'setup';render();return;}
    if(target.dataset.deleteMatch){const m=model.matches.find(x=>x.id===target.dataset.deleteMatch);if(m&&confirm(`Delete ${displayMatchName(m)} and all its local observations?`)){model.matches=model.matches.filter(x=>x.id!==m.id);if(model.activeMatchId===m.id)model.activeMatchId=null;page='home';markChanged();render();toast('Match deleted from this browser.');}return;}
    if(target.dataset.exportJson){const m=model.matches.find(x=>x.id===target.dataset.exportJson);if(m)exportJson(m);return;}
    if(target.hasAttribute('data-export-all-json')){exportAllJson();return;}
    if(target.hasAttribute('data-export-xlsx')){const m=activeMatch();if(m)exportExcel(m);return;}
    if(target.hasAttribute('data-mark-reviewed')){const m=activeMatch();m.status=m.status==='reviewed'?'draft':'reviewed';markChanged();render();toast(m.status==='reviewed'?'Match marked reviewed.':'Match reopened.');return;}
    if(target.hasAttribute('data-add-player')){const m=activeMatch();m.setup.players.push({id:`P-${Date.now().toString(36).toUpperCase()}`,label:'',side:'home',category:'',minutes:''});markChanged();render();return;}
    if(target.dataset.removePlayer){const m=activeMatch();m.setup.players=m.setup.players.filter(p=>p.id!==target.dataset.removePlayer);markChanged();render();return;}
    if(target.dataset.assessed){const m=activeMatch();m.assessed[target.dataset.assessed]=!m.assessed[target.dataset.assessed];markChanged();render();return;}
    if(target.hasAttribute('data-clock-toggle')){
      const m=activeMatch(),c=m.clock;
      if(c.runningSince){c.elapsedMs=elapsedMs(m);c.runningSince=null;}else{c.runningSince=Date.now();c.started=true;}
      markChanged();render();return;
    }
    if(target.hasAttribute('data-period-next')){const m=activeMatch();m.clock.elapsedMs=elapsedMs(m);m.clock.runningSince=null;m.clock.period=(Number(m.clock.period)||1)+1;m.clock.started=true;markChanged();render();toast(`Period ${m.clock.period}. Start the clock when ready.`);return;}
    if(target.hasAttribute('data-add-quick-note')){const m=activeMatch(),input=$('#quick-note');const text=(input?.value||'').trim();if(!text){toast('Write a short note first.');return;}m.quickNotes.push({id:nextNoteId('QUICK'),time:currentMatchTime(m),text});if(input)input.value='';markChanged();render();toast('Timed note saved.');return;}
    if(target.dataset.deleteQuick){const m=activeMatch();m.quickNotes=m.quickNotes.filter(n=>n.id!==target.dataset.deleteQuick);markChanged();render();return;}
    if(target.dataset.editEvent){currentEditing=target.dataset.editEvent;render();setTimeout(()=>$('#event-form')?.scrollIntoView({behavior:'smooth',block:'start'}),60);return;}
    if(target.dataset.deleteEvent){const m=activeMatch();if(confirm(`Delete incident ${target.dataset.deleteEvent}?`)){m.events=m.events.filter(e=>e.id!==target.dataset.deleteEvent);if(currentEditing===target.dataset.deleteEvent)currentEditing=null;markChanged();render();toast('Incident deleted.');}return;}
    if(target.hasAttribute('data-cancel-edit')){currentEditing=null;render();return;}
    if(target.hasAttribute('data-add-excerpt')){const transcript=$('#transcript-text');const start=transcript?.selectionStart||0,end=transcript?.selectionEnd||0;const excerpt=start!==end?transcript.value.slice(start,end):'';if(!excerpt){toast('Select a passage in the transcript first.');return;}const desc=$('#event-description');desc.value=[desc.value.trim(),excerpt].filter(Boolean).join('\n');toast('Selected passage added to the incident description.');return;}
    if(target.hasAttribute('data-clear-transcript')){if(confirm('Clear the transcript text from this match?')){const m=activeMatch();m.transcript='';markChanged();render();}return;}
    if(target.dataset.searchIndex){const area=$('#transcript-text'),start=Number(target.dataset.searchIndex),end=Number(target.dataset.searchEnd);area?.focus();area?.setSelectionRange(start,end);if(area)area.scrollTop=Math.max(0,(area.value.slice(0,start).match(/\n/g)||[]).length*18-70);return;}
    if(target.dataset.editQual){currentQualEditing=target.dataset.editQual;render();setTimeout(()=>$('#qual-form')?.scrollIntoView({behavior:'smooth',block:'start'}),60);return;}
    if(target.dataset.deleteQual){const m=activeMatch();if(confirm('Delete this qualitative observation?')){m.qualitative=m.qualitative.filter(q=>q.id!==target.dataset.deleteQual);markChanged();render();}return;}
    if(target.hasAttribute('data-cancel-qual')){currentQualEditing=null;render();return;}
    if(target.hasAttribute('data-open-glossary')){$('#coding-glossary')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
  });

  document.addEventListener('input',(event)=>{
    const el=event.target;const m=activeMatch();if(!m)return;
    if(el.dataset.bind){setPath(m,el.dataset.bind,el.value);markChanged();return;}
    if(el.dataset.playerField){const row=el.closest('[data-player]');const p=m.setup.players.find(x=>x.id===row?.dataset.player);if(p){p[el.dataset.playerField]=el.value;markChanged();}return;}
    if(el.id==='transcript-text'){m.transcript=el.value;markChanged();return;}
    if(el.id==='transcript-search'){showSearchResults(el.value);return;}
    if(el.id==='quick-note'){m.quickDraft=el.value;markChanged();return;}
    if(el.name==='codes'&&el.form?.id==='event-form'){refreshEventFormVisibility();return;}
    if(el.id==='has-injury'){refreshEventFormVisibility();return;}
  });
  document.addEventListener('change',(event)=>{
    const el=event.target;const m=activeMatch();if(!m)return;
    if(el.dataset.bind){setPath(m,el.dataset.bind,el.value);markChanged();return;}
    if(el.dataset.radio){setPath(m,el.dataset.radio,el.value);markChanged();return;}
    if(el.dataset.check){setPath(m,el.dataset.check,el.checked);markChanged();return;}
    if(el.dataset.playerField){const row=el.closest('[data-player]');const p=m.setup.players.find(x=>x.id===row?.dataset.player);if(p){p[el.dataset.playerField]=el.value;markChanged();}return;}
    if(el.id==='transcript-file'&&el.files?.[0]){const file=el.files[0];file.text().then(text=>{m.transcript=text;markChanged();render();toast('Transcript imported.');}).catch(()=>toast('Could not read that text file.'));el.value='';return;}
    if(el.id==='import-json'&&el.files?.[0]){importBackup(el.files[0]);return;}
    if(el.id==='has-injury'){refreshEventFormVisibility();return;}
    if(el.name==='codes'&&el.form?.id==='event-form'){refreshEventFormVisibility();return;}
  });
  document.addEventListener('submit',(event)=>{
    if(event.target.id==='event-form'){event.preventDefault();submitEvent(event.target);return;}
    if(event.target.id==='qual-form'){event.preventDefault();submitQual(event.target);return;}
  });

  async function init() {
    try { database=await openDb(); } catch(err) { console.warn('IndexedDB unavailable; trying local browser storage.',err);database=null; }
    try {
      const saved=await dbRead();
      if(saved&&Array.isArray(saved.matches)){model=saved;model.matches.forEach(ensureShape);page=activeMatch()?.currentPage||'home';}
      setSaveStatus('Saved on this device');
    } catch(err) { console.error(err);setSaveStatus('Local storage unavailable',true); }
    render();
    registerWebMCP();
    tickTimer=setInterval(()=>{const m=activeMatch();const display=$('#clock-display');if(m&&display){display.textContent=formatClock(elapsedMs(m));const meta=$('#clock-meta');if(meta)meta.textContent=`Period ${m.clock.period||1} · ${m.clock.runningSince?'Clock running':'Clock paused'}`;}},1000);
  }
  window.addEventListener('pagehide',()=>{webmcpLifecycle?.abort();if(saveTimer){clearTimeout(saveTimer);dbWrite(model).catch(()=>{});}});
  init();
})();

  </script>
</body>
</html>
